openapi: 3.1.0
info:
  title: 가치타 API
  version: 0.22.0
  summary: 여행 세션, 기기 프로필과 이메일 계정, 동승 연결, 부탁, 장면, 기록본, 화자 대조, 여행 전체 음성
  description: |
    웹앱(frontend/web)과 차량 앱(frontend/car)이 부르는 API입니다. 구현은 backend/api/server.js입니다.

    - 일반 본문은 JSON이고 10 KB를 넘으면 413입니다. 발화 묶음(`/utterances`)은 1 MB까지 받습니다. WAV와 MP4·WebM 이진 업로드는 각 경로의 별도 한도를 따릅니다.
    - 오류는 `{ "error": "이유", "type": "종류" }`로 옵니다. 클라이언트는 문장이 아니라 `type`으로 가릅니다(T71).
    - 기기 프로필 토큰이 있으면 `Authorization: Bearer <토큰>`으로 보냅니다. 기기 프로필에 이메일·비밀번호를 붙이면(`POST /api/accounts`) 차와 폰에서 같은 프로필로 로그인합니다(`POST /api/sessions`, T128, docs/api/accounts.md).
    - 구글 OAuth로 프로필을 찾아 이어 받을 수 있습니다(ADR-0006). 현대 계정 연동은 아직 없습니다(ADR-0004).
    - 여행·발화·영상은 생성 시각을 이유로 48시간 뒤 만료시키지 않습니다(T90). 참가자의 삭제·동의 철회는 해당 자료 접근을 차단하고 정리합니다.
    - 음성 경로(발화·기록본)와 녹음 동의 켜기의 인증은 참가할 때 받는 **참가자 토큰**입니다(프로필 토큰과 별개). 동의는 본인 토큰으로만 켜고, 끄기는 누구나 합니다(T68).
    - 프로필 토큰은 기기마다 하나씩입니다 — 한 프로필을 차량과 폰에서 함께 쓸 수 있습니다(ADR-0009).
    - 옛 QR 초대 API(`/api/j`와 모든 하위 경로)와 웹 주소 `/j`는 종료됐으며 410과 새 동승 QR 안내를 반환합니다. 데이터와 토큰은 반환하지 않습니다. 가족·동승 그룹(`/api/groups`, `/api/group-invites`)은 새 모양으로 되살렸습니다(T133, docs/api/groups.md).
    - 목소리 등록·발화 대조(ADR-0019)의 음성은 WAV(16 kHz PCM) 이진 본문입니다. 등록 음성 원본은 어디에도 저장하지 않고 대조용 값만 남습니다.

    - 녹음 클립(`/recordings`)은 사람이 장면으로 고른 구간의 원음입니다. WAV(16 kHz·16비트·모노) 이진 본문을 5 MB까지 받아 클립 버킷(S3)에 두고, 받아 적은 글과 같은 참가자 토큰으로 듣고 지웁니다(T76).
    - 여행 전체 음성(`/audio`, ADR-0024, T132)은 주차한 뒤 차가 올리는 여행의 원음 전체입니다. 16 kHz 모노 s16le PCM 조각(`application/octet-stream`, 4 MiB까지)을 받아 클립 버킷에 하나로 잇고, 차가 장면 클립을 올리지 않은 장면은 `/recordings/{id}`가 그 구간을 잘라 줍니다. 전체를 내려받는 경로는 없습니다.

    선택 영상 생성(T157, ADR-0025)은 API가 작업을 큐에 두고, 운영자 맥의 생성 일꾼이 일꾼 토큰으로 `/api/short-worker/*`에서 받아 가 Codex(OpenAI 구독)와 youtube-shorts-factory 스킬로 만듭니다(`SHORTS_ENABLED`·일꾼 토큰·저장소가 준비됐을 때). 외부로는 받아 적은 글(이름 대신 캐릭터 번호)과 캐릭터 그림만 가고 원음은 최종 합성에만 씁니다. 상세 계약은 docs/api/short-generation.md입니다.

    경로 위 휴게소 추천(`/rest-stops`, T97)은 저장소에 넣어 둔 한국도로공사 휴게소 위치정보로 서버 안에서 계산합니다. 바깥 호출과 키가 없고, 받은 위치를 저장하지 않습니다.

    그 밖에 이 서버가 부르는 외부 API는 구글 OAuth(계정 연결을 켰을 때), 클립 버킷(S3, `CLIPS_BUCKET`이 있을 때), 고른 장면 클립의 재전사(Nemotron ASR, `ASR_URL`·`ASR_TOKEN`이 있을 때, T75)입니다. 예정과 결정 상태는 docs/api/external.md에 있습니다.
servers:
  - url: http://localhost:8787
    description: 로컬(make run)
security: []
tags:
  - name: 프로필
  - name: 여행
  - name: 참가자
  - name: 부탁
  - name: 장면
  - name: 기록본
  - name: 클립
  - name: 그룹
  - name: 상태 확인
paths:
  /api/short-templates:
    get:
      tags: [장면]
      summary: 영상 생성 템플릿과 활성 상태
      responses:
        "200":
          description: 비활성 상태에서도 템플릿을 확인할 수 있습니다.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, provider, templates]
                properties:
                  enabled: { type: boolean }
                  provider: { type: string, const: openai-codex }
                  templates:
                    type: array
                    items:
                      type: object
                      required: [id, version, name, description, aspectRatio, minSeconds, maxSeconds]
                      properties:
                        id: { type: string }
                        version: { type: integer }
                        name: { type: string }
                        description: { type: string }
                        aspectRatio: { type: string, const: '9:16' }
                        minSeconds: { type: integer }
                        maxSeconds: { type: integer }
  /api/short-worker/claim:
    post:
      tags: [장면]
      summary: 생성 일꾼이 가장 오래된 대기 작업을 60분 임대
      description: 운영자 맥의 생성 일꾼만 부릅니다(ADR-0025). 내주기 전에 동의·원본을 다시 보고, 바뀌었으면 취소하고 204입니다.
      security: [{ workerToken: [] }]
      responses:
        '200':
          description: 임대한 작업. plan에는 자막용 출연자 이름이 있으며 일꾼은 외부로 넘기기 전에 뺍니다.
          content:
            application/json:
              schema:
                type: object
                required: [id, leaseUntil, template, plan, audio, result]
                properties:
                  id: { type: string, format: uuid }
                  leaseUntil: { type: string, format: date-time }
                  template:
                    type: object
                    required: [id, name, direction]
                    properties: { id: { type: string }, name: { type: string }, direction: { type: string } }
                  plan: { $ref: '#/components/schemas/ShortPlan' }
                  audio: { type: string }
                  result: { type: string }
        '204': { description: 대기 작업이 없거나 생성이 꺼져 있음 }
        '401': { $ref: '#/components/responses/Error' }
  /api/short-worker/jobs/{id}/audio:
    parameters: [{ $ref: '#/components/parameters/id' }]
    get:
      tags: [장면]
      summary: 임대한 작업의 장면 원음
      security: [{ workerToken: [] }]
      responses:
        '200':
          description: 16 kHz 모노 WAV
          content:
            audio/wav:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /api/short-worker/jobs/{id}/result:
    parameters: [{ $ref: '#/components/parameters/id' }]
    put:
      tags: [장면]
      summary: 만든 MP4 올리기
      description: 9:16·영상과 소리 하나씩·장면 길이와 1초 안인지 ffprobe로 보고, 동의·원본을 다시 확인한 뒤 completed로 둡니다. 그사이 철회·자료 변경이면 작업을 취소합니다.
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          video/mp4:
            schema: { type: string, format: binary, maxLength: 64000000 }
      responses:
        '200':
          description: 완료한 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortGeneration' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
  /api/short-worker/jobs/{id}/fail:
    parameters: [{ $ref: '#/components/parameters/id' }]
    post:
      tags: [장면]
      summary: 만들지 못했음을 알림
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                errorCode: { type: string, pattern: '^[a-z0-9_]{1,40}$' }
      responses:
        '200':
          description: failed로 둠(errorCode는 worker_<값>)
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id: { type: string, format: uuid }
                  state: { type: string, const: failed }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /api/rest-stops:
    post:
      tags: [부탁]
      summary: 앞으로 들를 수 있는 고속도로 휴게소(T97)
      description: |
        순정 내비(NaviHelper)가 주는 지금 위치·진행 방향과 목적지·남은 거리로 앞으로 들를 수 있는 휴게소를 좋은 순으로 고릅니다.
        내비가 경로 좌표를 주지 않아 직선으로 어림합니다: '여기→휴게소→목적지'가 남은 거리를 넘지 않는 곳, 목적지까지 지금보다 가까운 곳,
        휴게소의 행선지(이름 괄호) 쪽이 목적지 쪽과 같은 곳(양방향 휴게소는 그대로), 지금 달리는 고속도로를 먼저. 목적지가 없으면 진행 방향 30 km 앞을 목적지로 봅니다.
        목적지도 진행 방향도 없으면 빈 목록입니다. 위치는 주소가 아니라 본문으로 받고 저장하지 않습니다.
        자료는 한국도로공사 휴게소 위치정보와 시설 정보에서 만든 202곳(받은 날은 `source`)이고, 바깥 호출과 키가 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from:
                  type: object
                  required: [lat, lng]
                  description: 지금 위치(NaviHelper `getCurrentLocationInfo`). 우리나라 밖(0, 0 포함)은 400
                  properties:
                    lat: { type: number, minimum: 33, maximum: 39 }
                    lng: { type: number, minimum: 124, maximum: 132 }
                    heading: { type: number, minimum: 0, maximum: 360, description: "진행 방향(도, 북 = 0)" }
                to:
                  type: object
                  required: [lat, lng]
                  description: 목적지(NaviHelper `getDestinationInfo`). 없으면 진행 방향으로 어림
                  properties:
                    lat: { type: number, minimum: 33, maximum: 39 }
                    lng: { type: number, minimum: 124, maximum: 132 }
                remainMeters: { type: integer, minimum: 0, maximum: 2000000, description: "목적지까지 남은 길(m, `remainDistance`). 모르면 직선의 1.25배" }
                limit: { type: integer, minimum: 1, maximum: 10, default: 3 }
      responses:
        "200":
          description: 좋은 순. 앞쪽에 들를 곳이 없으면 빈 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, source]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [name, route, lat, lng, meters]
                      properties:
                        name: { type: string, description: "'용인휴게소 강릉방향'처럼 이름과 가는 방향. 양방향이면 이름만" }
                        route: { type: string, description: "노선 이름(예 영동선)" }
                        lat: { type: number }
                        lng: { type: number }
                        meters: { type: integer, description: "지금 위치에서 직선 거리(m). 길 위 거리·시간은 차가 내비 requestTrip으로 묻습니다" }
                  source: { type: string, description: "자료 출처와 받은 날" }
        "400": { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-plans:
    parameters: [{ $ref: '#/components/parameters/code' }]
    post:
      tags: [장면]
      summary: 기존 원음과 전사로 영상 제작 계획 조회
      description: 모든 동승자의 녹음 동의가 필요합니다. momentId를 생략하면 원음이 있는 장면 중 대화량으로 추천합니다. 계획 조회는 유료 생성이 아닙니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShortPlanInput' }
      responses:
        '200':
          description: 원음·자막·캐릭터의 현재 판으로 만든 계획
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortPlan' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-generations:
    parameters: [{ $ref: '#/components/parameters/code' }]
    get:
      tags: [장면]
      summary: 현재 동의 세대의 영상 생성 작업 목록
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 최신 작업부터 최대 50개
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ShortGeneration' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [장면]
      summary: 확인한 계획으로 비동기 영상 생성 시작
      description: 주행 중에는 409입니다. 같은 멱등 키와 요청은 기존 작업을 반환하고 내용이 달라지면 409입니다. 원음·자막·캐릭터가 바뀌면 계획을 다시 받아야 합니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/ShortPlanInput' }
                - type: object
                  required: [generation, planHash, externalGenerationConsent, idempotencyKey]
                  properties:
                    generation: { type: integer }
                    planHash: { type: string, pattern: '^[0-9a-f]{64}$' }
                    externalGenerationConsent: { type: boolean, const: true }
                    idempotencyKey: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' }
      responses:
        '202':
          description: 새 생성 작업 접수
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortGeneration' }
        '200':
          description: 같은 요청의 기존 작업
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortGeneration' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-generations/{id}:
    parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [장면]
      summary: 생성 진행 상태와 완료 파일 주소
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 작업 상태. 파일 주소는 같은 참가자 토큰으로 받습니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortGeneration' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
    delete:
      tags: [장면]
      summary: 생성자가 작업 취소 또는 결과 삭제
      description: 접근은 즉시 차단하며 S3 자료는 비동기로 정리합니다. 생성 일꾼이 만들고 있으면 결과를 받지 않습니다.
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 취소 상태
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id: { type: string, format: uuid }
                  state: { type: string, const: canceled }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-generations/{id}/file:
    parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [장면]
      summary: 완료한 MP4 파일 다운로드
      description: 자료 변경·동의 철회·만료·삭제 뒤에는 반환하지 않습니다. S3 서명 URL을 앱에 노출하지 않습니다.
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 원음과 한국어 자막을 합성한 720×1280 MP4
          content:
            video/mp4:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-generations/{id}/thumbnail:
    parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [장면]
      summary: 표지 그림(T166)
      description: 생성 일꾼이 영상보다 먼저 만든 표지 PNG(800×1100, 글자 없음)입니다. 만드는 중에도 줍니다(C31→C32 '만드는 중' 표지). 영상 파일과 같은 권한(녹음에 모두 동의한 이 여행 참가자)이고, 원본이 바뀌었으면 409, 아직 없으면 404입니다. 취소·동의 철회 때 영상과 함께 지웁니다.
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 표지 PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/boarding-invites:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [참가자]
      summary: 차량 화면에서 보여 줄 동승 초대 QR 발급
      description: |
        운전석(ROW_1_LEFT) 참가자의 Bearer 토큰으로 발급합니다. boarding/parked에서만 가능하며 새 발급은 이전 초대를 폐기합니다.
        5분 동안 여러 프로필이 빈 좌석에 참여할 수 있는 초대입니다. url은 /?join=<고엔트로피 초대 코드>이며 클라이언트가 현재 서버 origin에 붙여 일반 URL QR을 만듭니다.
        QR에는 프로필·참가자 인증 토큰을 넣지 않습니다. 서버는 초대 코드의 해시만 저장합니다. 화면을 닫으면 DELETE로 폐기합니다.
      security: [{ participantToken: [] }]
      responses:
        "201":
          description: QR에 사용할 상대 URL과 만료 시각. no-store.
          content:
            application/json:
              schema:
                type: object
                required: [id, url, expiresAt]
                additionalProperties: false
                properties:
                  id: { type: string, format: uuid }
                  url: { type: string, description: "/?join=<43자 초대 코드>" }
                  expiresAt: { type: integer, description: 만료 시각(epoch ms) }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/boarding-invites/{id}:
    parameters:
      - { $ref: "#/components/parameters/code" }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [참가자]
      summary: 차량의 QR 초대 닫기
      description: 발급자의 참가자 토큰만 허용합니다. 같은 초대를 여러 번 닫아도 204입니다. 초대로 이미 참여한 사람은 남고 이후 참여만 막습니다.
      security: [{ participantToken: [] }]
      responses:
        "204": { description: 초대를 폐기함 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/boarding-invites/{invite}:
    parameters:
      - { name: invite, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
    get:
      tags: [참가자]
      summary: 폰이 QR 초대의 제목과 빈 좌석을 확인
      description: 인증 전에는 제목·빈 좌석·만료 시각만 반환합니다. 여행 코드·전체 문서·참가자·토큰은 공개하지 않습니다. 만료·폐기·운전석 발급자 변경은 410, 주행·종료 상태는 409입니다.
      responses:
        "200":
          description: 최소 초대 정보. no-store.
          content:
            application/json:
              schema:
                type: object
                required: [title, seats, expiresAt]
                additionalProperties: false
                properties:
                  title: { type: string }
                  seats: { type: array, items: { $ref: "#/components/schemas/Seat" } }
                  expiresAt: { type: integer, description: 만료 시각(epoch ms) }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/boarding-invites/{invite}/participants:
    parameters:
      - { name: invite, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' } }
    post:
      tags: [참가자]
      summary: 폰의 프로필로 빈 좌석을 골라 참여
      description: |
        본인 프로필 토큰과 seat만 받습니다. 새 참가자의 consent는 본인 계정의 녹음 동의가 지금 문구 판(`2026-11-14`)으로 켜져 있으면 true, 아니면 false입니다(T128, docs/api/accounts.md). 프로필 기본값(`consentDefault`)은 쓰지 않고, 입력으로 동의를 넘기지 못합니다. 꺼진 채 들어왔으면 이후 참가자 본인이 별도 API로 켭니다.
        같은 프로필의 재시도는 200으로 기존 참가자를 반환합니다. 자리와 동의를 바꾸지 않으며 이 폰의 참가자 토큰을 복구합니다(앞선 토큰 4개 유지).
        서로 다른 프로필이 같은 좌석에 동시에 참가하면 한 명만 성공하고 다른 요청은 409입니다. 만료·폐기·운전석 발급자 변경은 410, 주행·종료는 409입니다.
        참가자 토큰은 이 응답을 받은 폰에만 보관하며 QR이나 차량 화면으로 보내지 않습니다. 프로필 삭제와 가입은 기존 공통 잠금 순서를 따릅니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat]
              additionalProperties: false
              properties:
                seat: { $ref: "#/components/schemas/Seat" }
      responses:
        "201":
          description: 새 동승자 참여. no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardingJoin" }
        "200":
          description: 동일 프로필의 기존 참여와 복구한 토큰. no-store.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardingJoin" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/short-assets/source:
    parameters: [{ $ref: '#/components/parameters/code' }]
    get:
      tags: [장면]
      summary: 기본 영상 렌더링용 서버 원본과 해시
      security: [{ participantToken: [] }]
      parameters:
        - { name: moment, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: 현재 동의 세대의 원음 장면·전사·화자·캐릭터를 묶은 스냅샷. 전체 계약은 short-assets.md입니다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortAssetSource' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-assets:
    parameters: [{ $ref: '#/components/parameters/code' }]
    get:
      tags: [장면]
      summary: 웹과 차량이 공유하는 기본 영상·공급자 생성 보관함
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 현재 동의 세대의 모든 항목을 최신 순으로 반환합니다. 기본 영상은 여행당 최대 100개입니다.
          content:
            application/json:
              schema:
                type: object
                required: [generation, items]
                properties:
                  generation: { type: integer }
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: '#/components/schemas/ShortAsset' }
                        - allOf:
                            - { $ref: '#/components/schemas/ShortGeneration' }
                            - type: object
                              required: [origin]
                              properties:
                                origin: { type: string, const: provider }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      tags: [장면]
      summary: 클라이언트에서 렌더링한 실제 MP4·WebM 파일을 비공개 서버 저장소에 보관
      description: 주차·종료 상태와 전원 동의가 필요합니다. 실제 파일을 검사하며 같은 키·원본·파일 재전송은 기존 결과를 반환합니다. 자막이나 화자가 바뀌면 409입니다. 48시간 기한은 없습니다.
      security: [{ participantToken: [] }]
      parameters:
        - { name: moment, in: query, required: true, schema: { type: string } }
        - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: sourceHash, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: key, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,100}$' } }
      requestBody:
        required: true
        content:
          video/mp4:
            schema: { type: string, format: binary }
          video/webm:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 파일과 서버 메타데이터 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortAsset' }
        '200':
          description: 같은 요청 키와 파일로 이미 저장한 항목
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortAsset' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-assets/{id}:
    parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [장면]
      summary: 기본 영상 서버 보관 상태
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 상태와 실제 파일 측정치
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShortAsset' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
    delete:
      tags: [장면]
      summary: 보관자가 기본 영상을 삭제
      description: 접근은 즉시 차단하고 S3 객체를 비동기로 삭제합니다. 동의 철회 뒤에도 보관자는 삭제할 수 있습니다.
      security: [{ participantToken: [] }]
      responses:
        '204': { description: 접근 차단과 삭제 큐 등록 완료 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/trips/{code}/short-assets/{id}/file:
    parameters: [{ $ref: '#/components/parameters/code' }, { $ref: '#/components/parameters/id' }]
    get:
      tags: [장면]
      summary: 같은 여행 참가자가 실제 보관 파일 다운로드
      description: 공개 URL 없이 참가자 Bearer로 읽습니다. 저장소 응답을 받은 뒤에도 동의·원본·삭제 여부와 파일 해시를 다시 확인합니다.
      security: [{ participantToken: [] }]
      responses:
        '200':
          description: 업로드 당시의 MP4 또는 WebM 바이트
          content:
            video/mp4:
              schema: { type: string, format: binary }
            video/webm:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/ride-links:
    post:
      tags: [참가자]
      summary: 폰의 1회용 동승 연결 QR 발급
      description: |
        프로필 토큰으로 발급합니다. 5분 유효한 code와 별개의 participantToken을 폰에만 줍니다.
        qr은 {type: gachita-ride, version: 1, code}를 직렬화한 JSON 문자열이며 참가자/프로필 토큰이 없습니다.
        폰은 participantToken을 보관했다가 조회 결과가 linked이면 그 여행의 참가자 토큰으로 씁니다.
        서버는 code와 participantToken의 해시만 저장하며 모든 응답은 no-store입니다.
      security: [{ profileToken: [] }]
      responses:
        "201":
          description: 폰이 보관할 연결 정보. 참가자 토큰은 이 응답에서만 줍니다.
          content:
            application/json:
              schema:
                type: object
                required: [id, code, expiresAt, participantToken, qr]
                properties:
                  id: { type: string, format: uuid }
                  code: { type: string, minLength: 43, maxLength: 43 }
                  expiresAt: { type: integer, description: 만료 시각(epoch ms) }
                  participantToken: { type: string, description: 폰에만 보관. QR과 차에 보내지 않음 }
                  qr: { type: string, description: QR에 담을 JSON 문자열 }
        "401": { $ref: "#/components/responses/Error" }
  /api/ride-links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [참가자]
      summary: 발급한 폰이 동승 연결 결과 확인
      description: |
        발급한 프로필만 읽습니다. 다른 프로필, 취소·만료·없는 연결은 404입니다.
        pending에는 id/status/expiresAt, linked에는 tripCode/participant가 더 있습니다.
        상환 뒤 결과를 5분 동안 읽을 수 있습니다. 참가자 토큰은 다시 내주지 않습니다.
        폰은 발급 때 받은 participantToken으로 본인의 기록 동의를 켭니다.
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 대기 중 또는 연결된 여행/참가자. no-store.
          content:
            application/json:
              schema:
                type: object
                required: [id, status, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [pending, linked] }
                  expiresAt: { type: integer }
                  tripCode: { type: string }
                  participant: { $ref: "#/components/schemas/Participant" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [참가자]
      summary: 폰에서 미사용 동승 연결 취소
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 취소됨 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: 이미 차에 연결됐으므로 취소하지 않음 }
  /api/trips/{code}/ride-links:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [참가자]
      summary: 주차 중 차가 폰의 QR을 읽어 참가자를 연결
      description: |
        차가 만든 여행 코드와 QR의 code, 운전자가 고른 seat를 보냅니다.
        boarding/parked에서만 연결하며 차량은 별도로 CarUxRestrictions를 확인합니다.
        동의는 항상 false이고 참가자 토큰은 차 응답과 여행 조회에 나오지 않습니다.
        같은 QR은 원자적으로 한 번만 소진합니다. 동시/재사용·자리 충돌·이미 참가한 프로필은 409,
        만료/없는 QR·없는 프로필·만료 여행은 404입니다. 자리 충돌은 QR을 소진하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, seat]
              properties:
                code: { type: string, minLength: 43, maxLength: 43 }
                seat: { $ref: "#/components/schemas/Seat" }
      responses:
        "201":
          description: 참가자 연결됨. 폰이 조회해 자신의 동의를 켜야 합니다.
          content:
            application/json:
              schema:
                type: object
                required: [tripCode, participant]
                properties:
                  tripCode: { type: string }
                  participant: { $ref: "#/components/schemas/Participant" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/config:
    get:
      tags: [프로필]
      summary: 웹앱의 공개 로그인 설정
      description: |
        로그인 전에도 읽을 수 있습니다. 서버의 GOOGLE_CLIENT_ID와 GOOGLE_CLIENT_SECRET이
        모두 설정돼 있으면 공개 Client ID만 주고, 하나라도 없거나 비어 있으면 빈 문자열을 줍니다.
        웹앱은 빈 문자열이면 구글 인증 화면으로 이동하지 않습니다.
        Client Secret과 다른 환경 설정은 내주지 않으며 응답은 캐시하지 않습니다(no-store).
      responses:
        "200":
          description: 공개 설정. 로그인 미설정도 빈 googleClientId로 답합니다.
          content:
            application/json:
              schema:
                type: object
                required: [googleClientId]
                additionalProperties: false
                properties:
                  googleClientId: { type: string, description: 구글 공개 Client ID. 로그인을 시작할 수 없으면 빈 문자열 }
  /api/trips/{code}/shares:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string } }
    post:
      tags: [장면]
      summary: 선택한 내 장면과 확인한 문구를 같은 여행 동승자에게 공유
      description: |
        본인 프로필 앨범의 장면만 공유합니다. 기록에 동의한 프로필 참가자가 같은 여행의 다른 프로필 참가자를 고릅니다.
        옛 그룹의 관리 대상 프로필은 자기 프로필 토큰으로 수신·회수할 수 없어 보내기와 받기 모두 제외합니다(403).
        녹음 동의와 별도로 내용·대상을 미리 본 뒤 명시적으로 실행해야 합니다. 원음·클립·참가 토큰은 복사하지 않습니다.
        위치는 includeLocation=true일 때만 포함합니다. 공유에는 시간 만료가 없습니다(T90). 보낸 사람의 회수, 원본 앨범 장면·프로필·여행의 삭제로 사라집니다.
        동의 세대 변경 시 공유 행을 지우고, 원본 앨범·프로필이 삭제되면 조회에서 제외합니다.
        HTTP 응답은 공유 생성 확인이며 상대방의 수신·열람을 증명하지 않습니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [momentId, recipientIds, caption, includeLocation, generation]
              properties:
                momentId: { type: string, pattern: "^[A-Za-z0-9_-]{1,40}$", description: 내 앨범의 장면 id. 그 밖의 글자는 400 }
                recipientIds: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { type: string }, description: 같은 여행의 참가자 ID. 프로필이 있고 동의한 다른 사람만 가능 }
                caption: { type: string, maxLength: 500, description: 사용자가 직접 확인한 문구. 빈 문자열도 가능 }
                includeLocation: { type: boolean, description: 위치 없는 장면에서 true이면 400 }
                generation: { type: integer, minimum: 1 }
      responses:
        "201":
          description: 공유 생성. id·장면 정보·시각과 수신자 수만 반환하며 여행 코드나 토큰은 없음
          content:
            application/json:
              schema:
                type: object
                required: [id, at, label, caption, createdAt, expiresAt, recipientCount]
                properties:
                  id: { type: string, format: uuid }
                  at: { type: integer }
                  label: { type: string }
                  caption: { type: string }
                  lat: { type: number }
                  lng: { type: number }
                  createdAt: { type: integer, description: epoch ms }
                  expiresAt: { type: [integer, "null"], description: "예정된 만료가 없으면 null(T90). 옛 48시간 기한도 null로 옮겼습니다" }
                  recipientCount: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/profiles/me/shares:
    get:
      tags: [프로필]
      summary: 받은 공유와 보낸 공유 읽기
      description: |
        프로필 토큰으로 본인에게 보냈거나 본인이 보낸 공유만 반환합니다. 최근 200개 중 유효한 것만 최신순으로 내보냅니다.
        동의 세대·여행 만료·양쪽 프로필·원본 앨범·현재 참가 동의를 다시 확인합니다. 캐시하지 않습니다.
        응답에는 여행 코드, 원음/클립 주소, 참가자 토큰이 없습니다. 받은 사람에게 다른 수신자 목록은 보이지 않습니다.
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 유효한 공유 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, direction, sender, at, label, caption, createdAt, expiresAt]
                      properties:
                        id: { type: string, format: uuid }
                        direction: { enum: [sent, received] }
                        sender:
                          type: object
                          required: [name, character]
                          properties: { name: { type: string }, character: { type: string } }
                        recipients:
                          type: array
                          description: 보낸 사람에게만 현재 유효한 받는 사람을 표시
                          items: { type: object, properties: { name: { type: string }, character: { type: string } } }
                        at: { type: integer }
                        label: { type: string }
                        caption: { type: string }
                        lat: { type: number }
                        lng: { type: number }
                        createdAt: { type: integer }
                        expiresAt: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/shares/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [프로필]
      summary: 내가 보낸 공유 회수
      description: 공유 행을 지웁니다. 받는 사람에게 보이지 않으며 원본 앨범은 그대로 남습니다. 이미 보거나 별도로 저장한 내용까지 되돌리는 기능은 아닙니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 회수됨 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { description: 없거나 보낸 사람이 아님 }
  /healthz:
    get:
      tags: [상태 확인]
      summary: 서버와 DB가 살아 있는지
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { const: true } } }
  /api/accounts:
    post:
      tags: [프로필]
      summary: 이메일 계정 만들기(또는 기기 프로필에 붙이기)
      description: |
        토큰 없이 부르면 프로필을 새로 만들고 이 기기의 토큰을 줍니다(201, `name` 필요).
        프로필 토큰과 함께 부르면 그 기기 프로필에 이메일·비밀번호를 붙입니다(200). 같은 프로필 id가 그대로이고, `name`·`character`는 보냈을 때만 바뀌며, `token`은 보낸 토큰 그대로입니다.
        이메일은 앞뒤 공백을 빼고 소문자로 저장합니다. 이미 가입한 이메일이거나, 이미 계정이 있는 프로필이면 409입니다(비밀번호 바꾸기가 아님). 틀린 토큰은 401입니다.
        비밀번호는 8~72자(글자 수)이고 scrypt(소금 16바이트) 값으로만 남습니다. 원문은 저장하지도 기록하지도 않습니다.
        선택 칸(`device`, `character`, 붙일 때의 `name`)의 빈 글은 보내지 않은 것과 같습니다. `/sessions`의 `device`도 같습니다.
      security: [{}, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: 글자 수. NUL은 안 됨 }
                name: { type: string, minLength: 1, maxLength: 20, description: 새로 만들 때 필요 }
                character: { type: string, maxLength: 20 }
                device: { type: string, maxLength: 20, description: 이 기기 토큰의 이름(표시용) }
      responses:
        "200": { description: 기기 프로필에 붙임, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileWithToken" } } } }
        "201": { description: 새로 만듦, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileWithToken" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/sessions:
    post:
      tags: [프로필]
      summary: 이메일로 로그인(이 기기 토큰 받기)
      description: |
        맞으면 그 프로필과 이 기기에 쓸 토큰을 새로 줍니다(다른 기기의 토큰은 그대로, ADR-0009).
        이메일이 없거나 비밀번호가 틀리면 같은 401입니다 — 어느 쪽이 틀렸는지 말하지 않고, 없는 이메일에도 같은 계산을 해 응답 시간으로도 가리지 않습니다.
        이메일에 NUL이나 짝 없는 서로게이트가 있으면 계정이 있는지와 관계없이 400입니다(T136). 로그인 시도 횟수 제한은 아직 없습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                device: { type: string, maxLength: 20 }
      responses:
        "200": { description: 로그인함, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileWithToken" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles:
    post:
      tags: [프로필]
      summary: 기기 프로필 만들기
      description: 토큰은 이 응답에서 한 번만 줍니다. 서버에는 해시만 남으므로 잃어버리면 새로 만듭니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput", required: [name] }
      responses:
        "201":
          description: 만들어짐
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Profile"
                  - type: object
                    required: [token]
                    properties: { token: { type: string, description: 43자 base64url } }
        "400": { $ref: "#/components/responses/Error" }
  /api/profiles/me:
    get:
      tags: [프로필]
      summary: 내 프로필 읽기
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 내 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [프로필]
      summary: 내 프로필 고치기
      description: |
        적은 값만 바뀝니다. `consent`는 계정의 녹음 동의(C03, T128)입니다. 켜면 그 시각(`consentAt`)과 문구의 판(`consentVersion`, 보내지 않으면 서버의 지금 판 `2026-11-14`)을 남기고, 끄면 둘 다 비웁니다.
        계정 동의는 **본인이 자기 프로필 토큰으로 여행에 처음 들어갈 때의 값**입니다. 지금 판에 동의해 두었으면 `POST /trips/{code}/participants`(`consent`를 보내지 않았을 때)와 차량 QR 초대(`POST /boarding-invites/{invite}/participants`)의 새 참가자가 동의를 켠 채 들어갑니다. 꺼져 있거나 다른 판이면 지금과 같습니다(참가는 `consentDefault`, QR 초대는 false).
        이미 참가한 여행의 동의는 바꾸지 않습니다. 여행의 동의 끄기와 그에 따른 지우기(동의 세대)는 지금처럼 여행마다입니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfilePatch" } } }
      responses:
        "200": { description: 고친 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 내 프로필 지우기
      description: 지우면 모든 기기 토큰도 못 씁니다. 앨범, 내가 대표인 그룹, 내가 만든 계정 없는 구성원(아이)의 프로필도 함께 지웁니다. 이미 참가한 여행의 이름은 그 여행이 지워질 때까지 남습니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지워짐 }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/links/google:
    post:
      tags: [프로필]
      summary: 구글 계정 연결 또는 계정으로 찾아 들어가기
      description: |
        프로필 토큰과 함께 부르면 내 프로필에 구글 계정을 묶습니다(이름은 그대로). 이미 다른 프로필에 묶인 계정이면 409입니다.
        토큰 없이 부르면 그 계정의 프로필을 찾아 들어갑니다. 있으면 이 기기에 쓸 토큰을 하나 더 돌려주고(다른 기기의 토큰은 그대로, ADR-0009), 없으면 프로필을 새로 만듭니다.
        찾아 들어가기는 갱신 순간에 연결을 다시 확인합니다 — 요청 중 연결이 바뀌었으면 토큰을 주지 않고 401로 끝냅니다.
        코드는 서버가 구글과 바꾸므로 클라이언트 비밀 값은 클라이언트에 없습니다(ADR-0006).
        `redirectUri`는 우리 콜백 하나만 받습니다(T27): `https://gachita.mangowhois.ai/oauth/google/callback`, 또는 로컬 개발 `http://localhost`·`http://127.0.0.1`(아무 포트)의 같은 경로. 다른 주소는 구글을 부르지 않고 400입니다. 서버는 이 콜백 경로에 웹앱을 내줍니다.
        **PKCE(S256)가 필수입니다.** 웹은 인가 요청에 `code_challenge`(= BASE64URL(SHA-256(verifier)))와 `code_challenge_method=S256`, `state`를 붙이고, 받은 코드와 함께 `codeVerifier`를 보냅니다. 서버가 토큰 교환에 `code_verifier`로 넘깁니다. 공개 Client ID는 `GET /api/config`에서 읽습니다.
        오류는 나눠 옵니다: 400 입력 오류(허용하지 않는 `redirectUri`, 없거나 형식이 틀린 `codeVerifier`), 401 코드 거절(맞지 않는 `codeVerifier` 포함) 또는 연결 변경, 401 코드 거절 또는 연결 변경, 500 서버의 클라이언트 설정 오류, 502 제공자 응답 오류, 503 제공자 일시 장애·연결 실패, 504 제공자 응답 시간 초과.
      security: [{}, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri, codeVerifier]
              properties:
                code: { type: string, minLength: 1, maxLength: 500, description: 구글이 redirect 주소로 돌려준 인증 코드 }
                redirectUri: { type: string, minLength: 1, maxLength: 500, description: "코드를 받을 때 쓴 주소. https://gachita.mangowhois.ai/oauth/google/callback, 또는 http://localhost·127.0.0.1의 같은 경로(정규형, 쿼리 없이). 구글에 등록된 값과 같아야 함" }
                codeVerifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$", description: "PKCE code_verifier(RFC 7636). 인가 요청에 보낸 code_challenge의 원래 값" }
      responses:
        "200": { description: 연결했거나 찾아 들어간 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileMaybeToken" } } } }
        "201": { description: 계정으로 새로 만든 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileMaybeToken" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 구글 계정 연결 끊기
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 끊음 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips:
    post:
      tags: [여행]
      summary: 여행 만들기
      description: |
        본문 없이(또는 `title`만) 부르면 빈 여행을 만들고 참가는 따로 합니다.
        `groupId`를 보내면 **그룹으로 여행을 만듭니다**(T133, docs/api/groups.md). 프로필 토큰이 필요하고 부른 사람이 그 그룹의 구성원이어야 합니다(아니면 없는 그룹과 같은 404).
        자리가 정해진 구성원을 그 자리로 넣고(자리 없는 구성원은 빠짐, 아무도 없으면 409), 동의는 각자 계정 동의가 지금 문구 판으로 켜져 있는지(아이는 보호자 동의)입니다.
        **모든 참가자에 `profileId`**가 붙어(토큰 없는 아이 포함) 차 안 화자 식별이 `/voice-prints`에서 프로필 목소리 값을 받아 갑니다(ADR-0023).
        응답의 `tokens`는 부른 사람과 그가 보호자인 아이의 참가자 토큰입니다(`{참가자 id: 토큰}`, 이때 한 번만). 다른 성인은 자기 폰에서 프로필 토큰으로 `POST /trips/{code}/participants`를 불러 있던 참가자와 새 토큰을 받습니다.
        그룹 id·이름은 이 응답에만 있고 토큰 없이 읽는 여행 문서에는 싣지 않습니다.
      security: [{}, { profileToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 40 }
                groupId: { type: string, description: 그룹으로 만들 때(T133) }
      responses:
        "201":
          description: 만들어짐. 그룹으로 만들었으면 groupId·groupName·tokens가 더 있음
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Trip"
                  - type: object
                    properties:
                      groupId: { type: string }
                      groupName: { type: string }
                      tokens: { type: object, additionalProperties: { type: string }, description: "참가자 id → 참가자 토큰(43자). 부른 사람과 그가 보호자인 아이 몫" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [여행]
      summary: 여행 전체 상태
      description: 클라이언트는 받은 `version`을 `v`로 보내 바뀐 것이 없으면 304를 받습니다.
      parameters:
        - { name: v, in: query, schema: { type: integer }, description: 마지막으로 받은 version }
      responses:
        "200": { description: 여행, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }
        "304": { description: 바뀐 것 없음 }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [여행]
      summary: 여행 상태나 기록 여부 바꾸기
      description: |
        `status`를 `driving`으로 바꾸면 참가자 모두가 동의했을 때 기록을 켭니다. `parked`와 `ended`에서는 기록을 끕니다.
        `recording: true`는 주행 중이고 모두 동의했을 때만 됩니다(아니면 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/TripStatus" }
                recording: { type: boolean }
      responses:
        "200": { description: 바뀐 여행, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/me:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [참가자]
      summary: 참가자 토큰의 본인 확인
      description: |
        저장된 참가자 Bearer의 주체를 확인하고 본인의 네 필드만 반환합니다. 공개 여행 조회는 토큰의 주체를 검증하지 않습니다.
        동의가 false여도 허용하며 동의·여행 상태·토큰을 변경하지 않습니다. ended 여행도 삭제되지 않았다면 조회할 수 있습니다.
        토큰 누락·무효·다른 여행의 토큰·프로필 토큰은 401, 없는 여행은 404입니다. 기존 토큰 회전의 유효 범위를 그대로 따릅니다.
        토큰·해시·프로필ID·다른 참가자·여행 전체를 반환하지 않습니다. 응답은 no-store이며 v 조건부 조회를 적용하지 않습니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 현재 인증된 참가자
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name, seat, consent]
                properties:
                  id: { type: string }
                  name: { type: string }
                  seat: { $ref: "#/components/schemas/Seat" }
                  consent: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/participants:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [참가자]
      summary: 여행에 참가
      description: |
        프로필 토큰을 보내면 이름을 프로필에서 가져옵니다. `consent`를 안 보내면 본인 계정의 녹음 동의가 지금 문구 판으로 켜져 있을 때 true(T128), 아니면 프로필의 기본값(`consentDefault`)을 씁니다. 참가하며 보내는 `consent`는 본인의 요청이라 그대로 받습니다.
        같은 프로필이 다시 참가하면 있던 참가자를 200으로 돌려줍니다. 토큰이 없으면 손님으로 `name`과 `consent`가 필요합니다.
        옛 그룹의 다른 프로필을 대신 참가시키는 `profileId` 필드는 410으로 거절합니다. 자기 프로필은 Bearer 토큰으로 판정합니다.
        프로필·손님 모두 응답에 **참가자 토큰**을 함께 줍니다(ADR-0007). 동의 켜기, 발화 올리기, 기록본 같은 음성 경로의 인증에 씁니다. 서버에는 해시만 남습니다.
        다시 참가하면(같은 프로필) 있던 참가자를 그대로 두고 이 기기에 쓸 토큰을 새로 줍니다. 앞서 준 토큰도 최근 4개까지 씁니다(T68). 토큰을 잃었으면 다시 참가해 받습니다. 손님은 다시 참가할 길이 없으니 참가시킨 기기가 토큰을 보관합니다.
        좌석·공조 선호(`prefs`)는 없습니다(11/13 계획). 보내도 무시합니다.
      security: [{}, { profileToken: [] }]
      requestBody:
        required: false
        description: 새로 참가할 때는 `seat`가 필요합니다. 같은 프로필이 다시 참가하면 본문 없이 불러도 되고, `seat`를 보내도 무시하고 있던 자리를 돌려줍니다(T165).
        content:
          application/json:
            schema:
              type: object
              properties:
                seat: { $ref: "#/components/schemas/Seat", description: "새로 참가할 때 필요(다시 참가하면 무시)" }
                name: { type: string, minLength: 1, maxLength: 20, description: 손님일 때 필요 }
                consent: { type: boolean, description: 손님일 때 필요 }
      responses:
        "200": { description: 이미 참가한 프로필(이 기기의 참가자 토큰을 새로 발급), content: { application/json: { schema: { $ref: "#/components/schemas/ParticipantWithToken" } } } }
        "201": { description: 참가함, content: { application/json: { schema: { $ref: "#/components/schemas/ParticipantWithToken" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/participants/{id}:
    parameters: [{ $ref: "#/components/parameters/code" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [참가자]
      summary: 자리 옮기기, 동의 바꾸기
      description: |
        **`consent: true`는 그 참가자 본인의 참가자 토큰으로만** 켭니다(T68, ADR-0009 '각자 따로'). 머리말이 없거나 이 여행의 참가자 토큰이 아니면 401,
        이 여행의 다른 참가자의 토큰이면 403입니다. 이미 켜져 있어도 같습니다.
        `consent: false`와 `seat`는 토큰 없이 누구나 바꿉니다 — 끄기는 기록을 멈추는 쪽이고, 자리는 차 화면이 폰으로 들어온 사람의 것을 고릅니다(T46).
        동의를 끄면 기록이 멈추고, 켜져 있던 동의를 끄면 동의 세대가 오릅니다(ADR-0007).
        거절되면 아무것도 바뀌지 않습니다. 판정 순서는 없는 참가자 404, 형식 400, 토큰 401·403, 자리 겹침 409입니다.
      security: [{}, { participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seat: { $ref: "#/components/schemas/Seat" }
                consent: { type: boolean, description: true는 본인의 참가자 토큰이 있어야 함 }
      responses:
        "200": { description: 바뀐 참가자, content: { application/json: { schema: { $ref: "#/components/schemas/Participant" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/participants/{id}/voice:
    parameters: [{ $ref: "#/components/parameters/code" }, { $ref: "#/components/parameters/id" }]
    post:
      tags: [참가자]
      summary: 여행 참가자의 목소리 등록
      description: |
        차의 가족처럼 프로필 없는 손님도 화자를 붙일 수 있게 이 여행에 목소리를 등록합니다(T38, ADR-0019). 본문과 응답은 `/profiles/me/voice`와 같습니다(WAV, 1~20초, 1.5 MB). 문장 둘(약 7초)을 권합니다.
        `Content-Type: application/json`이면 기기가 같은 임베더로 계산한 값만 받습니다(ADR-0023) — 소리는 기기를 떠나지 않습니다. 권한과 지우는 규칙은 같습니다.
        **그 참가자 본인의 참가자 토큰**으로만 합니다(없거나 틀리면 401, 다른 참가자의 토큰이면 403). 그 참가자의 녹음 동의가 꺼져 있으면 409입니다.
        본문을 받는 사이 동의 세대가 바뀌었으면(누군가 동의를 끔) 저장하지 않고 409입니다. 동의를 다시 확인한 뒤 다시 등록합니다.
        원본 음성은 저장하지 않고 대조용 값만 여행 저장소에 둡니다. 다시 등록하면 값을 바꿉니다. 그 참가자의 동의가 꺼지면(누가 끄든) 바로 지우고, 꺼져 있던 동의가 다시 켜질 때도 지웁니다(다시 등록). 시간이 지났다는 이유로는 지우지 않고(T90), 참가자가 빠지거나 여행이 지워질 때 함께 지웁니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          application/json:
            schema: { $ref: "#/components/schemas/VoicePrintInput" }
      responses:
        "200":
          description: 등록함
          content:
            application/json:
              schema: { type: object, required: [seconds, dims], properties: { seconds: { type: number }, dims: { type: integer } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/requests:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [부탁]
      summary: 부탁 남기기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by, text]
              properties:
                by: { type: string, description: 이 여행의 참가자 id }
                text: { type: string, minLength: 1, maxLength: 200 }
                when: { $ref: "#/components/schemas/When" }
      responses:
        "201": { description: 남김, content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/requests/{id}:
    parameters: [{ $ref: "#/components/parameters/code" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [부탁]
      summary: 부탁 상태 바꾸기
      description: |
        갈 수 있는 길만 됩니다(아니면 409).
        `held → proposed → accepted → reflected → done`. 끝나기 전에는 `cancelled`로 갈 수 있습니다.
        `proposed`와 `accepted`는 `held`로 되돌릴 수 있습니다. 차량 앱은 내비가 경유지를 받았다는 알림을 본 뒤에 `reflected`로 바꾸고, 실패하면 `held`로 되돌립니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { $ref: "#/components/schemas/RequestStatus" } } }
      responses:
        "200": { description: 바뀐 부탁, content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/moments:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [장면]
      summary: 장면의 시각과 위치 남기기
      description: |
        차량 앱이 대화가 재미있던 순간을 표시할 때 부릅니다. `at`을 안 보내면 서버 시각을 씁니다.
        위치 없는 장면도 저장합니다(ADR-0007) — `lat`·`lng`는 둘 다 있거나 둘 다 없음만 받고, 위치 없는 장면은 목록에만 있고 지도에는 나오지 않습니다.
        장면을 고른 사람의 참가자 토큰과 함께 부르면, 그 참가자가 프로필을 가졌을 때 장면을 **확정**으로 보고 그 프로필의 앨범에 복사해 남깁니다(ADR-0014).
        고른 사람은 본문이 아니라 토큰으로 정합니다. 토큰 없이 부르면 여행에만 남습니다. 여행이 닫힌 뒤에도 남는 것은 이 앨범뿐입니다.
      security: [{}, { participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                label: { type: string, minLength: 1, maxLength: 60 }
                at: { type: integer, description: "epoch 밀리초. 여행을 만든 뒤부터 지금까지" }
                from: { type: integer, description: "장면 구간의 시작(epoch 밀리초, T43). `to`와 함께. at 앞 60초 안" }
                to: { type: integer, description: "장면 구간의 끝. from ≤ at ≤ to, 1초 ≤ to − from ≤ 60초. 차가 이 구간을 잘라 클립으로 올린다(T63). 없으면 at 앞 20초~뒤 10초" }
      responses:
        "201": { description: 남김, content: { application/json: { schema: { $ref: "#/components/schemas/Moment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/contents:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [장면]
      summary: 이 여행의 콘텐츠 기록(프로필 없는 기기)
      description: |
        `GET /profiles/me/trips`의 항목 하나와 같은 모양(`MyTrip`)으로 이 여행의 구성원·장소·경로·콘텐츠를 줍니다(F6, docs/api/places.md). 프로필 토큰이 없는 차량이 콘텐츠 기록(갤러리·타임라인·지도·플레이어)을 그릴 때 씁니다.
        기록본과 같은 규칙으로 **녹음에 동의한 참가자의 토큰**으로만 읽습니다(없거나 다른 여행의 토큰이면 401, 동의하지 않은 참가자면 403). 영상 파일(`url`)은 지금처럼 전원 동의 규칙을 따릅니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 이 여행의 콘텐츠 기록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTrip" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/places:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [장면]
      summary: 장소 기록 읽기
      description: |
        차가 남긴 장소를 `at` 순서(같으면 받은 순서)로 줍니다(T136). **지금 상태는 `at`이 가장 큰 장소(마지막)**이고, 폰은 그것이 `approaching`이면 '곧 도착'을 보여 줍니다.
        도착 장소(`GET /todos`의 `arrival`, T119)와 같은 규칙으로 **녹음에 동의한 참가자의 토큰**으로만 읽습니다(없거나 다른 여행의 토큰이면 401, 동의하지 않은 참가자면 403).
        토큰 없이 읽는 여행 문서(`GET /trips/{code}`)에는 장소를 싣지 않습니다 — 가족이 어디로 가고 어디에 닿았는지를 여행 코드만 아는 사람과 캐시에 내주지 않게. 기록본(`GET /transcript`)에도 같은 `places`가 있습니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 장소 기록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/Place" } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [장면]
      summary: 장소 남기기(출발·경유·곧 도착·도착·목적지)
      description: |
        차가 내비에서 읽은 장소 이름을 쌓습니다(T131, docs/api/places.md). 콘텐츠 기록의 지도·타임라인과 폰의 '곧 도착'이 `GET`으로 읽습니다.
        그 여행의 참가자 토큰이 있어야 합니다(없거나 다른 여행의 토큰이면 401). 녹음 동의와 관계없습니다 — 음성이 아니라 내비의 장소입니다.
        `at`을 안 보내면 서버 시각을 씁니다. 늦게 올릴 때는 그때의 시각을 보내되 여행을 만들기 1분 전 ~ 지금+1분 안이어야 합니다. 좌표는 둘 다 있거나 둘 다 없음만 받습니다.
        `places`는 늘 `at` 순서(같으면 받은 순서)라, 늦게 도착한 장소도 제 시각 자리에 들어갑니다. **지금 상태는 `at`이 가장 큰 장소(마지막)**입니다.
        여행 하나에 200개까지 두고, 넘으면 `at`이 가장 이른 것부터 버립니다. 차는 상태가 바뀔 때만 올립니다. 쓰기는 녹음 동의와 관계없지만 읽기는 동의한 참가자만입니다(T136).
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, name]
              properties:
                kind: { $ref: "#/components/schemas/PlaceKind" }
                name: { type: string, minLength: 1, maxLength: 100 }
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                at: { type: integer, description: epoch 밀리초 }
                etaSeconds: { type: integer, minimum: 0, maximum: 86400, description: 내비가 알려 준 남은 시간(초). 곧 도착에서 }
      responses:
        "201": { description: 남김, content: { application/json: { schema: { $ref: "#/components/schemas/Place" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/utterances:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [기록본]
      summary: 발화 묶음 올리기
      description: |
        차량 앱이 받아 적은 발화를 묶어 올립니다(ADR-0007·ADR-0014). 같은 `(device, seq)`는 다시 보내도 한 번만 남고(멱등), 순서는 섞여도 좋습니다.
        응답의 `lastSeq`는 빠짐없이 받은 마지막 순번입니다 — 차량은 재동기화 뒤 그 뒤만 다시 보냅니다.
        `lastSeq`는 발화 줄과 따로 적어 두어 뒤로 가지 않습니다(동의 철회·글 지우기로 줄이 지워져도).
        발화마다 만들 때의 동의 세대(`generation`, 없으면 본문의 `generation`)를 적습니다. 지금 세대보다 옛 세대의 발화는 저장하지 않되 받은 것으로 쳐서 `lastSeq`에 넣습니다(ADR-0007).
        동의가 꺼지면 차량은 못 보낸 옛 세대 발화의 내용을 버리고, 그 순번은 `{seq, generation}`만 담아 올려 확인받습니다 — 순번을 아예 빼면 그 앞에서 `lastSeq`가 멈춥니다.
        동의하지 않은 탑승자가 있는 동안은 403이고 `lastSeq`도 오르지 않습니다. 모두 동의한 뒤 다시 보냅니다.
        기기 이름(`device`)은 처음 올린 참가자의 것입니다. 다른 참가자가 같은 이름으로 올리면 403입니다.
        여행 하나의 발화는 2만 줄까지입니다(넘으면 409). 새로 생길 줄만 셉니다 — 이미 받은 순번을 다시 보내는 것(화자만 채우기)은 한도에 닿은 여행에서도 받습니다.
        화자는 선택 칸입니다(ADR-0023). 차가 차 안에서 대조한 참가자를 `participantId`·`speakerMethod: device-voice`(·`speakerConfidence`)로 함께 올립니다. 그 기기의 발화에만, 녹음에 동의한 이 여행의 참가자만 붙습니다 — 모르는 참가자 id는 묶음을 거절하지 않고 화자 없이 저장합니다(`lastSeq`가 멈추지 않게). `profileId`는 받지 않고 참가자에서 찾습니다.
        이미 받은 순번을 화자와 함께 다시 보내면, 화자가 비어 있고 사람이 고치지 않은 줄에만 화자를 채웁니다(차가 대조 값을 늦게 받았을 때). 글과 다른 칸, 이미 붙은 화자, 사람이 고친 화자('모름' 포함)는 바꾸지 않습니다. 화자 칸이 없으면 지금까지와 같습니다 — 서버의 화자 대조(`/voice-match`, T38)가 붙입니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, items]
              properties:
                device: { type: string, minLength: 1, maxLength: 40, not: { enum: [".", ".."] }, description: "발화를 올리는 기기의 이름(차량 앱이 정함). `.`·`..`은 400 — 자막·화자 고치기 주소(`/{device}/{seq}`)가 URL 정규화로 사라지지 않게" }
                generation: { type: integer, minimum: 1, description: 발화마다 세대를 적지 않았을 때 모든 발화의 세대. 둘 다 없으면 400 }
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/UtteranceInput" }
      responses:
        "200":
          description: 받음
          content:
            application/json:
              schema:
                type: object
                required: [lastSeq, generation]
                properties:
                  lastSeq: { type: integer, description: 이 기기의 발화 가운데 빠짐없이 받은 마지막 순번 }
                  generation: { type: integer, description: 지금 동의 세대 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [기록본]
      summary: 받은 발화 확인(동기화)
      description: 재연결한 차량이 무엇을 받았는지 확인할 때 부릅니다. `device`와 `after`를 주면 그 기기의 순번 이후만 돌려줍니다. 녹음에 동의한 참가자만 읽습니다(아니면 403).
      security: [{ participantToken: [] }]
      parameters:
        - { name: device, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer }, description: 이 순번 뒤만. device가 있을 때만 봄 }
      responses:
        "200":
          description: 발화 목록과 지금 상태
          content:
            application/json:
              schema:
                type: object
                required: [generation, recording, items]
                properties:
                  generation: { type: integer, description: 지금 동의 세대 }
                  recording: { type: boolean, description: 지금 녹음 가능 여부 }
                  items: { type: array, items: { $ref: "#/components/schemas/Utterance" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [기록본]
      summary: 자기 발화 지우기
      description: |
        참가자 토큰의 주인이 프로필로 참가했을 때만, 그 프로필의 발화를 이 여행에서 지웁니다(손님은 403). 다른 사람의 발화는 남습니다.
        동의 세대는 오르지 않습니다. 지운 줄은 내용만 비우고 순번은 남겨, 같은 순번이 늦게 다시 올라와도 되살아나지 않습니다(읽기에는 나오지 않음).
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 지운 줄 수
          content:
            application/json:
              schema: { type: object, required: [deleted], properties: { deleted: { type: integer } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/utterances/{device}/{seq}:
    parameters:
      - { $ref: "#/components/parameters/code" }
      - { name: device, in: path, required: true, schema: { type: string }, description: "발화를 올린 기기. 올릴 때의 글자 그대로를 주소 인코딩(공백·한글). 잘못된 인코딩은 400" }
      - { name: seq, in: path, required: true, schema: { type: integer }, description: 그 기기가 매긴 순번 }
    patch:
      tags: [기록본]
      summary: 발화의 화자 고치기
      description: |
        차 화면에서 사람이 '모름'이나 틀린 이름을 고칩니다(T37). **그 기기 이름으로 발화를 올린 참가자의 토큰**으로만 합니다(올리기의 기기 주인 규칙과 같음).
        사람이 고친 것이 화자 대조보다 우선이라 이미 붙은 화자도 바꿉니다. `participantId: null`이면 '모름'으로 되돌립니다. 고친 줄은 뒤늦게 끝난 대조가 다시 채우지 않습니다('모름'으로 고친 것도).
        그 참가자가 프로필 참가자이면 `profileId`도 함께 붙고(피드에 나옴), 아니면 비웁니다. 녹음에 동의하지 않은 참가자의 이름은 붙이지 않습니다(409).
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId: { type: [string, "null"], description: 이 여행의 참가자 id. null이면 모름 }
      responses:
        "200": { description: 고친 발화, content: { application/json: { schema: { $ref: "#/components/schemas/Utterance" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/captions/{device}/{seq}:
    parameters:
      - { $ref: "#/components/parameters/code" }
      - { name: device, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 40 }, description: "발화 기기 이름. encodeURIComponent로 인코딩합니다" }
      - { name: seq, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 1000000000 } }
    patch:
      tags: [기록본]
      summary: 자막 수정본 저장 또는 초기화
      description: |
        해당 여행의 동의한 참가자가 고칩니다. 원문 text·자동 asrText는 보존합니다.
        expectedVersion이 현재 editVersion과 다르거나 generation이 현재 동의 세대와 다르면 409입니다.
        초기 버전은 0이며 저장과 null 초기화 모두 버전을 하나 올립니다. 충돌하면 기록본을 다시 읽고 사용자가 재확인합니다.
        없는 발화·자기 글 삭제로 비운 발화·만료 여행은 404입니다. 수정본과 마지막 편집자/시각은 발화와 함께 철회·만료·삭제됩니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, expectedVersion, generation]
              properties:
                text: { type: [string, "null"], minLength: 1, maxLength: 500, description: "trim 후 1~500자. null은 수동 수정본 초기화(ASR 또는 원문으로 표시)" }
                expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
                generation: { type: integer, minimum: 1, maximum: 2147483647 }
      responses:
        "200":
          description: 저장한 발화와 현재 동의 세대
          content:
            application/json:
              schema:
                type: object
                required: [generation, utterance]
                properties:
                  generation: { type: integer }
                  utterance: { $ref: "#/components/schemas/Utterance" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/transcript:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [기록본]
      summary: 기록본
      description: 이 여행의 발화를 시간순으로, 부탁과 도착 할 일과 함께 돌려줍니다. 도착 할 일 뽑기는 아직 구현 전이라 항상 빈 배열입니다. 녹음에 동의한 참가자만 읽습니다(아니면 403).
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 기록본
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcript" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/profiles/me/feed:
    get:
      tags: [프로필]
      summary: 내 피드
      description: |
        한 프로필의 발화와 장면을 여행을 가로질러 최신순으로 돌려줍니다.
        발화는 여행이 지워지지 않은 동안 나오고(시간 만료 없음, T90), 장면은 앨범에 복사된 것이라 여행이 지워진 뒤에도 나옵니다(ADR-0014).
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 피드 항목(최대 100)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FeedItem" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/trips:
    get:
      tags: [프로필]
      summary: 내 여행과 콘텐츠 목록
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [active] }, description: "active면 끝나지 않은 여행만, 장소·경로·콘텐츠 없이(T165)" }
      description: |
        내 프로필이 참가자로 있는 여행을 최신 순으로 50개까지 줍니다(T131, docs/api/places.md). 콘텐츠 기록 화면(갤러리·타임라인·지도)이 읽습니다.
        `?status=active`(T165)면 끝나지 않은(`ended`가 아닌) 여행만 같은 모양으로 주고, `places`·`route`·`contents`는 셈하지 않아 빈 목록입니다. 폰 처음 화면이 진행 중 여행을 자주 찾을 때 씁니다. 다른 값은 400입니다.
        `places`·`route`·`contents`는 기록본과 같은 규칙으로 **그 여행에서 내 참가자가 녹음에 동의했을 때만** 채웁니다(T136, 아니면 빈 목록). 경로와 콘텐츠는 지금 동의 세대의 것만 담습니다(철회로 세대가 오르면 빠짐).
        `route`는 좌표가 있는 발화를 시간순으로 골고루 줄인 `[lat, lng, at]`이고 200점까지입니다(첫 점·끝 점은 남김). 지도 제공자는 쓰지 않습니다.
        `contents`는 서버 보관을 마친 기본 영상(`kind: device`, short-assets)과 생성을 마친 영상(`kind: generated`, short-generations)입니다. 제목·시각·좌표는 그 장면(제목이 없으면 여행 제목), `place`는 그 시각 전에 남은 마지막 장소 이름입니다.
        파일(`url`)은 지금처럼 그 여행의 **참가자 토큰**으로 받고 전원 동의 규칙을 따릅니다(docs/api/short-assets.md). 이 기기에 토큰이 없으면 프로필 토큰으로 다시 참가(`POST /trips/{code}/participants`)해 받습니다.
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 내 여행
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/MyTrip" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/moments:
    get:
      tags: [프로필]
      summary: 한 여행의 내 앨범 장면
      description: |
        그 여행에서 내가 장면으로 남긴 앨범 복사본을 시각 순으로 모두 줍니다(T81 공유 후보). 피드와 달리 발화와 섞거나 100개로 자르지 않습니다(여행당 장면은 500개 상한).
        앨범 복사본이라 여행이 닫힌 뒤에도 나옵니다. 공유할 수 있는 기간은 부르는 쪽이 여행 시각으로 봅니다.
      security: [{ profileToken: [] }]
      parameters:
        - { name: trip, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z2-9]{6}$" }, description: 여행 코드. 대소문자를 가리지 않음 }
      responses:
        "200":
          description: 그 여행의 내 앨범 장면(없으면 빈 배열)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, tripCode, at, label]
                      properties:
                        id: { type: string }
                        tripCode: { type: string }
                        at: { type: integer }
                        label: { type: string }
                        lat: { type: number, description: 위치 없는 장면은 없음 }
                        lng: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/moments/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [프로필]
      summary: 앨범에서 장면 지우기
      description: 내 앨범에 복사된 장면만 지웁니다. 여행의 moments에는 영향이 없습니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/profiles/me/tokens:
    post:
      tags: [프로필]
      summary: 이 기기 토큰 만들기
      description: 한 프로필을 차량과 폰에서 함께 쓰게 기기마다 토큰을 둡니다(ADR-0009). 다른 기기의 토큰은 그대로입니다.
      security: [{ profileToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device: { type: string, minLength: 1, maxLength: 20, description: 기기 이름(차량, 폰…). 표시용 }
      responses:
        "201":
          description: 만들어짐
          content:
            application/json:
              schema: { type: object, required: [token, device], properties: { token: { type: string, description: 43자 base64url }, device: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/photo:
    put:
      tags: [프로필]
      summary: 프로필 사진 올리기
      description: "이진 본문(PNG 또는 JPEG, 최대 1 MB). 서버는 매직 바이트로 형식만 확인하고 받은 그대로 둡니다(다시 그리기는 화면 T46에서). 지금은 본인만 받아 가고, 응답에 `x-content-type-options: nosniff`를 붙입니다."
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        "204": { description: 올림 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [프로필]
      summary: 내 프로필 사진 보기
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 사진 바이트(올릴 때 확인한 형식 그대로) }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 프로필 사진 지우기
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
  /api/groups:
    get:
      tags: [그룹]
      summary: 내 그룹
      description: 내가 구성원인 가족·동승 그룹(T133, docs/api/groups.md). 만든 차례대로.
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 내 그룹
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Group" } } } } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [그룹]
      summary: 그룹 만들기
      description: 만든 사람이 대표(owner)입니다. 가족·동승 모두 대표 자리를 운전석(`ROW_1_LEFT`)에 둡니다(T162). 한 사람은 그룹 20개까지 속합니다(넘으면 409).
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                kind: { type: string, enum: [family, guest] }
      responses:
        "201": { description: 만든 그룹, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/invites:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [그룹]
      summary: 초대 코드 만들기
      description: |
        `FAMILY-1234`(가족)·`TRIP-1234`(동승) 모양의 코드를 24시간 줍니다. 그룹당 하나라 새로 만들면 이전 코드는 바로 못 씁니다(410). 대표와 성인 구성원이 만듭니다.
        `url`은 같은 출처의 앱 주소(`/?group=<코드>`)입니다. QR은 이 주소를 담고, 코드 입력·QR·링크는 모두 `POST /group-invites/{code}`로 같은 초대에 들어갑니다.
        구성원이 아니면 없는 그룹과 같은 404입니다.
      security: [{ profileToken: [] }]
      responses:
        "201": { description: 초대, content: { application/json: { schema: { $ref: "#/components/schemas/GroupInvite" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/group-invites/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string, pattern: "^(FAMILY|TRIP)-[0-9]{4}$" }, description: 초대 코드. 대소문자를 가리지 않음 }]
    get:
      tags: [그룹]
      summary: 초대 미리보기(토큰 없이)
      description: 없는 코드는 404, 만료됐거나 새 코드로 바뀐 코드는 410입니다. 틀린 코드 시도는 프로세스마다 10분에 60번까지(넘으면 429) — 코드가 숫자 4자리라 짐작을 막습니다.
      responses:
        "200":
          description: 미리보기
          content:
            application/json:
              schema:
                type: object
                required: [groupName, kind, ownerName, expiresAt]
                properties:
                  groupName: { type: string }
                  kind: { type: string, enum: [family, guest] }
                  ownerName: { type: string }
                  expiresAt: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      tags: [그룹]
      summary: 초대 코드로 들어가기
      description: |
        프로필 토큰으로 성인 구성원(`adult`)이 되어 그룹을 돌려줍니다. 이미 구성원이면 그대로 200입니다(자리도 그대로). 코드는 24시간 동안 여러 사람이 씁니다(그룹은 10명까지, 넘으면 409).
        새로 들어온 사람은 조수석 → 뒤 왼쪽 → 뒤 오른쪽 차례로 빈자리에 앉습니다(T162). 운전석·뒤 가운데는 고르지 않고, 다 차 있으면 자리 없이(`seat: null`) 들어갑니다.
        구성원의 `consent`는 그 사람의 계정 동의(지금 문구 판)를 따라갑니다. 꺼져 있으면 `consent: false`로 들어가고 화면이 동의(`PATCH /profiles/me`)를 받습니다.
        틀린 코드 시도는 프로필마다 10분에 10번, 프로세스마다 60번까지입니다(넘으면 429, 맞는 코드도 잠시 막힘).
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 들어간 그룹, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/children:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [그룹]
      summary: 아이 프로필 만들기
      description: |
        계정 없는 아이 프로필을 만들어 그룹에 넣습니다(role `child`). 만든 사람(대표나 성인)이 보호자(`guardianId`)이고, 아이의 동의는 보호자 동의(`guardianConsent`)입니다.
        아이에게는 토큰이 없습니다. 여행 참가자 토큰은 그룹으로 여행을 만들 때 보호자 기기가 받습니다. 그룹은 10명까지(넘으면 409).
        아이는 뒤 왼쪽 → 뒤 오른쪽 → 조수석 차례로 빈자리에 앉습니다(T162). 다 차 있으면 자리 없이 들어갑니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, guardianConsent]
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                character: { type: string, maxLength: 20 }
                guardianConsent: { type: boolean }
                consentVersion: { type: string, maxLength: 40, description: 보호자가 동의한 문구의 판. 보내지 않으면 서버의 지금 판 }
      responses:
        "201": { description: 아이가 들어간 그룹, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/seats:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      tags: [그룹]
      summary: 자리 바꾸기(한 번에)
      description: |
        `{seats: {<profileId>: 좌석|null}}`. 적은 구성원만 바꾸고 나머지는 그대로입니다. 한 트랜잭션에서 바꾸므로 맞바꾸기가 됩니다.
        바꾼 뒤 같은 자리에 두 사람이면 409이고 아무것도 바뀌지 않습니다(동시에 보내도 하나만 성공). 구성원이 아닌 id·모르는 좌석은 400. 대표와 성인이 바꿉니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: object, additionalProperties: { anyOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }] } }
      responses:
        "200": { description: 바뀐 그룹, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/members/{profileId}:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [그룹]
      summary: 아이의 이름·캐릭터·보호자 동의 고치기
      description: 그 아이의 보호자만(아니면 403). 성인은 자기 프로필(`PATCH /profiles/me`)에서 고칩니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                character: { type: string, maxLength: 20 }
                guardianConsent: { type: boolean }
                consentVersion: { type: string, maxLength: 40 }
      responses:
        "200": { description: 바뀐 그룹, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [그룹]
      summary: 빼기·나가기
      description: |
        대표는 남을 빼고, 성인은 자기만 나가고, 아이는 대표나 그 보호자가 뺍니다(아니면 403).
        **아이를 빼면 아이 프로필을 지웁니다**(프로필 지우기와 같은 정리 — 아이가 탔던 여행은 동의 세대가 올라 그 여행의 기록이 지워집니다). 성인이 나가면 그가 보호자인 아이도 함께 지웁니다.
        대표가 자기를 빼면 그룹이 없어지고 그룹의 아이를 모두 지웁니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 뺌 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/members/{profileId}/voice:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [그룹]
      summary: 아이 목소리 등록
      description: |
        보호자가 아이의 목소리를 등록합니다(본인 것도 되지만 보통은 `/profiles/me/voice`). 본문과 검사는 `/profiles/me/voice`와 같습니다 — 기기가 계산한 값(`Content-Type: application/json`, ADR-0023) 또는 WAV.
        보호자가 아니면 403, 아이의 보호자 동의가 지금 문구 판으로 켜져 있지 않으면 409입니다. 값은 아이 프로필에 남고, 그룹으로 만든 여행에서 차가 `/voice-prints`로 받아 갑니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/VoicePrintInput" } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: 등록함
          content: { application/json: { schema: { type: object, required: [seconds, dims], properties: { seconds: { type: number }, dims: { type: integer } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      tags: [그룹]
      summary: 아이 목소리 지우기
      description: 보호자(또는 본인)가 대조 값을 바로 지웁니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/profiles/{id}/photo:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [프로필]
      summary: 프로필 사진 보기(id로)
      description: |
        본인 것과 같은 그룹 구성원(아이 포함)의 것을 줍니다(T128·T133).
        볼 수 없는 프로필은 없는 프로필·사진 없음과 같은 404입니다(있는 id인지 알려 주지 않음). 응답은 `/profiles/me/photo`와 같습니다(`private, no-store`, `nosniff`).
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 사진 바이트(올릴 때 확인한 형식 그대로) }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/profiles/me/voice:
    post:
      tags: [프로필]
      summary: 목소리 등록
      description: |
        이진 본문(WAV 16 kHz 16비트 PCM, 모노·스테레오 모두 — 스테레오는 합쳐 모노로). 1~20초, 1.5 MB까지.
        **원본 음성은 어디에도 저장하지 않고** 대조용 값(벡터)만 남깁니다(ADR-0019). 다시 등록하면 값을 바꿉니다.
        `Content-Type: application/json`이면 기기가 같은 임베더로 계산한 값만 받습니다(ADR-0023) — 소리는 기기를 떠나지 않습니다.
        말소리가 없는 소리(무음처럼 로그멜 묶음의 길이가 0인 값)는 음성으로든 값으로든 400입니다(`/participants/{id}/voice`도 같음).
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
          application/json:
            schema: { $ref: "#/components/schemas/VoicePrintInput" }
      responses:
        "200":
          description: 등록함
          content:
            application/json:
              schema: { type: object, required: [seconds, dims], properties: { seconds: { type: number, description: 등록 음성 길이(초) }, dims: { type: integer, description: 대조용 값의 차원 } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 목소리 등록 지우기
      description: 대조용 값을 즉시 지웁니다. 프로필을 지우면(대표가 만든 아이 프로필이 함께 지워질 때도) 자동으로 지워집니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/transcriptions:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [기록본]
      summary: 웹 입력 음성의 첫 전사
      description: |
        Pleos 초안이 없는 웹 입력 음성을 설정된 ASR 서버의 nemo_transcribe30 모델에 보내고 실제 받아 적은 글만 반환합니다(T96).
        참가자 토큰과 전원 녹음 동의가 필요합니다. 본문을 읽기 전, 공급자로 보내기 직전, 응답 직후에 토큰·전원 동의·세대를 다시 확인합니다.
        16 kHz 모노 PCM16 WAV 0.5~10초, 최대 400,000바이트를 받습니다. 잘린 파일과 다중 채널은 400입니다.
        음성과 결과를 저장하지 않습니다. 클라이언트가 반환한 text와 generation으로 기존 /utterances에 발화를 저장하고 /voice-match로 화자를 대조합니다.
        초안·가짜 대화·화자를 만들지 않습니다. 무음 또는 공급자의 빈 전사는 422 invalid입니다. 공급자가 실패하거나 잘못된 답을 주면 503입니다.
        대기는 기존 재전사와 간격을 공유하며, 프로세스당 동시 대기·처리를 8건으로 제한합니다. 초과 또는 공급자 429는 429입니다.
        대기와 외부 요청을 합해 기본 10초(ASR_TIMEOUT_MS, 최대 20초) 뒤 504로 끝냅니다. 클라이언트 연결이 끊기면 공급자 요청을 취소합니다.
        자동 재시도하지 않습니다. 클라이언트도 실패한 원음을 유지하고 상태를 표시해야 하며, 조용히 버리거나 성공한 자막으로 바꾸지 않습니다.
        ASR_URL과 ASR_TOKEN이 없으면 503입니다. 외부 요청 동안 여행의 DB 연결·행 잠금을 점유하지 않습니다.
      security: [{ participantToken: [] }]
      parameters:
        - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 }, description: 녹음을 시작할 때 읽은 동의 세대 }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary, maxLength: 400000 } }
      responses:
        "200":
          description: 전사 결과. 발화 저장과 화자 대조는 기존 API로 이어집니다.
          content:
            application/json:
              schema:
                type: object
                required: [text, seconds, generation, providerText, segments, diarization]
                additionalProperties: false
                properties:
                  text: { type: string, minLength: 1, maxLength: 500, description: 공급자의 전사에서 화자 태그와 확인된 양끝 시각을 뺀 글. 문장 안의 숫자와 시각 표현은 유지 }
                  seconds: { type: number, minimum: 0.5, maximum: 10, description: 받은 WAV의 표본 수로 잰 길이 }
                  generation: { type: integer, minimum: 1, description: 요청과 결과 반환 때 확인한 동의 세대 }
                  providerText: { type: string, maxLength: 4096, description: 공급자가 반환한 원문. 메타데이터가 잘못되어도 원문은 유지하며 서버에 저장하지 않음 }
                  segments:
                    type: [array, "null"]
                    description: 공급자가 실제 반환한 구간만. 모든 구간이 유효할 때 배열이며, 태그·시각 누락 또는 하나라도 잘못되면 null. 실제 겹침은 허용하고 시각을 추정·보정하지 않음
                    items:
                      type: object
                      required: [start, end, text, speakerLabel]
                      additionalProperties: false
                      properties:
                        start: { type: number, minimum: 0, description: 입력 WAV 시작에서 잰 초 }
                        end: { type: number, exclusiveMinimum: 0, maximum: 10, description: start보다 크고 seconds 이하인 실제 끝 시각 }
                        text: { type: string, minLength: 1 }
                        speakerLabel: { type: string, pattern: '^spk:[0-9]{1,4}$', description: 이 요청 안에서만 구분한 익명 화자. 참가자 신원이 아님 }
                  diarization:
                    type: object
                    required: [method, scope, requestId, status]
                    additionalProperties: false
                    properties:
                      method: { type: string, const: provider-window }
                      scope: { type: string, const: request }
                      requestId: { type: string, format: uuid, description: 결과마다 새 UUID. 서로 다른 요청의 같은 화자 번호를 동일인으로 연결하지 않음 }
                      status: { type: string, enum: [available, unavailable, invalid] }
                      reason: { type: string, enum: [missing_speaker_tags, missing_timestamps, unexpected_text, invalid_speaker_label, empty_segment, out_of_bounds, malformed_segment], description: unavailable 또는 invalid일 때의 원인 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "405": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/voice-match:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [기록본]
      summary: 발화 대조(화자 붙이기)
      description: |
        이진 본문(발화 음성 WAV)과 좌석 구역 `row`(1 앞줄, 2 뒷줄 — 차량 앱의 판정, T37)를 받아, 그 줄에 앉은, 녹음에 동의한 참가자 가운데 목소리 값이 있는 사람과 비교해
        참가자와 확신도를 돌려줍니다(ADR-0008·0019). 가장 높은 확신이 기준을 넘어야 하고, 아니면 `participantId: null`('모름').
        값은 이 여행에 등록한 것(`POST /participants/{id}/voice`)을 먼저, 없으면 그 사람 프로필의 등록값을 씁니다. 손님 참가자도 화자가 붙습니다.
        `row`를 모르면 빼고 부릅니다. 그러면 이 여행의 참가자 모두가 후보입니다.
        발화 음성은 0.5~10초, 1 MB까지이고 저장하지 않습니다. 녹음에 동의한 참가자만 부릅니다(아니면 403).
        `device`와 `seq`를 함께 주면 찾았을 때 그 발화 줄의 화자를 채웁니다(기록본·피드에 나옴). 발화를 먼저 올린 뒤, 그 발화를 올린 기기(참가자)가 부릅니다. 이미 화자가 있는 줄과 사람이 화자를 고친 줄은 바꾸지 않습니다.
        여행 줄을 잠그지 않으므로 업로드가 느려도 같은 여행의 동의 바꾸기를 막지 않습니다. 후보와 호출자의 동의는 본문을 다 받은 뒤의 최신 여행으로 정합니다.
      security: [{ participantToken: [] }]
      parameters:
        - { name: row, in: query, schema: { type: string, enum: ["1", "2"] }, description: "좌석 구역. 1은 앞줄(ROW_1_*), 2는 뒷줄(ROW_2_*). 모르면 뺌" }
        - { name: device, in: query, schema: { type: string }, description: 화자를 채울 발화의 기기 }
        - { name: seq, in: query, schema: { type: integer }, description: 화자를 채울 발화의 순번 }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: 대조 결과
          content:
            application/json:
              schema:
                type: object
                required: [participantId, profileId, confidence, threshold, applied]
                properties:
                  participantId: { type: [string, "null"], description: 찾은 참가자. 못 찾으면 null('모름') }
                  profileId: { type: [string, "null"], format: uuid, description: 찾은 참가자의 프로필. 손님이거나 모름이면 null }
                  confidence: { type: number, description: 가장 높았던 코사인 유사도 }
                  threshold: { type: number, description: 확신 기준(초안 0.9, 조정 중) }
                  applied: { type: boolean, description: 발화 줄에 화자를 채웠는지 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/voice-prints:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [기록본]
      summary: 대조 값 조회(기기에서 화자 대조)
      description: |
        차가 이 여행의 목소리 대조 값을 받아 가 차 안에서 화자를 가립니다(ADR-0023). 발화 소리를 서버로 보내는 `/voice-match`를 대신합니다.
        녹음에 동의한 참가자만 부르고(아니면 403), **녹음에 동의한 참가자의 값만** 줍니다. 동의가 꺼진 참가자는 프로필 등록값이 있어도 주지 않습니다.
        값은 이 여행에 등록한 것(`source: trip`)을 먼저, 없으면 그 사람 프로필의 등록값(`source: profile`)입니다. 다른 임베더로 만든 값(길이가 `dims`와 다름)은 빠집니다.
        대조 값은 민감정보입니다. 응답은 `Cache-Control: private, no-store`이고, 받은 쪽은 암호화해 두었다가 그 참가자의 동의가 꺼지거나 동의 세대(`generation`)가 오르거나 여행이 지워지면 지웁니다.
        기기의 판정 규칙(여백 규칙): 후보(동의한 등록자)가 둘 이상이면 가장 비슷한 사람의 코사인 유사도가 `floor` 이상이고 두 번째 사람보다 `margin` 이상 앞설 때만 화자를 붙입니다. 발화의 좌석 줄을 아는데 그 사람이 다른 줄에 앉았으면 붙이지 않습니다. 후보가 한 명뿐이면 `threshold`(서버 대조와 같은 절대 기준) 이상일 때만 붙입니다.
        값을 모으는 사이 누군가 동의를 철회하면(동의 세대가 오름) 읽은 값을 버리고 새 상태로 다시 모읍니다. 응답의 `generation`·참가자·값은 한 시점의 것입니다. 철회가 계속 이어져 맞추지 못하면 409이고, 다시 부르면 됩니다.
        여행에는 시간 만료가 없습니다(T90). 여행이 지워지지 않았고 부르는 참가자가 동의한 동안에는 며칠 뒤에도 읽습니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 동의한 참가자의 대조 값
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-store" } }
          content:
            application/json:
              schema:
                type: object
                required: [generation, embedder, dims, threshold, items]
                properties:
                  generation: { type: integer, description: 지금 동의 세대 }
                  embedder: { type: string, description: "값을 만든 임베더의 이름(지금 logmel-pitch-1). 기기의 임베더와 다르면 대조하지 않음" }
                  dims: { type: integer, description: 벡터 길이(지금 112) }
                  threshold: { type: number, description: 확신 기준(초안 0.9, 조정 중) }
                  floor: { type: number, description: "여백 규칙의 바닥(기본 0.6). 후보가 둘 이상일 때 가장 비슷한 사람이 넘어야 하는 유사도" }
                  margin: { type: number, description: "여백 규칙의 여백(기본 0.06). 가장 비슷한 사람이 두 번째 사람보다 앞서야 하는 유사도 차" }
                  items:
                    type: array
                    items:
                      type: object
                      required: [participantId, vector, seconds, source]
                      properties:
                        participantId: { type: string }
                        vector: { type: array, items: { type: number } }
                        seconds: { type: number, description: 등록 음성 길이 }
                        source: { type: string, enum: [trip, profile] }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/scene-suggestions:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [장면]
      summary: 장면 후보(규칙)
      description: |
        기록본에서 말이 몰린 구간을 규칙으로 골라 후보로 줍니다(T43, LLM 없음). 사람이 골라 `POST /moments`로 `at`·`from`·`to`를 남기면 장면이 됩니다.
        기준: 각 발화에서 시작하는 30초 창의 발화 수와 말한 사람 수(좌석 구역, 모르면 화자 대조로 붙은 프로필, 둘 다 없으면 세지 않음). 점수 = 발화 수 + 2 × (말한 사람 수 − 1), 발화 4개 미만은 뺍니다. 장면으로 남길 수 있는 시각(여행을 만든 뒤 ~ 지금+1분)의 발화만 봅니다.
        이미 남긴 장면의 구간(`from`~`to`, 없으면 `at` 앞 20초~뒤 10초)과 겹치는 창은 빼고, 점수 순으로 서로 겹치지 않게 최대 5개를 골라 **시각 순**으로 줍니다.
        여행 전체 음성(`/audio`)이 다 올라와 있으면 그 소리가 후보 구간의 절반 넘게 덮는 후보만 줍니다 — 서버가 잘라 클립으로 만들 수 있는 것만(ADR-0024).
        구간은 창의 첫 발화 1초 전 ~ 마지막 발화 4초 뒤(15~35초). `lines`는 처음 30줄까지. 요청할 때만 계산하고 저장하지 않습니다. 녹음에 동의한 참가자만 읽습니다(받아 적은 글이 들어감).
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 후보. 없으면 빈 배열
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [at, from, to, why, score, lines]
                      properties:
                        at: { type: integer, description: 구간의 첫 발화 시각. 장면으로 남길 때의 at }
                        from: { type: integer }
                        to: { type: integer }
                        why: { type: string, description: "사람이 읽는 이유. 예: 30초에 말이 9번, 3명이 말함" }
                        score: { type: integer }
                        lines: { type: array, items: { $ref: "#/components/schemas/Utterance" }, description: 구간의 발화 }
                        lat: { type: number, description: 구간의 발화에 위치가 있을 때만 }
                        lng: { type: number }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/shortform:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [장면]
      summary: 숏폼 구성 데이터
      description: |
        클립이 올라온 장면마다 소리 주소·자막 큐·말한 사람을 줍니다(T43, ADR-0021). 웹은 9:16 화면에, 차는 그 자리에서 이 데이터로 재생하고, 기기에서 영상 파일로도 만듭니다(ADR-0022). 서버가 만드는 영상은 `/short-generations`입니다.
        여행 전체 음성(`/audio`)이 다 올라와 있으면 읽기 전에 클립이 없는 장면(최대 20개)을 전체 음성에서 잘라 클립으로 남기고 함께 줍니다(ADR-0024). 동의하지 않은 탑승자가 있으면 자르지 않고 있는 클립만 줍니다.
        소리는 `clip`(같은 출처의 `/api/trips/{code}/recordings/{id}`)을 참가자 토큰 머리말로 받습니다 — 웹은 `fetch` → blob → `<audio>`. 자막 큐의 시각은 클립 첫 표본에서 잰 초입니다.
        발화의 `at`과 실제 `endAt`가 있으면 그 구간과 겹침을 보존하고 클립 양끝에서 자릅니다. `endAt`가 없으면 끝을 글자 수로 어림합니다(글자당 0.15초, 1~6초). 추정 구간은 다음 자막에서 자르되 1초를 남기고 클립 끝을 넘지 않습니다.
        말한 사람은 화자 대조(T38)로 붙은 프로필의 참가자만 채우고, 아니면 `participantId: null`과 좌석 구역만 줍니다(자리만으로 이름을 붙이지 않음). 녹음에 동의한 참가자만 읽습니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 숏폼 구성
          content:
            application/json:
              schema:
                type: object
                required: [title, generation, cast, scenes]
                properties:
                  title: { type: string }
                  generation: { type: integer, description: 자막 저장 시 보낼 동의 세대 }
                  cast:
                    type: array
                    items:
                      type: object
                      required: [participantId, name, character, seat]
                      properties:
                        participantId: { type: string }
                        name: { type: string }
                        character: { type: string, description: 프로필의 캐릭터. 손님이면 빈 문자열 }
                        seat: { $ref: "#/components/schemas/Seat" }
                  scenes:
                    type: array
                    items:
                      type: object
                      required: [momentId, label, at, clip, startAt, seconds, cues]
                      properties:
                        momentId: { type: string }
                        label: { type: string }
                        at: { type: integer }
                        clip: { type: string, description: "소리 주소(같은 출처). 예: /api/trips/{code}/recordings/{momentId}" }
                        startAt: { type: integer, description: 클립 첫 표본의 시각(epoch 밀리초) }
                        seconds: { type: number }
                        cues:
                          type: array
                          items:
                            type: object
                            required: [start, end, text, raw, device, seq, editVersion, editedText, participantId, seatArea]
                            properties:
                              start: { type: number, description: 클립 안의 초 }
                              end: { type: number, description: endAt가 있으면 실제 끝을 클립 끝으로 제한. 없으면 기존 글자 수 추정. 실제 겹침은 유지 }
                              endAt: { type: integer, description: 실제 발화 끝(epoch ms). 입력에 있을 때만 }
                              speakerLabel: { type: string, pattern: '^spk:[0-9]{1,4}$' }
                              speakerScope: { type: string, format: uuid, description: 화자 라벨을 비교할 수 있는 단일 전사 요청. 다른 요청과 동일인으로 연결하지 않음 }
                              text: { type: string, description: 수동 수정본(T80) → ASR(T75) → Pleos 원문 순 }
                              raw: { type: string, description: Pleos 원문 }
                              device: { type: string }
                              seq: { type: integer }
                              editedText: { type: [string, "null"] }
                              editVersion: { type: integer, minimum: 0 }
                              asrText: { type: string, description: 재전사 결과가 있을 때만 }
                              editedBy: { type: string, description: 마지막 저장/초기화 참가자 id. 편집 이후만 }
                              editedAt: { type: integer, description: 마지막 저장/초기화 시각(epoch ms). 편집 이후만 }
                              participantId: { type: [string, "null"], description: 화자 대조로 붙은 참가자. 모르면 null }
                              seatArea: { oneOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }] }
                        lat: { type: number }
                        lng: { type: number }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/recordings:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [클립]
      summary: 장면의 원음 클립 올리기
      description: |
        사람이 장면으로 고른 구간의 원음(T76, ADR-0007). 차량 앱이 자른 WAV(16 kHz·16비트 PCM·모노, 5,000,000 B까지)를 다시 자르지 않고 그대로 클립 버킷에 둡니다.
        장면 하나에 클립 하나라 **클립 id는 장면 id**입니다. 같은 장면을 다시 보내면 저장하지 않고 `200`으로 같은 값을 줍니다.
        녹음에 동의한 참가자만, 동의하지 않은 탑승자가 없을 때만 받습니다(`403`, 발화 올리기와 같은 규칙).
        클립 구간(`from`부터 소리 길이만큼)은 그 장면의 구간(`from`~`to`, 없으면 `at` 앞 20초~뒤 10초) 안이어야 합니다(앞뒤 1초 여유, 밖이면 `400`) — 사람이 확정한 구간의 소리만 받습니다(ADR-0007).
        `generation`은 그 소리를 녹음할 때의 동의 세대(여행 읽기의 `generation`)입니다. 지금보다 옛 세대면 철회 전의 소리라 `409`입니다. 사람이 지운 클립을 다시 보내도 `409`입니다.
        차는 `400`·`404`·`409`·`413`이면 그 클립을 버리고, `401`(다시 참가해 토큰을 받음)·`403`·`503`이면 나중에 다시 보냅니다.
        클립 버킷(`CLIPS_BUCKET`)이 없는 환경이거나 버킷에 닿지 못하면 `503`입니다.
      security: [{ participantToken: [] }]
      parameters:
        - { name: moment, in: query, required: true, schema: { type: string }, description: 이 여행의 장면 id }
        - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 }, description: 녹음할 때의 동의 세대 }
        - { name: from, in: query, required: true, schema: { type: integer }, description: "클립 첫 표본의 시각(epoch 밀리초, 차가 자른 구간의 시작). 숏폼 자막을 소리에 맞추는 기준(T43). 여행을 만들기 1분 전부터 지금+1분까지" }
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary } }
      responses:
        "200": { description: 이미 있음(다시 보냄), content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } } }
        "201": { description: 남김, content: { application/json: { schema: { $ref: "#/components/schemas/Recording" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/recordings/{id}:
    parameters:
      - { $ref: "#/components/parameters/code" }
      - { name: id, in: path, required: true, schema: { type: string }, description: 클립 id(= 장면 id) }
    get:
      tags: [클립]
      summary: 클립 듣기
      description: |
        받은 WAV 바이트를 그대로, `Cache-Control: private, no-store`로 줍니다. 기록본처럼 녹음에 동의한 참가자만 듣습니다(`403`).
        토큰은 머리말로만 보냅니다 — 웹은 `fetch` → blob → `<audio>`로 재생합니다(클립 하나 약 0.5~1.1 MB). 서명한 S3 주소를 주지 않고, 별도 media 주소도 두지 않습니다(ADR-0021). 서버가 만든 영상도 같은 주소의 API가 내주므로 ADR-0020은 대체된 채입니다(ADR-0022).
        차가 그 장면의 클립을 올리지 않았고 여행 전체 음성(`/audio`)이 다 올라와 있으면, 장면 구간(`from`~`to`, 없으면 `at` 앞 20초~뒤 10초)과 전체 음성이 겹치는 곳을 잘라 클립으로 남긴 뒤 줍니다(ADR-0024). 겹치는 곳이 장면 구간의 절반에 못 미치면 `404`, 동의하지 않은 탑승자가 있으면 자르지 않고 `403`입니다. 사람이 지운 장면은 다시 자르지 않습니다. 전체 음성이 만료됐으면(다 올린 뒤 2일, 또는 버킷에 없음) 자르지 않고 차가 올린 클립 경로대로 답합니다(있으면 그 클립, 없으면 `404`).
      security: [{ participantToken: [] }]
      responses:
        "200": { description: WAV 바이트, content: { audio/wav: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [클립]
      summary: 클립 지우기
      description: |
        이 여행의 참가자라면 누구나 지웁니다(동의 끄기처럼 지우는 쪽은 넓게). 버킷에서 바로 지우고(버전 관리를 끈 버킷이라 남는 버전 없음) `204`.
        지운 클립은 표시를 남겨 차가 다시 올려도 받지 않습니다(`409`, 동의를 철회했다 다시 켜도 여행이 닫힐 때까지). 받아 적은 글과 장면은 그대로입니다.
        녹음 동의를 철회하면(켜져 있던 동의를 끔) 그 여행의 클립이 모두 지워집니다(커밋 뒤 버킷에서, 실패하면 10분마다 다시). 시간이 지났다는 이유로는 API가 지우지 않습니다(T90).
        버킷을 기다리는 사이 같은 장면의 클립이 새로 올라왔으면(철회 → 다시 동의 → 다시 올림) 그 새 클립은 건드리지 않고 `409` — 다시 지우면 됩니다.
      security: [{ participantToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/audio:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [클립]
      summary: 전체 음성 올리기 상태와 진행률
      description: |
        여행 전체 음성(ADR-0024)의 상태입니다. 차가 올리는 동안 폰(P22)과 차(C22)가 진행률을 읽습니다. 소리가 아니라 이 여행의 참가자라면 녹음 동의와 관계없이 읽습니다.
        `none`은 아직 없음(사람이 지웠으면 `deleted: true`), `uploading`은 받는 중(`expectedBytes`는 `start` 뒤에), `ready`는 다 올라와 장면을 자를 수 있음, `expired`는 보관 기간(다 올린 뒤 2일, `expiresAt`)이 지나 서버의 치우기(10분마다)가 지웠거나 버킷에 없어 장면을 자를 수 없음입니다(11/15 보관 결정). 이미 자른 장면 클립은 남습니다. 다시 출발해 새로 올리는 동안에는 `uploading`이고 앞서 올린 것이 `previous`에 남습니다.
      security: [{ participantToken: [] }]
      responses:
        "200": { description: 상태, content: { application/json: { schema: { $ref: "#/components/schemas/TripAudio" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [클립]
      summary: 전체 음성 지우기
      description: |
        이 여행의 참가자라면 누구나(녹음 동의와 관계없이) 지웁니다. 다 올린 전체 음성, 받던 조각, 전체 음성에서 서버가 잘라 둔 장면 클립을 지우고 표시를 남깁니다 — 그 동의 세대의 전체 음성은 다시 받지 않습니다(`start`·조각·`complete`가 `409`, 차는 버림). 차가 올린 장면 클립은 `/recordings/{id}`로 따로 지웁니다.
        버킷에서는 커밋 뒤에 지웁니다(실패하면 10분마다 다시). 녹음 동의를 철회하면(세대 오름) 전체 음성도 함께 지워집니다.
      security: [{ participantToken: [] }]
      responses:
        "204": { description: 지움(없어도 204) }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/audio/start:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [클립]
      summary: 전체 음성 올리기 시작
      description: |
        올리기 전에 전체 크기·길이·첫 표본의 시각을 알립니다. 같은 값으로 다시 부르면 받은 조각을 그대로 두고, 이미 다 올린 것과 같으면 `ready`를 그대로 줍니다(재시도 안전). 값이 다르면 새로 올리기를 열고 받던 조각을 버립니다(다 올린 앞의 것은 새것을 다 올릴 때까지 남음).
        그 여행의 발화를 올린 기기(참가자)만, 녹음에 모두 동의한 동안, 지금 동의 세대로만 받습니다. 받아 적은 말이 하나도 없는 여행은 내비 장소를 올린 참가자(차)나 운전석 참가자가 올립니다(T162). 옛 세대·지운 전체 음성·다른 기기가 올리는 중이면 `409`(차는 버림), 동의하지 않은 탑승자가 있으면 `403`(나중에 다시), 합치는 중이면 `429`(잠시 뒤 다시). 8시간(921,600,000 B)을 넘으면 `413`.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation, expectedBytes, seconds, startedAt]
              properties:
                generation: { type: integer, minimum: 1, description: 녹음할 때의 동의 세대 }
                expectedBytes: { type: integer, minimum: 2, maximum: 921600000, description: 전체 PCM 바이트(짝수). 16 kHz 모노 s16le라 초당 32,000 B }
                seconds: { type: number, description: 전체 길이(초). expectedBytes ÷ 32,000과 1초 안으로 맞아야 함 }
                startedAt: { type: integer, description: 첫 표본의 시각(epoch 밀리초). 장면 시각을 바이트 위치로 바꾸는 기준. 여행을 만들기 1분 전부터 지금+1분까지 }
      responses:
        "200": { description: 지금 상태, content: { application/json: { schema: { $ref: "#/components/schemas/TripAudio" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/audio/parts/{n}:
    parameters:
      - { $ref: "#/components/parameters/code" }
      - { name: n, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 9999 }, description: 조각 번호(0부터, 앞에 0을 붙이지 않음) }
    put:
      tags: [클립]
      summary: 전체 음성 조각 올리기
      description: |
        16 kHz 모노 s16le PCM 조각(머리 없음, 짝수 바이트, 4 MiB = 4,194,304 B까지). 같은 `n`을 다시 보내면 덮습니다(재시도 안전). 순서는 상관없습니다. 조각 크기가 서로 달라도 됩니다.
        권한·세대 규칙은 `start`와 같습니다. `start` 전에 온 조각도 받지만(크기를 몰라 진행률 0) 다 올린 뒤에는 `start` 없이 받지 않습니다(`409`). 합치는 중이면 `429`.
        본문을 받아 버킷에 두는 동안 여행을 잠그지 않고, 둔 뒤 다시 확인합니다 — 그 사이 동의가 철회됐거나 지웠으면 둔 조각을 버리고 `409`.
      security: [{ participantToken: [] }]
      parameters:
        - { name: generation, in: query, required: true, schema: { type: integer, minimum: 1 }, description: 녹음할 때의 동의 세대 }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: 받음
          content:
            application/json:
              schema:
                type: object
                required: [n, bytes]
                properties:
                  n: { type: integer }
                  bytes: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/audio/complete:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [클립]
      summary: 전체 음성 올리기 끝내기
      description: |
        조각 `0`~`parts-1`을 순서대로 이어 sha256을 세며 클립 버킷에 객체 하나로 두고(8 MiB가 넘으면 S3 멀티파트), 조각을 지웁니다. 다 올린 앞의 전체 음성이 있으면 바꿉니다.
        sha256이 틀리면 `409` — 받은 조각을 모두 버리니 같은 올리기에 조각을 처음부터 다시 보냅니다. 빠진 조각이 있거나 받은 크기가 `start`의 `expectedBytes`와 다르면 `409`(조각은 그대로, 상태의 `partNumbers`로 빠진 것을 봄). 길이가 받은 크기와 1초 넘게 다르면 `400`.
        완료 응답을 받지 못해 다시 부르면 같은 sha256이면 `200`(보관 기간이 지나 지워졌으면 `409`). 합치는 동안(최대 10분 잠금) 다른 완료는 `429`. 합치는 사이 동의가 철회되거나 지웠으면 이은 것을 버리고 `409`/`403`.
        차는 `ready`를 받은 뒤 차 안에 암호화해 둔 원음을 지웁니다(ADR-0024).
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation, parts, seconds, sha256]
              properties:
                generation: { type: integer, minimum: 1 }
                parts: { type: integer, minimum: 1, maximum: 10000, description: 조각 수. 0부터 parts-1까지 잇고 그 뒤 번호는 버림 }
                seconds: { type: number, description: 전체 길이(초) }
                sha256: { type: string, pattern: "^[0-9a-fA-F]{64}$", description: 이은 PCM 전체의 sha256 }
                startedAt: { type: integer, description: 첫 표본의 시각(epoch 밀리초). start를 부르지 않았을 때만 필요 }
      responses:
        "200":
          description: 다 올림
          content:
            application/json:
              schema:
                type: object
                required: [state, seconds]
                properties:
                  state: { type: string, enum: [ready] }
                  seconds: { type: number, description: 받은 크기로 잰 길이 }
                  bytes: { type: integer }
                  startedAt: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/todos:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [기록본]
      summary: 원발화가 연결된 장소별 할 일
      description: |
        현재 세대의 살아 있는 전사에서 장소·권유/의무형 규칙으로 추출합니다(place-rules-v3, LLM 없음). v3(T167)은 장소 없이 의무형으로 끝나는 말을 앞 30초 안에 나온 여행 장소(내비 경유지·목적지)의 할 일로 봅니다(docs/api/todos.md '문맥 할 일'). v1(차량 Todos.kt와 같은 '…에서 …자')에 '…가면/가서 …'와 '요'·'급해' 끝을 더했고, 항목마다 분류(`category`)·제목(`title`)·물건(`items`)·요청한 사람(`requestedBy`)을 줍니다(T141, v2 도착 브리핑). v1이 뽑던 문장의 id는 그대로입니다.
        수동 교정본 → 자동 교정본 → 원문 순으로 읽으며, 같은 장소·문장은 하나로 묶고 모든 원발화를 sources에 남깁니다.
        id는 장소·문장의 해시이므로 내용이 바뀌면 바뀝니다. 상태만 따로 저장하며 원문을 지우면 목록에서 사라집니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 현재 할 일과 동의 세대
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodoList" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/todos/{id}:
    parameters: [{ $ref: "#/components/parameters/code" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [기록본]
      summary: 할 일 완료·취소·다시 열기
      description: 동의한 참가자가 현재 generation·version으로 저장합니다. 원문이 없어지면 404, 다른 사람이 먼저 바꾸거나 동의 세대가 바뀌면 409입니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation, expectedVersion, status]
              properties:
                generation: { type: integer, minimum: 1, maximum: 2147483647 }
                expectedVersion: { type: integer, minimum: 0, maximum: 2147483646 }
                status: { type: string, enum: [pending, done, cancelled] }
      responses:
        "200":
          description: 저장한 할 일
          content:
            application/json:
              schema:
                type: object
                required: [generation, item]
                properties:
                  generation: { type: integer }
                  item: { $ref: "#/components/schemas/Todo" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/arrival-briefing:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [기록본]
      summary: 입력된 위치·주차 근거에 따른 장소별 도착 브리핑
      description: |
        여행 상태가 parked/ended이고 parked=true, 관측이 60초 이내이며 장소에서 250m 이내일 때만 해당 장소의 pending 항목을 반환합니다.
        장소 매칭은 차량 Todos.kt와 같은 이름 포함 규칙입니다. 다른 장소·완료·취소 항목은 제외합니다.
        source는 클라이언트가 제공한 관측 출처입니다. 서버가 실차 센서를 직접 확인했다는 뜻이 아닙니다.
        좌표를 저장하거나 외부 제공자로 보내지 않으며 내비·여행 상태를 바꾸지 않습니다.
        eligible=true이면 장소 이름·관측 시각·출처만 여행에 남겨 `GET /todos`의 `arrival`로 알립니다(T119). 폰은 내비의 장소를 모르기 때문입니다.
        다시 주행(또는 탑승)으로 바뀌거나 동의 세대가 오르면 지웁니다. 토큰 없이 읽는 여행 문서(`GET /api/trips/{code}`)에는 싣지 않습니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation, place, position, parked, observedAt, source]
              properties:
                generation: { type: integer, minimum: 1, maximum: 2147483647 }
                place:
                  allOf:
                    - { $ref: "#/components/schemas/TodoPosition" }
                    - type: object
                      required: [name]
                      properties:
                        name: { type: string, minLength: 1, maxLength: 100 }
                position: { $ref: "#/components/schemas/TodoPosition" }
                parked: { type: boolean }
                observedAt: { type: integer, minimum: 0, description: 관측 시각 epoch ms. 미래는 5초까지만 허용합니다. }
                source: { type: string, enum: [vehicle, browser] }
      responses:
        "200":
          description: 판단과 해당 장소의 미완료 목록. 조건이 맞지 않으면 eligible=false와 빈 items입니다.
          content:
            application/json:
              schema:
                type: object
                required: [generation, eligible, reason, source, observedAt, place, distanceMeters, method, items]
                properties:
                  generation: { type: integer }
                  eligible: { type: boolean }
                  reason: { type: [string, "null"], enum: [not_parked, stale_position, outside_place, null] }
                  source: { type: string, enum: [vehicle, browser] }
                  observedAt: { type: integer }
                  place: { type: object }
                  distanceMeters: { type: integer }
                  method: { type: string, const: place-rules-v3 }
                  items: { type: array, items: { $ref: "#/components/schemas/Todo" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    profileToken:
      type: http
      scheme: bearer
      description: POST /api/profiles·/api/accounts·/api/sessions가 돌려준 기기 토큰
    participantToken:
      type: http
      scheme: bearer
      description: 여행 참가(POST /api/trips/{code}/participants) 응답이 돌려준 참가자 토큰. 음성 경로(발화·기록본·클립)와 동의 켜기의 인증에 씀(ADR-0007, T68)
    workerToken:
      type: http
      scheme: bearer
      description: 생성 일꾼 토큰(SHORTS_WORKER_TOKEN, 32자 이상). 운영자 맥의 생성 일꾼만 가짐(ADR-0025)
  parameters:
    code: { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z2-9]{6}$" }, description: 여행 코드. 대소문자를 가리지 않음 }
    id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: 거절한 이유
      content:
        application/json:
          schema:
            type: object
            required: [error, type]
            properties:
              error: { type: string, description: 사람이 읽는 이유(바뀔 수 있음) }
              type:
                type: string
                enum: [invalid, unauthenticated, forbidden, not_found, method_not_allowed, conflict, gone, too_large, rate_limited, unavailable, internal]
                description: "오류 종류(T71). 클라이언트는 문장이 아니라 이것으로 가른다. unavailable(503)은 DB에 닿지 않거나 질의 시간 제한 — 잠시 뒤 다시 해도 된다. gone(410)은 종료한 옛 QR 초대(/j)·대리 참가 경로와 만료·바뀐 그룹 초대 코드. rate_limited(429)는 틀린 그룹 초대 코드를 너무 많이 시도함"
      headers:
        x-request-id: { schema: { type: string }, description: "요청 id(로그와 맞춰 볼 때). 성공 응답에도 같은 머리말이 있다(경로마다 적지 않음)" }
  schemas:
    TodoPosition:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Todo:
      type: object
      required: [id, place, text, status, version, sources]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        place: { type: string }
        text: { type: string, description: 현재 표시 전사에서 추출한 문장. 요약·재작성하지 않습니다. }
        status: { type: string, enum: [pending, done, cancelled] }
        version: { type: integer, minimum: 0 }
        sources:
          type: array
          items:
            type: object
            required: [device, seq, at, text, displayText]
            properties:
              device: { type: string }
              seq: { type: integer }
              at: { type: integer }
              text: { type: string, description: 원전사 }
              displayText: { type: string, description: 교정 우선순위를 적용한 전사 }
              participantId: { type: string, description: 확인된 화자가 있을 때만 }
        category:
          type: string
          enum: [first, buy, remember, bring]
          description: "도착 브리핑의 묶음(T141). first = 먼저 할 일(화장실·먼저·급해), buy = 잊지 말고 살 것(사다·사 가자·사 오자), bring = 챙길 것(챙기다·가져가다·내리다·꺼내다, 물건이 있을 때), remember = 잊지 말기(나머지). 앞의 것이 먼저"
        title: { type: string, description: "행동 이름. 끝(자·야지·야 돼)을 떼고 마지막 동사를 '…하기'꼴로. 예: '화장실 먼저 다녀오기', '고기는 바로 냉장 보관', '가방 챙기기'" }
        items:
          type: array
          description: "한 부탁 안의 물건. 살 것·챙길 것은 동사 앞 말을 랑·이랑·하고·와·과·쉼표·그리고로 나눔(예: '삼겹살 600g이랑 귤 한 봉지 사 가자' → 삼겹살 600g, 귤 1봉지). 먼저 할 일·잊지 말기는 동사를 뺀 말 하나. 물건을 말하지 않았으면 빈 배열"
          items:
            type: object
            required: [name, qty]
            properties:
              name: { type: string }
              qty: { type: [string, "null"], description: "숫자+단위(g·kg·개·병·봉지·팩·캔·마리) 또는 한·두·세…+단위를 '600g'·'1봉지'·'2병'으로. 그 밖의 단위는 이름에 남기고 null" }
        requestedBy: { type: array, items: { type: string }, description: 출처 발화의 확인된 화자(participantId), 중복 없이 처음 말한 순서. 화자가 없으면 빈 배열 }
        method: { type: string, enum: [place-rules-v2, place-rules-v3], description: "v2 규칙으로 뽑은 항목은 v2, 문맥 규칙(T167)으로 뽑은 항목은 v3" }
    TodoList:
      type: object
      required: [generation, method, items]
      properties:
        generation: { type: integer }
        method: { type: string, const: place-rules-v3 }
        items: { type: array, items: { $ref: "#/components/schemas/Todo" } }
        arrival:
          description: 마지막으로 도착 판정(eligible=true)을 받은 장소(T119). 없거나 다시 출발했으면 null. 좌표는 없습니다. 클라이언트가 보낸 관측에 대한 판정이며 서버가 차량 센서를 확인했다는 뜻이 아닙니다.
          oneOf:
            - { type: "null" }
            - type: object
              required: [place, at, source]
              properties:
                place: { type: string, description: 호출자가 보낸 장소 이름(내비의 다음 경유지나 목적지) }
                at: { type: integer, description: 관측 시각 epoch ms }
                source: { type: string, enum: [vehicle, browser] }
    ShortPlanInput:
      type: object
      properties:
        templateId: { type: string, enum: [car-sitcom-v1, travel-postcard-v1], default: car-sitcom-v1 }
        momentId: { type: string }
        audioReference: { type: boolean, const: false, description: 원음은 외부 생성에 보내지 않습니다(ADR-0025). true는 400입니다. }
    ShortPlan:
      type: object
      required: [schemaVersion, templateId, templateVersion, model, resolution, width, height, fps, momentId, generation, title, seconds, cast, cues, shots, audioReference, externalData, estimatedGenerationSeconds, selectionReason, warnings, planHash]
      properties:
        schemaVersion: { type: integer, const: 1 }
        templateId: { type: string }
        templateVersion: { type: integer }
        model: { type: string }
        resolution: { type: string, const: 720p }
        width: { type: integer, const: 720 }
        height: { type: integer, const: 1280 }
        fps: { type: integer, const: 30 }
        momentId: { type: string }
        generation: { type: integer }
        title: { type: string }
        seconds: { type: number, minimum: 15, maximum: 45 }
        cast:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            required: [slot, participantId, name, character, seat]
            properties:
              slot: { type: integer, enum: [0, 1, 2, 3] }
              participantId: { type: [string, 'null'] }
              name: { type: string }
              character: { type: string }
              seat: { type: [string, 'null'] }
        cues:
          type: array
          items:
            type: object
            required: [start, end, text, device, seq, editVersion, participantId, slot]
            properties:
              start: { type: number }
              end: { type: number }
              text: { type: string }
              device: { type: string }
              seq: { type: integer }
              editVersion: { type: integer }
              participantId: { type: [string, 'null'] }
              slot: { type: [integer, 'null'], enum: [0, 1, 2, 3, null] }
        shots:
          type: array
          items:
            type: object
            required: [index, start, end, seconds, generationSeconds, beat, turns]
            properties:
              index: { type: integer }
              start: { type: number }
              end: { type: number }
              seconds: { type: number }
              generationSeconds: { type: integer, minimum: 4, maximum: 8 }
              beat: { type: string, enum: [hook, exchange, payoff] }
              turns: { type: array, items: { type: object } }
        audioReference: { type: boolean }
        externalData: { type: array, items: { type: string } }
        estimatedGenerationSeconds: { type: integer }
        selectionReason: { type: string }
        warnings: { type: array, items: { type: string } }
        planHash: { type: string }
    ShortAssetSource:
      type: object
      required: [momentId, generation, sourceHash, seconds, source]
      properties:
        momentId: { type: string }
        generation: { type: integer }
        sourceHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        seconds: { type: number, minimum: 0.5, maximum: 60 }
        source:
          type: object
          required: [title, generation, cast, scenes]
          properties:
            title: { type: string }
            generation: { type: integer }
            cast: { type: array, items: { type: object } }
            scenes: { type: array, minItems: 1, maxItems: 1, items: { type: object } }
    ShortAsset:
      type: object
      required: [id, origin, state, momentId, generation, sourceHash, createdAt, createdBy]
      properties:
        id: { type: string, format: uuid }
        origin: { type: string, const: local-render }
        state: { type: string, enum: [uploading, completed, failed, source_changed] }
        momentId: { type: string }
        generation: { type: integer }
        sourceHash: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        result:
          type: object
          required: [url, sha256, mimeType, bytes, seconds, width, height, fps, videoCodec, audioCodec, audioSampleRate, audioChannels, videoFrames, audioFrames]
          properties:
            url: { type: string }
            sha256: { type: string }
            mimeType: { type: string, enum: [video/mp4, video/webm] }
            bytes: { type: integer }
            seconds: { type: number }
            width: { type: integer }
            height: { type: integer }
            fps: { type: number }
            videoCodec: { type: string }
            audioCodec: { type: string }
            audioSampleRate: { type: integer }
            audioChannels: { type: integer }
            videoFrames: { type: integer }
            audioFrames: { type: integer }
    ShortGeneration:
      type: object
      required: [id, state, momentId, generation, progress, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [queued, submitting, generating, composing, completed, failed, canceled, submission_unknown] }
        templateId: { type: string }
        templateVersion: { type: integer }
        momentId: { type: string }
        generation: { type: integer }
        progress:
          type: object
          required: [completedShots, totalShots]
          properties:
            completedShots: { type: integer }
            totalShots: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        errorCode: { type: string }
        thumbnailUrl: { type: string, description: "표지 그림 주소(T166). 일꾼이 올린 뒤에만 있다(만드는 중에도). 같은 참가자 토큰으로 받는다" }
        result:
          type: object
          required: [url, mimeType, bytes, seconds, width, height]
          properties:
            url: { type: string }
            mimeType: { type: string, const: video/mp4 }
            bytes: { type: integer }
            seconds: { type: number }
            width: { type: integer, const: 720 }
            height: { type: integer, const: 1280 }
    BoardingJoin:
      type: object
      required: [tripCode, participant, token]
      additionalProperties: false
      properties:
        tripCode: { type: string }
        participant: { $ref: "#/components/schemas/Participant" }
        token: { type: string, minLength: 43, maxLength: 43, description: 폰이 보관할 본인의 참가자 토큰 }
    Seat:
      type: string
      enum: [ROW_1_LEFT, ROW_1_RIGHT, ROW_2_LEFT, ROW_2_CENTER, ROW_2_RIGHT]
      description: Pleos Vehicle SDK의 SeatArea 이름. ROW_1_LEFT가 운전석
    TripStatus: { type: string, enum: [boarding, driving, parked, ended] }
    When: { type: string, enum: [now, return, before_arrival, after_parking], default: now }
    RequestStatus: { type: string, enum: [held, proposed, accepted, reflected, done, cancelled] }
    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        consentDefault: { type: boolean, default: false, description: 참가할 때 기록 동의의 기본값 }
        character: { type: string, maxLength: 20, description: 캐릭터 값. 목록은 화면 문서(T46)에서 정한다 }
        device: { type: string, maxLength: 20, description: 이 기기 토큰의 이름(표시용) }
    ProfilePatch:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          properties:
            consent: { type: boolean, description: 계정의 녹음 동의(T128) }
            consentVersion: { type: string, minLength: 1, maxLength: 40, description: "동의한 문구의 판. 보내지 않으면 서버의 지금 판(2026-11-14). consent: true일 때만 남음" }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id, name, consentDefault, character, hasPhoto, links, email, hasVoice, consent, consentAt, consentVersion]
          properties:
            id: { type: string, format: uuid }
            character: { type: string }
            hasPhoto: { type: boolean }
            links: { type: array, items: { type: string, enum: [google] }, description: 연결된 OAuth 제공자 }
            email: { type: [string, "null"], description: 이메일 계정(T128). 이 모양은 본인 응답에만 쓰입니다. 계정이 없으면 null }
            hasVoice: { type: boolean, description: 목소리 대조 값이 지금 임베더의 길이로 등록돼 있는지(ADR-0023) }
            consent: { type: boolean, description: 계정의 녹음 동의(T128) }
            consentAt: { type: [integer, "null"], description: 동의한 시각(epoch ms). 동의가 꺼져 있으면 null }
            consentVersion: { type: [string, "null"], description: 동의한 문구의 판. 동의가 꺼져 있으면 null }
    GroupInvite:
      type: object
      required: [code, expiresAt, url]
      properties:
        code: { type: string, pattern: "^(FAMILY|TRIP)-[0-9]{4}$" }
        expiresAt: { type: integer, description: epoch ms(만든 뒤 24시간) }
        url: { type: string, description: "같은 출처의 앱 주소 /?group=<코드>. QR이 담는 값" }
    GroupMember:
      type: object
      required: [profileId, name, character, hasPhoto, hasVoice, consent, role, seat, pending]
      properties:
        profileId: { type: string, format: uuid }
        name: { type: string }
        character: { type: string }
        hasPhoto: { type: boolean, description: "사진은 GET /profiles/{id}/photo(같은 그룹 구성원)" }
        hasVoice: { type: boolean, description: 지금 임베더 길이의 목소리 값이 있는지 }
        consent: { type: boolean, description: 계정 동의(아이는 보호자 동의)가 지금 문구 판으로 켜져 있는지 }
        role: { type: string, enum: [owner, adult, child] }
        seat: { anyOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }] }
        pending: { type: boolean, const: false }
        guardianId: { type: string, format: uuid, description: 아이일 때만. 보호자의 profileId }
    Group:
      type: object
      required: [id, name, kind, ownerId, members, invite]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [family, guest] }
        ownerId: { type: string, format: uuid }
        members: { type: array, items: { $ref: "#/components/schemas/GroupMember" }, description: 대표, 성인, 아이 차례 }
        invite: { anyOf: [{ $ref: "#/components/schemas/GroupInvite" }, { type: "null" }], description: 지금 쓸 수 있는 초대. 없거나 만료면 null }
    ProfileWithToken:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [token]
          properties: { token: { type: string, description: 이 기기가 쓸 43자 토큰 } }
    ProfileMaybeToken:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties: { token: { type: string, description: 토큰 없이 찾아 들어갔거나 새로 만들었을 때만. 이 기기가 쓸 43자 토큰 } }
    Participant:
      type: object
      required: [id, name, seat, consent]
      properties:
        id: { type: string }
        name: { type: string }
        seat: { $ref: "#/components/schemas/Seat" }
        consent: { type: boolean }
        profileId: { type: string, format: uuid, description: 프로필로 참가했을 때만 }
    ParticipantWithToken:
      allOf:
        - $ref: "#/components/schemas/Participant"
        - type: object
          required: [token]
          properties: { token: { type: string, description: 참가자 토큰. 43자 base64url. 다시 참가하면 이 기기의 것을 새로 받음(앞서 받은 것도 그대로 씀) } }
    Request:
      type: object
      required: [id, by, text, when, status, createdAt]
      properties:
        id: { type: string }
        by: { type: string }
        text: { type: string }
        when: { $ref: "#/components/schemas/When" }
        status: { $ref: "#/components/schemas/RequestStatus" }
        createdAt: { type: integer }
    Moment:
      type: object
      required: [id, at, label]
      properties:
        id: { type: string }
        at: { type: integer }
        lat: { type: number, description: 위치 없는 장면은 아예 없음(ADR-0007) }
        lng: { type: number }
        label: { type: string }
        from: { type: integer, description: 장면 구간의 시작(T43). 남길 때 준 경우에만 }
        to: { type: integer, description: 장면 구간의 끝 }
    TripAudio:
      type: object
      required: [state, receivedParts, receivedBytes, progress]
      properties:
        state: { type: string, enum: [none, uploading, ready, expired], description: "expired = 다 올린 뒤 2일이 지나 서버의 치우기가 지웠거나 버킷에 없음(11/15 보관 결정). 장면을 새로 자르지 않는다. 장면 클립은 시간으로 지우지 않는다" }
        receivedParts: { type: integer, description: 받은 조각 수(ready면 이은 조각 수) }
        receivedBytes: { type: integer }
        expectedBytes: { type: integer, description: start에서 알린 전체 크기. ready면 저장한 크기 }
        seconds: { type: number }
        progress: { type: number, minimum: 0, maximum: 1, description: receivedBytes ÷ expectedBytes(크기를 모르면 0, ready면 1) }
        generation: { type: integer, description: 녹음할 때의 동의 세대 }
        startedAt: { type: integer, description: 첫 표본의 시각(epoch 밀리초) }
        partNumbers: { type: array, items: { type: integer }, description: 받은 조각 번호(uploading일 때) }
        previous:
          type: object
          description: 새로 올리는 동안 장면 자르기에 쓰는 앞서 다 올린 전체 음성(uploading일 때만)
          properties:
            bytes: { type: integer }
            seconds: { type: number }
            startedAt: { type: integer }
        deleted: { type: boolean, description: 사람이 지움 — 이 동의 세대의 전체 음성은 다시 받지 않는다(none일 때만) }
        expiresAt: { type: integer, description: "보관이 끝나는 때(epoch 밀리초) = 다 올린 때 + 2일. ready·expired와 previous에 있음" }
    Recording:
      type: object
      required: [id, momentId, startAt, seconds, bytes]
      properties:
        id: { type: string, description: 클립 id. 장면 id와 같음 }
        momentId: { type: string }
        startAt: { type: integer, description: 클립 첫 표본의 시각(epoch 밀리초) }
        seconds: { type: number, description: 소리 길이(초) }
        bytes: { type: integer, description: 받은 WAV 크기 }
    UtteranceInput:
      type: object
      required: [seq]
      properties:
        seq: { type: integer, minimum: 1, maximum: 1000000000, description: 기기가 매기는 순번 }
        at: { type: integer, description: epoch 밀리초. 지금 세대 발화에는 꼭 있음(옛 세대는 seq·generation만) }
        endAt: { type: [integer, "null"], description: 실제 발화 끝(epoch ms). 선택 칸이며 at보다 크고 at+10000 이하. 없으면 기존 차량 입력과 같음 }
        speakerLabel: { type: [string, "null"], pattern: '^spk:[0-9]{1,4}$', description: 공급자의 요청 범위 익명 화자. speakerScope와 함께 있을 때만 허용하며 참가자 신원을 배정하지 않음 }
        speakerScope: { type: [string, "null"], format: uuid, description: /transcriptions의 diarization.requestId. speakerLabel과 함께 있어야 함. 다른 요청의 같은 번호는 동일인이 아님 }
        text: { type: string, minLength: 1, maxLength: 500, description: 지금 세대 발화에는 꼭 있음 }
        seatArea: { anyOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }], description: 좌석 구역(T37). 모르면 null이나 생략 }
        generation: { type: integer, minimum: 1, description: 발화를 만들 때의 동의 세대(올릴 때만). 없으면 본문의 generation }
        confidence: { type: number, minimum: 0, maximum: 1, description: 받아쓰기 확신도. 제공자가 주면 }
        lat: { type: number, minimum: -90, maximum: 90, description: 좌표는 둘 다 있거나 둘 다 없음 }
        lng: { type: number, minimum: -180, maximum: 180 }
        participantId: { type: [string, "null"], description: "화자(참가자 id, 손님 포함). 올릴 때는 선택 칸 — 기기가 차 안에서 대조한 참가자(ADR-0023). 없으면 생략" }
        speakerMethod: { type: string, enum: [device-voice, server-voice], description: "화자를 붙인 방법. 올릴 때는 device-voice만, participantId가 있으면 꼭 있음. server-voice는 서버 대조(/voice-match)가 붙인 것. 사람이 고친 줄에는 없음" }
        speakerConfidence: { type: number, minimum: 0, maximum: 1, description: 화자 대조의 코사인 유사도. 있을 때만 }
    VoicePrintInput:
      type: object
      required: [embedder, vector, seconds]
      description: 기기가 계산한 목소리 대조 값(ADR-0023). 수식은 backend/api/providers/voice.js, 두 구현은 backend/api/voice-vectors.json으로 맞춥니다.
      properties:
        embedder: { type: string, const: logmel-pitch-1, description: 서버의 임베더 이름과 다르면 400 — 수식이 다른 값이 섞이지 않게 }
        vector: { type: array, minItems: 112, maxItems: 112, items: { type: number }, description: "로그멜 평균 26 + 분산 26 + 음높이 60. 묶음마다 평균 0·길이 1(음높이를 못 잡았으면 그 묶음은 0). 아니면 400" }
        seconds: { type: number, minimum: 1, maximum: 20, description: 값을 만든 등록 음성의 길이 }
    Utterance:
      allOf:
        - $ref: "#/components/schemas/UtteranceInput"
        - type: object
          required: [device, displayText, editedText, editVersion]
          properties:
            device: { type: string }
            profileId: { type: string, format: uuid, description: 화자가 프로필 참가자일 때 그 프로필. 아니면 생략 }
            displayText: { type: string, description: 수동 수정본 → ASR → Pleos 원문 순으로 고른 표시 글 }
            editedText: { type: [string, "null"], description: 수동 수정본. 없거나 초기화하면 null }
            editVersion: { type: integer, minimum: 0, description: 초기값 0. 저장/초기화마다 증가 }
            editedBy: { type: string, description: 마지막 저장/초기화 참가자 id. 편집 이후만 }
            editedAt: { type: integer, description: 마지막 저장/초기화 시각(epoch ms). 편집 이후만 }
            asrText: { type: string, description: "고른 장면 클립의 소리로 다시 받아 적은 글(T75). 있을 때만 — 기록본과 장면 후보의 발화에. text(Pleos 원문)는 그대로" }
    Transcript:
      type: object
      required: [generation, utterances, requests, todos, places]
      properties:
        generation: { type: integer }
        utterances: { type: array, items: { $ref: "#/components/schemas/Utterance" } }
        requests: { type: array, items: { $ref: "#/components/schemas/Request" } }
        todos: { type: array, items: { $ref: "#/components/schemas/Todo" }, description: 실제 전사의 장소별 할 일과 사용자 상태(place-rules-v3) }
        places: { type: array, items: { $ref: "#/components/schemas/Place" }, description: "차가 남긴 장소, at 순서(T136). GET /places와 같음" }
    FeedItem:
      type: object
      required: [kind, tripCode, at]
      properties:
        kind: { type: string, enum: [utterance, moment] }
        tripCode: { type: string }
        at: { type: integer }
        endAt: { type: integer, description: 실제 발화 끝(epoch ms). 입력에 있을 때만 }
        speakerLabel: { type: string, pattern: '^spk:[0-9]{1,4}$' }
        speakerScope: { type: string, format: uuid, description: 단일 전사 요청 범위. 참가자 신원과 별개 }
        text: { type: string, description: kind가 utterance일 때 }
        seatArea: { anyOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }] }
        id: { type: string, description: kind가 moment일 때 }
        label: { type: string }
        lat: { type: number }
        lng: { type: number }
    PlaceKind: { type: string, enum: [start, stop, approaching, arrived, destination], description: "출발, 경유, 곧 도착, 도착, 목적지(내비에 정함)" }
    Place:
      type: object
      required: [id, kind, name, at, by]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/PlaceKind" }
        name: { type: string }
        at: { type: integer, description: epoch 밀리초 }
        lat: { type: number, description: 좌표 없는 장소는 아예 없음 }
        lng: { type: number }
        etaSeconds: { type: integer, description: 보냈을 때만 }
        by: { type: string, description: 남긴 참가자 id }
    MyTrip:
      type: object
      required: [code, title, status, createdAt, startedAt, endedAt, groupName, groupId, recording, me, members, places, route, contents]
      properties:
        code: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        createdAt: { type: integer }
        startedAt: { type: [integer, "null"], description: 처음 주행을 시작한 시각. 그 전·옛 여행은 null }
        endedAt: { type: [integer, "null"], description: 여행을 끝낸 시각 }
        groupName: { type: [string, "null"], description: 그룹으로 만든 여행일 때 그 그룹 이름 }
        groupId: { type: [string, "null"], description: "그룹으로 만든 여행일 때 그 그룹 id(T162). 폰이 내 그룹의 진행 중 여행을 찾는다" }
        recording: { type: boolean, description: 지금 기록 중인지(T162) }
        me:
          type: object
          description: "이 여행에서의 나(T162). 참가자 토큰은 싣지 않는다 — 토큰이 없는 폰은 프로필 토큰으로 POST /trips/{code}/participants를 불러 받는다"
          required: [participantId, seat, consent]
          properties:
            participantId: { type: string }
            seat: { $ref: "#/components/schemas/Seat" }
            consent: { type: boolean, description: 이 여행에서의 녹음 동의 }
        members:
          type: array
          items:
            type: object
            required: [participantId, name, character, seat]
            properties:
              participantId: { type: string }
              name: { type: string }
              character: { type: string, description: 프로필의 지금 캐릭터, 없으면 참가할 때의 것, 손님은 빈 글 }
              seat: { $ref: "#/components/schemas/Seat" }
              profileId: { type: string, format: uuid, description: 프로필로 참가했을 때만 }
        places: { type: array, items: { $ref: "#/components/schemas/Place" }, description: at 순서. 그 여행에서 내가 녹음에 동의했을 때만(T136) }
        route:
          type: array
          maxItems: 200
          items: { type: array, prefixItems: [{ type: number }, { type: number }, { type: integer }], minItems: 3, maxItems: 3, description: "[lat, lng, at]" }
        contents:
          type: array
          description: 보관·생성을 마친 영상 가운데 지금 원본(원음·자막·화자)과 같은 것만(T162). 원본이 바뀐 영상은 파일이 409라 싣지 않는다
          items:
            type: object
            required: [id, momentId, title, seconds, at, from, to, lat, lng, place, kind, cast, lines, url, thumbnailUrl]
            properties:
              id: { type: string, format: uuid }
              momentId: { type: string }
              title: { type: string }
              seconds: { type: number }
              at: { type: integer, description: 장면 시각(epoch ms) }
              from: { type: [integer, "null"], description: 장면 구간 시작(epoch ms). 구간이 없으면 at 앞 20초(F6) }
              to: { type: [integer, "null"], description: 장면 구간 끝(epoch ms). 구간이 없으면 at 뒤 10초 }
              cast:
                type: array
                description: 장면 구간에서 말한 사람(화자를 확인한 줄만), 처음 말한 순서. 갤러리 타일·플레이어의 캐릭터(F6)
                items:
                  type: object
                  required: [participantId, name, character]
                  properties:
                    participantId: { type: string }
                    name: { type: string }
                    character: { type: string }
              lines:
                type: array
                maxItems: 30
                description: 장면 구간의 발화(지금 동의 세대, 시각 순, 30줄까지). 플레이어 자막 줄(F6). 화자를 모르면 participantId·name이 null
                items:
                  type: object
                  required: [at, participantId, name, text]
                  properties:
                    at: { type: integer }
                    participantId: { type: [string, "null"] }
                    name: { type: [string, "null"] }
                    text: { type: string, description: 고친 글 → 다시 받아 적은 글 → 원래 글 순 }
              lat: { type: [number, "null"] }
              lng: { type: [number, "null"] }
              place: { type: [string, "null"], description: 그 시각 전에 남은 마지막 장소 이름 }
              kind: { type: string, enum: [device, generated] }
              url: { type: string, description: 그 여행의 참가자 토큰으로 받는 파일 주소 }
              thumbnailUrl: { type: [string, "null"], description: "생성 영상의 표지 그림 주소(T166). 기기 영상이거나 아직 없으면 null" }
    Trip:
      type: object
      required: [code, title, status, recording, participants, requests, moments, version, createdAt]
      properties:
        code: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        recording: { type: boolean }
        generation: { type: integer, description: 동의 세대(ADR-0007). 동의 철회로 올라감 }
        participants: { type: array, items: { $ref: "#/components/schemas/Participant" } }
        requests: { type: array, items: { $ref: "#/components/schemas/Request" } }
        moments: { type: array, items: { $ref: "#/components/schemas/Moment" } }
        startedAt: { type: integer, description: 처음 주행을 시작한 시각(T131). 그 전에는 없음 }
        endedAt: { type: integer, description: 끝낸 시각. 끝낸 여행에만 }
        version: { type: integer, description: 바뀔 때마다 1씩 늘어남 }
        createdAt: { type: integer }
