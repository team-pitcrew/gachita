openapi: 3.1.0
info:
  title: 같이타 API
  version: 0.5.0
  summary: 여행 세션, 기기 프로필, 부탁, 장면, 기록본, 가족 그룹
  description: |
    웹앱(frontend/web)과 차량 앱(frontend/car)이 부르는 API입니다. 구현은 backend/api/server.js입니다.

    - 모든 본문은 JSON이고 10 KB를 넘으면 413입니다. 발화 묶음 올리기(`/utterances`)만 1 MB까지 받습니다.
    - 오류는 `{ "error": "이유" }`로 옵니다.
    - 기기 프로필 토큰이 있으면 `Authorization: Bearer <토큰>`으로 보냅니다. 기기 프로필 자체에는 로그인이 없습니다.
    - 구글 OAuth로 프로필을 찾아 이어 받을 수 있습니다(ADR-0006). 현대 계정 연동은 아직 없습니다(ADR-0004).
    - 여행은 만든 뒤 48시간까지 읽을 수 있습니다. 발화도 같은 시계에 지워지고, 사람이 장면으로 확정한 것만 프로필 앨범에 남습니다(ADR-0007·ADR-0014).
    - 음성 경로(발화·기록본)의 인증은 참가할 때 받는 **참가자 토큰**입니다(프로필 토큰과 별개).
    - 프로필 토큰은 기기마다 하나씩입니다 — 한 프로필을 차량과 폰에서 함께 쓸 수 있습니다(ADR-0009). 가족·동승자 그룹과 QR 초대도 있습니다.

    이 서버가 부르는 외부 API는 구글 OAuth(계정 연결을 켰을 때)뿐입니다. 예정과 결정 상태는 docs/api/external.md에 있습니다.
servers:
  - url: http://localhost:8787
    description: 로컬(make run)
security: []
tags:
  - name: 프로필
  - name: 여행
  - name: 참가자
  - name: 부탁
  - name: 장면
  - name: 기록본
  - name: 그룹
  - name: 상태 확인
paths:
  /healthz:
    get:
      tags: [상태 확인]
      summary: 서버와 DB가 살아 있는지
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema: { type: object, required: [ok], properties: { ok: { const: true } } }
  /api/profiles:
    post:
      tags: [프로필]
      summary: 기기 프로필 만들기
      description: 토큰은 이 응답에서 한 번만 줍니다. 서버에는 해시만 남으므로 잃어버리면 새로 만듭니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput", required: [name] }
      responses:
        "201":
          description: 만들어짐
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Profile"
                  - type: object
                    required: [token]
                    properties: { token: { type: string, description: 43자 base64url } }
        "400": { $ref: "#/components/responses/Error" }
  /api/profiles/me:
    get:
      tags: [프로필]
      summary: 내 프로필 읽기
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 내 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [프로필]
      summary: 내 프로필 고치기
      description: 적은 값만 바뀝니다. 선호는 자리 종류 안에서도 적은 항목만 바뀝니다.
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } }
      responses:
        "200": { description: 고친 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 내 프로필 지우기
      description: 지우면 모든 기기 토큰도 못 씁니다. 앨범, 내가 대표인 그룹, 내가 만든 계정 없는 구성원(아이)의 프로필도 함께 지웁니다. 이미 참가한 여행의 이름과 선호는 그 여행이 지워질 때까지 남습니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지워짐 }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/links/google:
    post:
      tags: [프로필]
      summary: 구글 계정 연결 또는 계정으로 찾아 들어가기
      description: |
        프로필 토큰과 함께 부르면 내 프로필에 구글 계정을 묶습니다(이름은 그대로). 이미 다른 프로필에 묶인 계정이면 409입니다.
        토큰 없이 부르면 그 계정의 프로필을 찾아 들어갑니다. 있으면 새 기기 토큰을 함께 돌려주고(이전 기기의 토큰은 못 쓰게 됨), 없으면 프로필을 새로 만듭니다.
        찾아 들어가기는 갱신 순간에 연결을 다시 확인합니다 — 요청 중 연결이 바뀌었으면 토큰을 주지 않고 401로 끝냅니다.
        코드는 서버가 구글과 바꾸므로 클라이언트 비밀 값은 클라이언트에 없습니다(ADR-0006).
        오류는 나눠 옵니다: 401 코드 거절 또는 연결 변경, 500 서버의 클라이언트 설정 오류, 502 제공자 응답 오류, 503 제공자 일시 장애·연결 실패, 504 제공자 응답 시간 초과.
      security: [{}, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirectUri]
              properties:
                code: { type: string, minLength: 1, maxLength: 500, description: 구글이 redirect 주소로 돌려준 인증 코드 }
                redirectUri: { type: string, minLength: 1, maxLength: 500, description: 코드를 받을 때 쓴 주소. 구글에 등록된 값과 같아야 함 }
      responses:
        "200": { description: 연결했거나 찾아 들어간 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileMaybeToken" } } } }
        "201": { description: 계정으로 새로 만든 프로필, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileMaybeToken" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 구글 계정 연결 끊기
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 끊음 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips:
    post:
      tags: [여행]
      summary: 여행 만들기
      description: "`groupId`를 주면 그룹 여행이 됩니다 — 대표만 만들 수 있고, 초대를 수락한 구성원은 수락 응답의 여행 코드로 자리만 골라 참가합니다(ADR-0009)."
      security: [{}, { profileToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 40 }
                groupId: { type: string, description: 그룹 여행으로 만들 때. 그룹의 대표여야 함 }
      responses:
        "201": { description: 만들어짐, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/trips/{code}:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [여행]
      summary: 여행 전체 상태
      description: 클라이언트는 받은 `version`을 `v`로 보내 바뀐 것이 없으면 304를 받습니다.
      parameters:
        - { name: v, in: query, schema: { type: integer }, description: 마지막으로 받은 version }
      responses:
        "200": { description: 여행, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }
        "304": { description: 바뀐 것 없음 }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [여행]
      summary: 여행 상태나 기록 여부 바꾸기
      description: |
        `status`를 `driving`으로 바꾸면 참가자 모두가 동의했을 때 기록을 켭니다. `parked`와 `ended`에서는 기록을 끕니다.
        `recording: true`는 주행 중이고 모두 동의했을 때만 됩니다(아니면 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: "#/components/schemas/TripStatus" }
                recording: { type: boolean }
      responses:
        "200": { description: 바뀐 여행, content: { application/json: { schema: { $ref: "#/components/schemas/Trip" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/participants:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [참가자]
      summary: 여행에 참가
      description: |
        프로필 토큰을 보내면 이름과 그 자리 종류의 선호를 프로필에서 가져옵니다. `consent`를 안 보내면 프로필의 기본값을 씁니다.
        같은 프로필이 다시 참가하면 있던 참가자를 200으로 돌려줍니다. 토큰이 없으면 손님으로 `name`과 `consent`가 필요합니다.
        대표는 `profileId`로 **내 그룹의 계정 없는 구성원(아이)** 을 참가시킬 수 있습니다(ADR-0009) — 아이의 동의 기본값은 꺼짐입니다.
        프로필·손님 모두 응답에 **참가자 토큰**을 함께 줍니다(ADR-0007). 발화 올리기·기록본 같은 음성 경로의 인증에 씁니다. 서버에는 해시만 남고, 다시 참가하면 새로 받습니다(옛 토큰은 못 쓰게 됨).
      security: [{}, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat]
              properties:
                seat: { $ref: "#/components/schemas/Seat" }
                name: { type: string, minLength: 1, maxLength: 20, description: 손님일 때 필요 }
                consent: { type: boolean, description: 손님일 때 필요 }
                prefs: { $ref: "#/components/schemas/Prefs" }
                profileId: { type: string, format: uuid, description: 내 그룹의 구성원 프로필(아이)로 참가시킬 때. 대표만 }
      responses:
        "200": { description: 이미 참가한 프로필(참가자 토큰 새로 발급), content: { application/json: { schema: { $ref: "#/components/schemas/ParticipantWithToken" } } } }
        "201": { description: 참가함, content: { application/json: { schema: { $ref: "#/components/schemas/ParticipantWithToken" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/participants/{id}:
    parameters: [{ $ref: "#/components/parameters/code" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [참가자]
      summary: 자리 옮기기, 선호와 동의 바꾸기
      description: 프로필로 참가한 사람이 자리를 옮기면 옮긴 자리의 선호를 프로필에서 다시 불러옵니다. 동의를 끄면 기록이 멈춥니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seat: { $ref: "#/components/schemas/Seat" }
                prefs: { $ref: "#/components/schemas/Prefs" }
                consent: { type: boolean }
      responses:
        "200": { description: 바뀐 참가자, content: { application/json: { schema: { $ref: "#/components/schemas/Participant" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/requests:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [부탁]
      summary: 부탁 남기기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [by, text]
              properties:
                by: { type: string, description: 이 여행의 참가자 id }
                text: { type: string, minLength: 1, maxLength: 200 }
                when: { $ref: "#/components/schemas/When" }
      responses:
        "201": { description: 남김, content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/requests/{id}:
    parameters: [{ $ref: "#/components/parameters/code" }, { $ref: "#/components/parameters/id" }]
    patch:
      tags: [부탁]
      summary: 부탁 상태 바꾸기
      description: |
        갈 수 있는 길만 됩니다(아니면 409).
        `held → proposed → accepted → reflected → done`. 끝나기 전에는 `cancelled`로 갈 수 있습니다.
        `proposed`와 `accepted`는 `held`로 되돌릴 수 있습니다. 차량 앱은 내비가 경유지를 받았다는 알림을 본 뒤에 `reflected`로 바꾸고, 실패하면 `held`로 되돌립니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { $ref: "#/components/schemas/RequestStatus" } } }
      responses:
        "200": { description: 바뀐 부탁, content: { application/json: { schema: { $ref: "#/components/schemas/Request" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/moments:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [장면]
      summary: 장면의 시각과 위치 남기기
      description: |
        차량 앱이 대화가 재미있던 순간을 표시할 때 부릅니다. `at`을 안 보내면 서버 시각을 씁니다.
        위치 없는 장면도 저장합니다(ADR-0007) — `lat`·`lng`는 둘 다 있거나 둘 다 없음만 받고, 위치 없는 장면은 목록에만 있고 지도에는 나오지 않습니다.
        장면을 고른 사람의 참가자 토큰과 함께 부르면, 그 참가자가 프로필을 가졌을 때 장면을 **확정**으로 보고 그 프로필의 앨범에 복사해 남깁니다(ADR-0014).
        고른 사람은 본문이 아니라 토큰으로 정합니다. 토큰 없이 부르면 여행에만 남습니다. 여행이 닫힌 뒤에도 남는 것은 이 앨범뿐입니다.
      security: [{}, { participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                label: { type: string, minLength: 1, maxLength: 60 }
                at: { type: integer, description: "epoch 밀리초. 여행을 만든 뒤부터 지금까지" }
      responses:
        "201": { description: 남김, content: { application/json: { schema: { $ref: "#/components/schemas/Moment" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/utterances:
    parameters: [{ $ref: "#/components/parameters/code" }]
    post:
      tags: [기록본]
      summary: 발화 묶음 올리기
      description: |
        차량 앱이 받아 적은 발화를 묶어 올립니다(ADR-0007·ADR-0014). 같은 `(device, seq)`는 다시 보내도 한 번만 남고(멱등), 순서는 섞여도 좋습니다.
        응답의 `lastSeq`는 빠짐없이 받은 마지막 순번입니다 — 차량은 재동기화 뒤 그 뒤만 다시 보냅니다.
        `lastSeq`는 발화 줄과 따로 적어 두어 뒤로 가지 않습니다(동의 철회·글 지우기로 줄이 지워져도).
        발화마다 만들 때의 동의 세대(`generation`, 없으면 본문의 `generation`)를 적습니다. 지금 세대보다 옛 세대의 발화는 저장하지 않되 받은 것으로 쳐서 `lastSeq`에 넣습니다(ADR-0007).
        그러니 차량은 동의가 바뀌어도 옛 세대 발화를 큐에서 지우지 말고 순서대로 그대로 올립니다 — 지우면 그 순번이 비어 `lastSeq`가 멈춥니다.
        기기 이름(`device`)은 처음 올린 참가자의 것입니다. 다른 참가자가 같은 이름으로 올리면 403입니다.
        여행 하나의 발화는 2만 줄까지입니다(넘으면 409).
        화자(`profileId`)는 받지 않습니다. 서버의 화자 대조(T38)가 붙입니다.
      security: [{ participantToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device, items]
              properties:
                device: { type: string, minLength: 1, maxLength: 40, description: 발화를 올리는 기기의 이름(차량 앱이 정함) }
                generation: { type: integer, minimum: 1, description: 발화마다 세대를 적지 않았을 때 모든 발화의 세대. 둘 다 없으면 400 }
                items:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/UtteranceInput" }
      responses:
        "200":
          description: 받음
          content:
            application/json:
              schema:
                type: object
                required: [lastSeq, generation]
                properties:
                  lastSeq: { type: integer, description: 이 기기의 발화 가운데 빠짐없이 받은 마지막 순번 }
                  generation: { type: integer, description: 지금 동의 세대 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [기록본]
      summary: 받은 발화 확인(동기화)
      description: 재연결한 차량이 무엇을 받았는지 확인할 때 부릅니다. `device`와 `after`를 주면 그 기기의 순번 이후만 돌려줍니다. 녹음에 동의한 참가자만 읽습니다(아니면 403).
      security: [{ participantToken: [] }]
      parameters:
        - { name: device, in: query, schema: { type: string } }
        - { name: after, in: query, schema: { type: integer }, description: 이 순번 뒤만. device가 있을 때만 봄 }
      responses:
        "200":
          description: 발화 목록과 지금 상태
          content:
            application/json:
              schema:
                type: object
                required: [generation, recording, items]
                properties:
                  generation: { type: integer, description: 지금 동의 세대 }
                  recording: { type: boolean, description: 지금 녹음 가능 여부 }
                  items: { type: array, items: { $ref: "#/components/schemas/Utterance" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [기록본]
      summary: 자기 발화 지우기
      description: |
        참가자 토큰의 주인이 프로필로 참가했을 때만, 그 프로필의 발화를 이 여행에서 지웁니다(손님은 403). 다른 사람의 발화는 남습니다.
        동의 세대는 오르지 않습니다. 지운 발화의 순번은 이미 `lastSeq` 안이라 차량이 다시 보내지 않습니다.
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 지운 줄 수
          content:
            application/json:
              schema: { type: object, required: [deleted], properties: { deleted: { type: integer } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/trips/{code}/transcript:
    parameters: [{ $ref: "#/components/parameters/code" }]
    get:
      tags: [기록본]
      summary: 기록본
      description: 이 여행의 발화를 시간순으로, 부탁과 도착 할 일과 함께 돌려줍니다. 도착 할 일 뽑기는 아직 구현 전이라 항상 빈 배열입니다. 녹음에 동의한 참가자만 읽습니다(아니면 403).
      security: [{ participantToken: [] }]
      responses:
        "200":
          description: 기록본
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transcript" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/profiles/me/feed:
    get:
      tags: [프로필]
      summary: 내 피드
      description: |
        한 프로필의 발화와 장면을 여행을 가로질러 최신순으로 돌려줍니다.
        발화는 여행이 살아 있는 동안(만든 뒤 48시간)만 나오고, 장면은 앨범에 복사된 것이라 여행이 닫힌 뒤에도 나옵니다(ADR-0014).
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 피드 항목(최대 100)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FeedItem" } }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/moments/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    delete:
      tags: [프로필]
      summary: 앨범에서 장면 지우기
      description: 내 앨범에 복사된 장면만 지웁니다. 여행의 moments에는 영향이 없습니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/profiles/me/tokens:
    post:
      tags: [프로필]
      summary: 이 기기 토큰 만들기
      description: 한 프로필을 차량과 폰에서 함께 쓰게 기기마다 토큰을 둡니다(ADR-0009). 다른 기기의 토큰은 그대로입니다.
      security: [{ profileToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device: { type: string, minLength: 1, maxLength: 20, description: 기기 이름(차량, 폰…). 표시용 }
      responses:
        "201":
          description: 만들어짐
          content:
            application/json:
              schema: { type: object, required: [token, device], properties: { token: { type: string, description: 43자 base64url }, device: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/profiles/me/photo:
    put:
      tags: [프로필]
      summary: 프로필 사진 올리기
      description: "이진 본문(PNG 또는 JPEG, 최대 1 MB). 서버는 매직 바이트로 형식만 확인하고 받은 그대로 둡니다(다시 그리기는 화면 T46에서). 지금은 본인만 받아 가고, 응답에 `x-content-type-options: nosniff`를 붙입니다."
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
      responses:
        "204": { description: 올림 }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
    get:
      tags: [프로필]
      summary: 내 프로필 사진 보기
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 사진 바이트(올릴 때 확인한 형식 그대로) }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [프로필]
      summary: 프로필 사진 지우기
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
  /api/groups:
    post:
      tags: [그룹]
      summary: 그룹 만들기
      description: 가족·동승자 그룹을 만듭니다. 만든 사람이 대표입니다(ADR-0009).
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [family, crew], default: family }
                name: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "201": { description: 만들어짐, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /api/groups/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      tags: [그룹]
      summary: 그룹 보기
      description: 구성원 목록과 대표를 돌려줍니다. 구성원만 볼 수 있습니다.
      security: [{ profileToken: [] }]
      responses:
        "200": { description: 그룹, content: { application/json: { schema: { $ref: "#/components/schemas/Group" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [그룹]
      summary: 그룹 지우기
      description: 대표만 지울 수 있습니다. 계정 있는 구성원이 이미 남긴 기록본과 앨범은 프로필 소유라 그대로 남고, 대표가 만든 계정 없는 구성원(아이)의 프로필은 함께 지웁니다(ADR-0009).
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 지움 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/members:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [그룹]
      summary: 계정 없는 구성원 만들기
      description: 대표가 아이처럼 계정이 없는 구성원의 프로필을 만듭니다. 토큰은 없습니다 — 대표의 기기가 여행에 참가시킵니다(ADR-0009).
      security: [{ profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                character: { type: string, minLength: 1, maxLength: 20, description: 캐릭터 값. 목록은 화면 문서(T46)에서 정한다 }
      responses:
        "201": { description: 만들어짐, content: { application/json: { schema: { $ref: "#/components/schemas/Member" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/members/{profileId}:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: profileId, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      tags: [그룹]
      summary: 구성원 내보내기·나가기
      description: 대표는 누구나 내보낼 수 있고, 구성원은 자신만 나갈 수 있습니다. 대표는 그룹을 지워야 나갈 수 있습니다(409). 계정 있는 구성원의 기록본은 그대로이고, 대표가 만든 계정 없는 구성원(아이)은 내보내면 프로필째 지웁니다.
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 나감 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/invites:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      tags: [그룹]
      summary: 초대 만들기
      description: QR에 담을 초대 주소를 돌려줍니다(ADR-0009). 만료 시각과 횟수 제한이 있습니다. 대표만 만들 수 있습니다.
      security: [{ profileToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expiresInMinutes: { type: integer, minimum: 1, maximum: 1440, default: 60 }
                maxUses: { type: integer, minimum: 0, maximum: 100, default: 5, description: 0은 제한 없음 }
      responses:
        "201":
          description: 만들어짐
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      tags: [그룹]
      summary: 초대 목록
      security: [{ profileToken: [] }]
      responses:
        "200":
          description: 목록(대표만)
          content:
            application/json:
              schema: { type: object, required: [invites], properties: { invites: { type: array, items: { $ref: "#/components/schemas/Invite" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/groups/{id}/invites/{code}:
    parameters: [{ $ref: "#/components/parameters/id" }, { name: code, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [그룹]
      summary: 초대 취소
      security: [{ profileToken: [] }]
      responses:
        "204": { description: 취소함 }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/j/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string }, description: 초대 주소(/j/<코드>)의 코드 }]
    post:
      tags: [그룹]
      summary: 초대 수락
      description: |
        QR 주소로 들어온 폰 브라우저가 부릅니다(ADR-0009).
        프로필 토큰이 있으면 있던 프로필로, 없으면 새 프로필(이름 필수)과 이 기기 토큰을 만들어 구성원이 됩니다.
        그룹의 진행 중인 여행이 있으면 응답에 그 여행 코드를 줍니다. 자리는 본인이 골라 `POST /api/trips/{code}/participants`로 참가합니다(동의·기록 규칙이 그 경로에 있음).
        입력이 틀리거나(400) 토큰이 틀리면(401) 횟수를 쓰지 않습니다.
        취소·만료·횟수 소진은 409, 없는 코드는 404입니다.
      security: [{}, { profileToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 20, description: 새 프로필을 만들 때 필요 }
                character: { type: string, maxLength: 20 }
                device: { type: string, maxLength: 20 }
                prefs: { $ref: "#/components/schemas/Prefs" }
      responses:
        "200":
          description: 구성원이 됨
          content:
            application/json:
              schema:
                type: object
                required: [group, profile]
                properties:
                  group: { $ref: "#/components/schemas/Group" }
                  profile: { $ref: "#/components/schemas/Profile" }
                  token: { type: string, description: 새 프로필을 만들었을 때만. 이 기기가 쓸 토큰 }
                  trip:
                    type: object
                    description: 그룹의 진행 중인 여행이 있을 때만. 자리를 골라 참가할 여행
                    required: [code]
                    properties:
                      code: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    profileToken:
      type: http
      scheme: bearer
      description: POST /api/profiles가 돌려준 토큰
    participantToken:
      type: http
      scheme: bearer
      description: 여행 참가(POST /api/trips/{code}/participants) 응답이 돌려준 참가자 토큰. 음성 경로(발화·기록본)의 인증에 씀(ADR-0007)
  parameters:
    code: { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z2-9]{6}$" }, description: 여행 코드. 대소문자를 가리지 않음 }
    id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: 거절한 이유
      content:
        application/json:
          schema: { type: object, required: [error], properties: { error: { type: string } } }
  schemas:
    Seat:
      type: string
      enum: [ROW_1_LEFT, ROW_1_RIGHT, ROW_2_LEFT, ROW_2_CENTER, ROW_2_RIGHT]
      description: Pleos Vehicle SDK의 SeatArea 이름. ROW_1_LEFT가 운전석
    TripStatus: { type: string, enum: [boarding, driving, parked, ended] }
    When: { type: string, enum: [now, return, before_arrival, after_parking], default: now }
    RequestStatus: { type: string, enum: [held, proposed, accepted, reflected, done, cancelled] }
    Prefs:
      type: object
      description: 차량 앱이 그 차의 지원 범위에 맞춰 적용합니다
      properties:
        tempC: { type: number, minimum: 16, maximum: 30, default: 22 }
        heat: { type: integer, minimum: 0, maximum: 3, default: 0, description: 시트 열선 단계 }
        vent: { type: integer, minimum: 0, maximum: 3, default: 0, description: 시트 통풍 단계 }
    ProfileInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        prefs:
          type: object
          description: 자리 종류별 선호
          properties:
            driver: { $ref: "#/components/schemas/Prefs" }
            passenger: { $ref: "#/components/schemas/Prefs" }
            rear: { $ref: "#/components/schemas/Prefs" }
        consentDefault: { type: boolean, default: false, description: 참가할 때 기록 동의의 기본값 }
        character: { type: string, maxLength: 20, description: 캐릭터 값. 목록은 화면 문서(T46)에서 정한다 }
        device: { type: string, maxLength: 20, description: 이 기기 토큰의 이름(표시용) }
    Profile:
      allOf:
        - $ref: "#/components/schemas/ProfileInput"
        - type: object
          required: [id, name, prefs, consentDefault, character, hasPhoto, links]
          properties:
            id: { type: string, format: uuid }
            character: { type: string }
            hasPhoto: { type: boolean }
            links: { type: array, items: { type: string, enum: [google] }, description: 연결된 OAuth 제공자 }
    ProfileMaybeToken:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          properties: { token: { type: string, description: 토큰 없이 찾아 들어갔거나 새로 만들었을 때만. 이 기기가 쓸 43자 토큰 } }
    Participant:
      type: object
      required: [id, name, seat, prefs, consent]
      properties:
        id: { type: string }
        name: { type: string }
        seat: { $ref: "#/components/schemas/Seat" }
        prefs: { $ref: "#/components/schemas/Prefs" }
        consent: { type: boolean }
        profileId: { type: string, format: uuid, description: 프로필로 참가했을 때만 }
    ParticipantWithToken:
      allOf:
        - $ref: "#/components/schemas/Participant"
        - type: object
          required: [token]
          properties: { token: { type: string, description: 참가자 토큰. 43자 base64url. 다시 참가하면 새로 받음 } }
    Request:
      type: object
      required: [id, by, text, when, status, createdAt]
      properties:
        id: { type: string }
        by: { type: string }
        text: { type: string }
        when: { $ref: "#/components/schemas/When" }
        status: { $ref: "#/components/schemas/RequestStatus" }
        createdAt: { type: integer }
    Moment:
      type: object
      required: [id, at, label]
      properties:
        id: { type: string }
        at: { type: integer }
        lat: { type: number, description: 위치 없는 장면은 아예 없음(ADR-0007) }
        lng: { type: number }
        label: { type: string }
    UtteranceInput:
      type: object
      required: [seq, at, text]
      properties:
        seq: { type: integer, minimum: 1, maximum: 1000000000, description: 기기가 매기는 순번 }
        at: { type: integer, description: epoch 밀리초 }
        text: { type: string, minLength: 1, maxLength: 500 }
        seatArea: { anyOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }], description: 좌석 구역(T37). 모르면 null이나 생략 }
        generation: { type: integer, minimum: 1, description: 발화를 만들 때의 동의 세대(올릴 때만). 없으면 본문의 generation }
        confidence: { type: number, minimum: 0, maximum: 1, description: 받아쓰기 확신도. 제공자가 주면 }
        lat: { type: number, minimum: -90, maximum: 90, description: 좌표는 둘 다 있거나 둘 다 없음 }
        lng: { type: number, minimum: -180, maximum: 180 }
    Utterance:
      allOf:
        - $ref: "#/components/schemas/UtteranceInput"
        - type: object
          required: [device]
          properties:
            device: { type: string }
            profileId: { type: string, format: uuid, description: 서버의 화자 대조(T38)가 붙인 프로필. 아직 없으면 생략 }
    Transcript:
      type: object
      required: [generation, utterances, requests, todos]
      properties:
        generation: { type: integer }
        utterances: { type: array, items: { $ref: "#/components/schemas/Utterance" } }
        requests: { type: array, items: { $ref: "#/components/schemas/Request" } }
        todos: { type: array, items: { type: object }, description: 도착 할 일. 뽑기(LLM) 구현 전까지 빈 배열 }
    FeedItem:
      type: object
      required: [kind, tripCode, at]
      properties:
        kind: { type: string, enum: [utterance, moment] }
        tripCode: { type: string }
        at: { type: integer }
        text: { type: string, description: kind가 utterance일 때 }
        seatArea: { anyOf: [{ $ref: "#/components/schemas/Seat" }, { type: "null" }] }
        id: { type: string, description: kind가 moment일 때 }
        label: { type: string }
        lat: { type: number }
        lng: { type: number }
    Member:
      type: object
      required: [profileId, name, character]
      properties:
        profileId: { type: string, format: uuid }
        name: { type: string }
        character: { type: string }
        hasPhoto: { type: boolean }
        isOwner: { type: boolean, description: 그룹의 대표 여부 }
    Group:
      type: object
      required: [id, kind, ownerId, members]
      properties:
        id: { type: string }
        kind: { type: string, enum: [family, crew] }
        name: { type: string }
        ownerId: { type: string, format: uuid }
        members: { type: array, items: { $ref: "#/components/schemas/Member" } }
    Invite:
      type: object
      required: [code, url]
      properties:
        code: { type: string }
        url: { type: string, description: "QR에 담을 주소(https://gachita.mangowhois.ai/j/<코드>)" }
        maxUses: { type: integer, description: 0은 제한 없음 }
        uses: { type: integer }
        expiresAt: { type: integer, description: epoch 밀리초 }
        cancelled: { type: boolean }
    Trip:
      type: object
      required: [code, title, status, recording, participants, requests, moments, version, createdAt]
      properties:
        code: { type: string }
        title: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        recording: { type: boolean }
        generation: { type: integer, description: 동의 세대(ADR-0007). 동의 철회로 올라감 }
        participants: { type: array, items: { $ref: "#/components/schemas/Participant" } }
        requests: { type: array, items: { $ref: "#/components/schemas/Request" } }
        moments: { type: array, items: { $ref: "#/components/schemas/Moment" } }
        version: { type: integer, description: 바뀔 때마다 1씩 늘어남 }
        createdAt: { type: integer }
