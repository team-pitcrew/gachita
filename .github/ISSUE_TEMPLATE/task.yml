name: 작업
description: T번호가 붙는 작업 하나. docs/tasks.md의 항목과 짝을 맞춥니다.
title: "[T번호] "
body:
  - type: textarea
    id: why
    attributes:
      label: 왜 하는가
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크 상자로 적습니다. 끝낸 항목은 PR이 develop에 병합되고 확인한 뒤에 체크합니다.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
    validations:
      required: true
  - type: input
    id: after
    attributes:
      label: 선행 작업
      description: 먼저 끝나야 하는 T번호. 없으면 비웁니다.
