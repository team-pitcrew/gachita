name: 작업 티켓
description: 할 일 하나. 번호([T숫자])와 라벨, 담당은 자동으로 붙습니다.
title: "[T] "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        제목의 `[T] ` 뒤에 무엇을 하는지 한 줄로 적어 주세요. 번호는 저장하면 자동으로 붙습니다.
        브랜치(`feature/T번호-설명`)를 만들면 '작업 중', PR을 열면 '리뷰 중', 병합되면 '완료'로 자동으로 옮겨집니다.
        티켓 하나는 PR 하나로 끝나는 크기가 좋습니다. 며칠이 걸릴 일이면 나눠서 적습니다.
  - type: dropdown
    id: part
    attributes:
      label: 파트
      description: 파트에 따라 담당자와 CI 검사가 정해집니다.
      options:
        - 프론트 · 피그마 전 단계
        - 프론트 · 피그마 이후 단계
        - 백엔드 · 비즈니스 로직
        - 백엔드 · 인프라
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 · 제출에 꼭 필요
        - P1 · 제출 점수에 도움
        - P2 · 2차 발표 전까지
      default: 1
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 필요한 환경
      description: Pleos 에뮬레이터에서 확인해야 끝나는 일이면 고릅니다. 그런 티켓은 파트와 관계없이 에뮬레이터 담당에게 갑니다.
      options:
        - 없음 · 로컬과 문서로 끝남
        - 에뮬레이터 · Pleos 에뮬레이터에서 확인
      default: 0
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 하는가
      description: 지금 무엇이 안 되거나 정해지지 않았는지, 하지 않으면 누가 무엇을 못 하는지 적습니다. 근거가 되는 문서나 이슈를 링크합니다.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크 상자로 적습니다. 한 줄이 확인할 수 있는 결과 하나가 되게 씁니다. 끝낸 항목은 PR이 병합되고 확인한 뒤에 체크합니다.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 하지 않는 것
      description: 이 티켓에서 일부러 빼는 것. 같이 하고 싶어지는 일을 적어 두면 범위가 늘지 않습니다. 다음 티켓이 있으면 번호를 적습니다.
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇을 어떻게 보면 끝났다고 할 수 있는지 적습니다. 돌릴 명령이나 볼 화면을 적고, 어디서 본 것으로 인정할지(로컬, 에뮬레이터, 실차)를 정합니다.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 위험과 되돌리기
      description: 잘못되면 무엇이 깨지고 누가 영향을 받는지, 어떻게 되돌리는지 적습니다. 데이터, 비용, 다른 파트에 닿는 것이 있으면 꼭 적습니다. 없으면 비웁니다.
  - type: input
    id: after
    attributes:
      label: 선행 작업
      description: 먼저 끝나야 하는 티켓 번호(예 T2, T7). 없으면 비웁니다.
