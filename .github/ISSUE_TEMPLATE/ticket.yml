name: 작업 티켓
description: 할 일 하나. 번호([T숫자])와 라벨, 담당은 자동으로 붙습니다.
title: "[T] "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        제목의 `[T] ` 뒤에 무엇을 하는지 한 줄로 적어 주세요. 번호는 저장하면 자동으로 붙습니다.
        브랜치(`feature/T번호-설명`)를 만들면 '작업 중', PR을 열면 '리뷰 중', 병합되면 '완료'로 자동으로 옮겨집니다.
        티켓 하나는 PR 하나로 끝나는 크기가 좋습니다. 며칠이 걸릴 일이면 나눠서 적습니다.

        칸 순서는 구글의 설계 문서(배경 → 목표와 비목표 → 설계 → 대안 → 보안·관측 같은 교차 관심사)와 SRE 출시 점검표(용량, 장애와 의존성, 관측, 보안, 출시와 되돌리기)를 따릅니다.
        **설계부터 보안과 개인정보까지 일곱 칸은 선택입니다.** 문서 고치기 같은 작은 일은 비워 둡니다. 서버, 데이터, 모델, 외부 서비스에 닿는 일은 채웁니다.
  - type: dropdown
    id: part
    attributes:
      label: 파트
      description: 파트에 따라 담당자와 CI 검사가 정해집니다.
      options:
        - 프론트 · 피그마 전 단계
        - 프론트 · 피그마 이후 단계
        - 백엔드 · 비즈니스 로직
        - 백엔드 · 인프라
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 · 제출에 꼭 필요
        - P1 · 제출 점수에 도움
        - P2 · 2차 발표 전까지
      default: 1
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: 필요한 환경
      description: Pleos 에뮬레이터에서 확인해야 끝나는 일이면 고릅니다. 그런 티켓은 파트와 관계없이 에뮬레이터 담당에게 갑니다.
      options:
        - 없음 · 로컬과 문서로 끝남
        - 에뮬레이터 · Pleos 에뮬레이터에서 확인
      default: 0
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 왜 하는가
      description: 배경과 범위. 지금 무엇이 안 되거나 정해지지 않았는지, 하지 않으면 누가 무엇을 못 하는지 적습니다. 잰 값이 있으면 숫자로 적고, 근거가 되는 문서나 이슈를 링크합니다.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크 상자로 적습니다. 한 줄이 확인할 수 있는 결과 하나가 되게 씁니다. 끝낸 항목은 PR이 병합되고 확인한 뒤에 체크합니다.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: 하지 않는 것
      description: 이 티켓에서 일부러 빼는 것. 같이 하고 싶어지는 일을 적어 두면 범위가 늘지 않습니다. 다음 티켓이 있으면 번호를 적습니다.
  - type: textarea
    id: design
    attributes:
      label: 설계
      description: (선택) 입력과 출력, 어디서 도는지(차량, 서버, 배치), 주고받는 API와 저장하는 데이터의 모양, 핵심 판단 규칙. 그림이나 의사 코드는 새로운 부분에만 씁니다.
  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
      description: (선택) 다른 방법과 그것을 고르지 않은 이유. 비용, 위험, 일정으로 비교합니다.
  - type: textarea
    id: slo
    attributes:
      label: 서비스 수준
      description: (선택) 무엇을 재고(지표), 목표가 얼마이며, 어디서 어떻게 재는지. 지금 값과 그 숫자를 고른 근거, 세지 않는 예외를 적습니다. 예) 이름·호칭 정확도 39% → 60% 이상, 원래 맞던 문장을 바꾸는 비율 2% 이하.
  - type: textarea
    id: capacity
    attributes:
      label: 용량과 비용
      description: (선택) 요청 수, 데이터 크기, CPU·메모리·저장소, 한 달 비용. 사용자가 열 배로 늘면 어디가 먼저 막히는지.
  - type: textarea
    id: dependencies
    attributes:
      label: 의존성과 장애 동작
      description: (선택) 기대는 것(SDK, 외부 API, 다른 서비스, 모델 파일)과 그것이 느리거나 죽었을 때의 동작(제한 시간, 재시도, 꺼 두고 계속하기).
  - type: textarea
    id: observability
    attributes:
      label: 관측
      description: (선택) 잘 도는지 무엇으로 아는지. 남길 로그와 지표, 알림 조건, 볼 화면이나 명령.
  - type: textarea
    id: security
    attributes:
      label: 보안과 개인정보
      description: (선택) 다루는 데이터(음성, 대화, 위치, 프로필), 동의와 기본값, 보관 기간과 지우는 방법, 차 밖이나 다른 회사로 나가는 것, 권한과 비밀 값.
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      description: 무엇을 어떻게 보면 끝났다고 할 수 있는지 적습니다(검증 계획). 돌릴 명령이나 볼 화면을 적고, 어디서 본 것으로 인정할지(로컬, 에뮬레이터, 실차)를 정합니다.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 위험과 되돌리기
      description: 잘못되면 무엇이 깨지고 누가 영향을 받는지, 어떤 순서로 내보내고 어떻게 되돌리는지 적습니다. 데이터, 비용, 다른 파트에 닿는 것이 있으면 꼭 적습니다. 없으면 비웁니다.
  - type: input
    id: after
    attributes:
      label: 선행 작업
      description: 먼저 끝나야 하는 티켓 번호(예 T2, T7). 없으면 비웁니다.
