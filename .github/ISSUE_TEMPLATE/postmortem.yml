name: 사후 검토
description: 장애나 큰 실수 뒤에 쓰는 기록. 사람을 탓하지 않고 원인과 고칠 것을 적습니다.
title: "[사후 검토] "
labels: ["type:postmortem"]
body:
  - type: markdown
    attributes:
      value: |
        Google SRE의 비난 없는 사후 검토 형식을 따릅니다. 누가 잘못했는지가 아니라, 무엇이 그 일을 가능하게 했는지를 적습니다.
        이름 대신 역할로 적습니다(예: 배포한 사람). 후속 조치는 각각 작업 티켓으로 만듭니다.

        **언제 쓰나:** 시연이나 제출이 막혔을 때, 데이터를 잃었을 때, 사람이 손으로 되돌려야 했을 때, 알아채는 데 오래 걸렸을 때.
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 무슨 일이 있었고 지금은 어떤 상태인지 두세 문장으로 적습니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향
      description: 누가, 무엇을, 얼마나 오래 못 했는지 숫자로 적습니다. 잃은 데이터와 든 비용이 있으면 적습니다.
    validations:
      required: true
  - type: textarea
    id: root-cause
    attributes:
      label: 근본 원인
      description: 그 일이 일어날 수 있게 둔 조건(검사 없음, 문서 없음, 한 사람만 아는 절차 등). '왜'를 몇 번 더 물어 사람의 실수에서 멈추지 않게 적습니다.
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: 계기
      description: 그 조건을 실제 사고로 바꾼 사건(어떤 변경, 어떤 입력, 어떤 명령).
    validations:
      required: true
  - type: textarea
    id: detection
    attributes:
      label: 감지
      description: 어떻게 알았는지와 일이 생긴 뒤 알기까지 걸린 시간. 검사나 알림이 먼저 잡았어야 했는지.
    validations:
      required: true
  - type: textarea
    id: resolution
    attributes:
      label: 해결
      description: 피해를 멈춘 조치와 완전히 고친 조치를 나눠 적습니다.
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: 시간순 기록
      description: 시각(KST)과 일어난 일. 시작, 알아챈 때, 조치한 때, 끝난 때를 넣습니다.
      value: "- HH:MM "
    validations:
      required: true
  - type: textarea
    id: went-well
    attributes:
      label: 잘된 것
  - type: textarea
    id: went-wrong
    attributes:
      label: 잘못된 것
  - type: textarea
    id: lucky
    attributes:
      label: 운이 좋았던 것
      description: 이번에는 넘어갔지만 다음에는 문제가 될 수 있는 것.
  - type: textarea
    id: actions
    attributes:
      label: 후속 조치
      description: 체크 상자로 적고 종류(예방, 감지, 완화, 복구), 맡을 사람, 티켓 번호를 붙입니다. 종류마다 하나씩은 있는지 봅니다.
      value: "- [ ] (예방) "
    validations:
      required: true
