name: deploy-tag

# 새 이미지 내보내기와 되돌리기(T56). 클러스터는 dev 오버레이의 newTag를 따라가므로(GitOps), 이 워크플로는
# 그 태그를 바꾸는 PR을 연다. 병합은 사람이 한다. 병합되면 Argo CD가 바꾸고, 그 뒤 실제 주소 E2E(live-e2e)를 부른다.
#   - 병합 뒤 자동: ci가 develop에서 성공하면 그 커밋의 이미지(SHA 앞 12자)가 GHCR에 있을 때만 PR을 연다.
#     이미지에 들어가는 파일이 안 바뀐 병합은 이미지가 없어 건너뛴다.
#   - 되돌리기·지정: Actions → deploy-tag → Run workflow에 태그를 넣는다(없는 태그면 실패).
# 봇 PR은 브랜치 bot/deploy-tag 하나를 다시 쓰고 제목은 [sync]. 기본 토큰으로 연 PR에는 검사가 저절로 돌지 않아
# 같은 브랜치에 ci를 수동 실행으로 돌린다(그 커밋의 검사가 PR에 보인다).
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      tag:
        description: 내보낼 이미지 태그(커밋 SHA 앞 12자). 되돌릴 때는 이전 태그
        type: string
        required: true
  push:
    branches: [develop]
    paths: [backend/infra/gitops/apps/api/overlays/dev/kustomization.yaml]

# 쓰기 권한은 PR을 여는 잡에만 준다(아래 open-pr). 기다리기와 E2E는 읽기만
permissions:
  contents: read

# PR 열기(병합 뒤·되돌리기)와 병합 뒤 E2E(push)를 따로 줄 세운다. 한 줄이면 5분 기다리는 E2E 뒤에 서 있던
# 되돌리기가 새 ci 완료에 밀려 취소될 수 있다(GitHub는 대기 중인 앞 실행을 취소함)
concurrency:
  group: deploy-tag-${{ github.event_name == 'push' && 'e2e' || 'pr' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/team-pitcrew/gachita-api
  OVERLAY: backend/infra/gitops/apps/api/overlays/dev/kustomization.yaml
  BRANCH: bot/deploy-tag

jobs:
  open-pr:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: write
      pull-requests: write
      actions: write
      packages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: 태그 정하기
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then tag=$INPUT_TAG; why="지정(되돌리기 포함)"; else tag=${RUN_SHA::12}; why="develop 병합 ${RUN_SHA::12}"; fi
          printf '%s' "$tag" | grep -Eq '^[0-9a-f]{12}$' || { echo "::error::태그는 커밋 SHA 앞 12자(소문자 16진수)입니다: $tag"; exit 1; }
          current=$(sed -n 's/^[[:space:]]*newTag:[[:space:]]*\([^[:space:]#]*\).*/\1/p' "$OVERLAY")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "why=$why" >> "$GITHUB_OUTPUT"; echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "지금 $current → 바꿀 $tag ($why)"
      - name: 이미지가 GHCR에 있는지
        id: exists
        env:
          TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          if docker manifest inspect "$IMAGE:$TAG" > /dev/null 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "::error::$IMAGE:$TAG 이 GHCR에 없습니다"; exit 1; fi
          echo "이 병합은 이미지를 올리지 않았습니다($TAG). 건너뜁니다." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 태그 바꾸는 PR 열기
        if: steps.exists.outputs.ok == 'true' && steps.tag.outputs.tag != steps.tag.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          CURRENT: ${{ steps.tag.outputs.current }}
          WHY: ${{ steps.tag.outputs.why }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH" origin/develop
          make deploy-tag TAG="$TAG" OVERLAY="$OVERLAY"
          title="[sync] dev 이미지를 $TAG로 바꾼다"
          git commit -qam "$title" -m "$WHY. 이전 태그 $CURRENT. 되돌리기는 deploy-tag를 $CURRENT로 손 실행."
          git push -qf origin "$BRANCH"
          body=$(printf '%s\n' "dev 클러스터가 받을 API 이미지를 \`$CURRENT\` → \`$TAG\`로 바꿉니다($WHY)." "" \
            "- 이미지: \`$IMAGE:$TAG\` (GHCR에 있음을 확인)" \
            "- 병합하면 Argo CD가 하나씩 바꾸고(새 파드가 두 DB에 닿아 준비된 뒤 옛 파드를 내림), 그 뒤 live-e2e가 실제 주소에 대고 돕니다." \
            "- 되돌리기: Actions → deploy-tag → Run workflow, 태그 \`$CURRENT\`." "" \
            "검사는 이 브랜치에 ci를 수동 실행으로 돌린 결과입니다(기본 토큰으로 연 PR에는 검사가 저절로 돌지 않음).")
          gh workflow run ci.yml --ref "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$title" --body "$body"
          elif ! gh pr create --base develop --head "$BRANCH" --title "$title" --body "$body"; then
            # 저장소 설정 'Allow GitHub Actions to create and approve pull requests'가 꺼져 있으면 여기로 온다
            echo "::warning::PR을 만들 권한이 없어 브랜치만 올렸습니다. 아래 주소에서 PR을 엽니다"
            echo "PR을 만들 권한이 없어 브랜치만 올림: https://github.com/$GITHUB_REPOSITORY/compare/develop...$BRANCH?expand=1 (제목: $title). 저장소 설정 → Actions → General → 'Allow GitHub Actions to create and approve pull requests'를 켜면 다음부터 자동으로 엽니다." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "PR: $(gh pr view "$BRANCH" --json url -q .url) (ci를 $BRANCH 에서 돌림)" >> "$GITHUB_STEP_SUMMARY"
      - name: 최근 태그(되돌릴 때 고르기)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### 최근 이미지 태그"
            git log origin/develop --format='- `%h` %s' --abbrev=12 -n 10 -- backend/api frontend/web .dockerignore
          } >> "$GITHUB_STEP_SUMMARY"

  # 오버레이의 태그가 develop에 들어오면(위 PR 병합) Argo CD가 반영할 시간을 준 뒤 실제 주소에 E2E.
  # ponytail: API가 판을 알려 주지 않아 '새 이미지로 바뀐 것'은 확인하지 못하고 시간만 기다린다. /healthz에 판을 싣게 되면 그것을 기다린다.
  wait-rollout:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Argo CD가 반영할 시간(자동 동기화 주기 약 3분 + 순차 교체)
        run: sleep 300
  live-e2e:
    needs: wait-rollout
    if: github.event_name == 'push'
    uses: ./.github/workflows/live-e2e.yml
