name: infra-e2e

# 인프라가 바뀐 PR에서 도는 검사 둘(T55). 필수 검사(ci.yml의 일곱 개)가 아니고, ci.yml의 backend-infra가 보지 않는 것만 본다.
#   static: 조립과 스키마(apps/db, apps/db/recover, apps/edge, cluster/argocd), Terraform account/·persist/ 정합성, Ansible 구문
#   waves:  Docker 위 K3s에 Argo CD를 올려 뿌리 앱부터 물결 순서로, 쿠버네티스 DNS 이름으로 /healthz까지(로컬과 같은 스크립트)
# 계정에 접속하지 않는다(AWS·Cloudflare 자격 없음). 받는 것(이미지·차트)이 실패하면 거짓 실패가 날 수 있다.
on:
  pull_request:
    paths:
      - backend/infra/**
      - .github/workflows/infra-e2e.yml

permissions:
  contents: read

concurrency:
  group: infra-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      # bootstrap, platform, apps/api/overlays/dev는 ci.yml이 본다. 같은 명령으로 나머지 넷을 본다.
      # Argo CD 원본의 CRD 셋은 건너뛴다: 스키마 모음에 CRD 자체의 스키마가 없다(재귀 정의라 standalone으로 못 만듦).
      - name: 조립과 스키마 (ci.yml이 보지 않는 폴더)
        run: |
          catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in backend/infra/gitops/apps/db backend/infra/gitops/apps/db/recover backend/infra/gitops/apps/edge backend/infra/cluster/argocd; do
            echo "== $dir"
            kubectl kustomize "$dir" > "$RUNNER_TEMP/manifests.yaml"
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -skip CustomResourceDefinition \
              -schema-location default -schema-location "$catalog" - < "$RUNNER_TEMP/manifests.yaml"
          done
      - name: Terraform 정합성 (account/, persist/. 계정에 접속하지 않음)
        run: |
          for dir in account persist; do
            terraform -chdir="backend/infra/terraform/$dir" init -backend=false -input=false
            terraform -chdir="backend/infra/terraform/$dir" validate
          done
      # 서버의 첫 부팅(user_data)과 같은 Ubuntu 24.04 꾸러미 ansible-core
      - name: Ansible 구문 (site.yml)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ansible-core
          /usr/bin/ansible-playbook -i localhost, --syntax-check backend/infra/cluster/site.yml

  waves:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # docker, kubectl, jq, yq, git은 실행기에 있다. ansible-core는 뿌리 앱 템플릿을 그린다(구축 6단계와 같은 모듈)
      - name: ansible-core
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ansible-core
      - name: 물결 E2E
        run: E2E_OUT="$RUNNER_TEMP/e2e" backend/infra/cluster/e2e-local.sh
      - name: 요약
        if: always()
        run: cat "$RUNNER_TEMP/e2e/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "### 물결 E2E: 요약 없이 멈춤" >> "$GITHUB_STEP_SUMMARY"
