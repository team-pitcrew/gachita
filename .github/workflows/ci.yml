name: ci

# 병합 전에 꼭 통과해야 하는 검사다. 검사를 건너뛰는 조건을 두지 않는다.
# 무료 조직의 비공개 저장소라 GitHub 브랜치 보호를 걸 수 없다. PR 화면의 이 결과를 보고 병합한다.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR 제목 · 브랜치 이름 · 대상 브랜치
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          scripts/policy.sh title "$TITLE"
          scripts/policy.sh branch "$BRANCH"
          scripts/policy.sh target "$BRANCH" "$BASE"
      - name: 커밋 제목
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%s "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/titles.txt"
          while IFS= read -r title; do scripts/policy.sh title "$title"; done < "$RUNNER_TEMP/titles.txt"
      - name: 비밀 값 검사 (전체 이력)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --config /repo/.gitleaks.toml

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: make check-fast

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gachita
          POSTGRES_PASSWORD: gachita
          POSTGRES_DB: gachita
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gachita"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 이 검사에서만 쓰는 일회용 DB의 주소다
      DATABASE_URL: postgres://gachita:gachita@localhost:5432/gachita
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: make api
