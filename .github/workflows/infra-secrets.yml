name: infra-secrets

# 사람이 `gh secret set`으로 넣은 저장소 비밀 값을 AWS SSM으로 옮긴다(ADR-0012의 '비밀 값이 가는 길').
#   GitHub 비밀 값 → 이 워크플로(적용 역할, OIDC. AWS 열쇠 없음) → SSM SecureString → External Secrets → 클러스터의 Secret
# develop에서 수동으로만 돈다(Actions → infra-secrets → Run workflow). 값은 로그와 명령줄에 남기지 않는다.
# 비어 있는 비밀 값은 건너뛴다. 적용 역할은 이 값들을 쓰기만 하고 읽지 못한다(ADR-0011).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-secrets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
    steps:
      - name: 역할 확인
        id: gate
        env:
          REF: ${{ github.ref }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "역할이 없어 건너뜀: 저장소 변수 AWS_APPLY_ROLE_ARN이 비어 있습니다" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$REF" != refs/heads/develop ]; then echo "::error::develop에서만 됩니다(적용 역할이 develop만 믿음). 지금: $REF"; exit 1; fi
      - uses: aws-actions/configure-aws-credentials@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          role-to-assume: ${{ env.ROLE }}
          role-session-name: gachita-secrets-${{ github.run_id }}
          aws-region: ap-northeast-2
      - name: SSM에 넣기
        if: steps.gate.outputs.skip != 'true'
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ARGOCD_DEPLOY_KEY: ${{ secrets.ARGOCD_DEPLOY_KEY }}
        run: |
          umask 077
          put() { # put <비밀 값 이름> <SSM 경로>
            local value=${!1}
            if [ -z "$value" ]; then echo "- \`$1\`: 비어 있어 건너뜀" >> "$GITHUB_STEP_SUMMARY"; return; fi
            local f; f=$(mktemp)
            printf '%s' "$value" > "$f"
            aws ssm put-parameter --overwrite --type SecureString --name "$2" --value "file://$f" > /dev/null
            rm -f "$f"
            echo "- \`$1\` → \`$2\`" >> "$GITHUB_STEP_SUMMARY"
          }
          put GHCR_PULL_TOKEN      /gachita/dev/app/ghcr-pull-token
          put GOOGLE_CLIENT_ID     /gachita/dev/app/google/GOOGLE_CLIENT_ID
          put GOOGLE_CLIENT_SECRET /gachita/dev/app/google/GOOGLE_CLIENT_SECRET
          put ARGOCD_DEPLOY_KEY    /gachita/dev/bootstrap/argocd-deploy-key
          cat "$GITHUB_STEP_SUMMARY"
