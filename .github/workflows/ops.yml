name: ops

# 운영(T57). 떠 있는 서버에 SSM으로 명령을 보낸다. 명령과 확인은 backend/infra/infra.sh 에 있고, 사람이 로컬에서 돌려도 같다.
#   status     노드, 구축 단계, 앱 물결, Postgres·WAL 보관·최근 백업, ALB 대상, 실제 주소. 하나라도 정상이 아니면 실패
#   converge   구축 단계 다시 돌리기(stages, 비우면 전부). 단계마다 이미 됐는지 먼저 본다
#   backup     손 전체 백업
#   restore    지정 시점 복구(target_time, 비우면 마지막 WAL까지). 옆에 db-pitr을 세워 걸린 시간과 표마다 행 수를 db와 비교한다.
#              먼저 apply 없이(연습) 돌려 행 수를 본 뒤, 덮어쓸 때만 apply(db를 먼저 백업)
#   clean-e2e  실제 주소 E2E(live-e2e)와 부하 시험이 남긴 여행(제목이 'E2E '로 시작)을 지운다
# 서버가 없으면(접힌 상태) 분명히 실패한다. develop에서만(적용 역할이 develop만 믿음). 펴기·접기와 겹치지 않게 같은 줄에 선다.
# 매시 status를 저절로 돌린다(#180): 디스크 70%, WAL 보관 실패·밀림, 마지막 전체 백업 26시간 넘음, 복구 구간 없음도 실패로 본다.
# 실패하면 GitHub의 워크플로 실패 알림이 간다(이 줄을 마지막으로 고친 사람에게). 접혀 있으면(서버 없음) 건너뛴다.
on:
  schedule:
    - cron: "17 * * * *" # 매시 17분(정각에 몰리는 GitHub 지연을 피함). 기본 브랜치 develop에서 돈다
  workflow_dispatch:
    inputs:
      action:
        description: 할 일
        type: choice
        options: [status, converge, backup, restore, clean-e2e]
        required: true
      stages:
        description: converge의 단계(쉼표로. os,k3s,cilium,oidc,argocd,root,verify). 비우면 전부
        type: string
        default: ""
      target_time:
        description: restore의 시각(RFC 3339, 예 2026-11-13T15:00:00+09:00). 비우면 마지막 WAL까지
        type: string
        default: ""
      apply:
        description: restore에서 복구한 데이터를 db에 덮어쓴다(끄면 연습. db는 그대로)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC 토큰으로 AWS 역할을 받는다
  actions: read # 주기 실행이 펴기·접기가 도는 중인지 본다

# 손 실행은 infra 워크플로(펴기·접기)와 같은 줄. 주기 실행은 따로 선다: 같은 줄에서는 대기 중인 실행이 새 실행에 밀려
# 취소되므로(GitHub 동시성 규칙) 매시 status가 기다리던 접기를 지울 수 있다. 대신 펴기·접기가 도는 중이면 건너뛴다
concurrency:
  group: ${{ github.event_name == 'schedule' && 'ops-status' || 'infra' }}
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # -eo pipefail: tee 앞의 실패가 묻히지 않게
    steps:
      - name: develop에서만
        if: github.ref != 'refs/heads/develop'
        run: |
          echo "::error::운영 워크플로는 develop에서만 됩니다(적용 역할이 develop만 믿음). 지금: $GITHUB_REF"
          exit 1
      - name: 역할 확인
        if: vars.AWS_APPLY_ROLE_ARN == ''
        run: |
          echo "::error::저장소 변수 AWS_APPLY_ROLE_ARN이 비어 있습니다(backend/infra/terraform/README.md의 '처음 한 번')"
          exit 1
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gachita-ops-${{ inputs.action || 'status' }}-${{ github.run_id }}
          aws-region: ap-northeast-2
      - name: 접혀 있거나 펴기·접기 중이면 건너뜀(주기 실행만)
        id: folded
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow infra.yml --status in_progress --json databaseId -q length)
          [ "$busy" = 0 ] || skip "펴기·접기(infra)가 도는 중이라 status를 건너뜀"
          id=$(aws ec2 describe-instances --filters Name=tag:Name,Values=gachita-dev-k3s \
            Name=instance-state-name,Values=pending,running,stopping,stopped --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$id" ] || skip "접혀 있어(서버 없음) status를 건너뜀"
      - name: ${{ inputs.action || 'status' }}
        if: steps.folded.outputs.skip != 'true'
        env: # 입력은 환경 변수로만 넘긴다. 형식은 infra.sh가 본다
          ACTION: ${{ inputs.action || 'status' }}
          STAGES: ${{ inputs.stages }}
          TARGET_TIME: ${{ inputs.target_time }}
          APPLY: ${{ inputs.apply && 'apply' || '' }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case $ACTION in
            converge) set -- converge "$STAGES" ;;
            restore) set -- restore "$TARGET_TIME" "$APPLY" ;;
            *) set -- "$ACTION" ;;
          esac
          if ! backend/infra/infra.sh "$@" 2>&1 | tee "$RUNNER_TEMP/ops.log"; then
            # 주기 실행 도중 펴기·접기가 시작됐으면 그 때문에 실패한 것이라 알리지 않는다
            if [ "$EVENT" = schedule ] && [ "$(gh run list -R "$GITHUB_REPOSITORY" --workflow infra.yml --status in_progress --json databaseId -q length)" != 0 ]; then
              echo "펴기·접기(infra)가 그사이 시작돼 이번 status는 건너뜀" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            exit 1
          fi
      - name: 요약
        if: always() && steps.folded.outputs.skip != 'true'
        env:
          ACTION: ${{ inputs.action || 'status' }}
        run: |
          {
            echo "### ops: $ACTION"
            echo '```'
            tail -n 80 "$RUNNER_TEMP/ops.log" 2>/dev/null || echo "(명령이 돌기 전에 멈춤)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
