name: infra

# backend/infra/ 가 바뀐 PR에서만 돈다. 자원을 만들지 않고 형식과 정합성만 본다.
on:
  pull_request:
    paths: ["backend/infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main, develop]
    paths: ["backend/infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
      - name: Terraform 형식
        run: terraform -chdir=backend/infra/terraform fmt -check -recursive -diff
      - name: Terraform 정합성 (계정에 접속하지 않음)
        run: |
          terraform -chdir=backend/infra/terraform init -backend=false -input=false
          terraform -chdir=backend/infra/terraform validate
      - name: 클러스터 선언 조립과 스키마 검사
        run: |
          catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in backend/infra/gitops/bootstrap backend/infra/gitops/platform backend/infra/gitops/apps/api/overlays/dev; do
            echo "== $dir"
            kubectl kustomize "$dir" | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 \
              -strict -summary -schema-location default -schema-location "$catalog" -
          done
