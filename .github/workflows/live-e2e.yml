name: live-e2e

# 실제 주소(Cloudflare → 클러스터 → DB 둘)에 대고 E2E를 돈다(T54). 이미지에 대고 도는 것과 같은 스크립트(.github/scripts/e2e.mjs).
# 필수 검사(ci.yml)와 따로 돈다. 손으로 돌리거나(Actions → live-e2e → Run workflow), 펴기·내보내기 워크플로가 부른다(workflow_call).
# 시험 데이터: 프로필은 E2E가 마지막에 지운다. 여행(제목 'E2E 양양')과 그 참가자·부탁은 실제 DB에 남는다.
# 여행을 지우는 API가 없어, 지우기는 운영 워크플로(ops의 clean-e2e, T57)가 맡는다. 지우지 않아도 API가 48시간 뒤 지운다.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 대상 주소
        type: string
        default: https://gachita.mangowhois.ai
  workflow_call:
    inputs:
      url:
        type: string
        default: https://gachita.mangowhois.ai

permissions:
  contents: read

concurrency:
  group: live-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, gachita]
    timeout-minutes: 10
    env:
      URL: ${{ inputs.url }} # 셸에는 환경 변수로만 넘긴다
    steps:
      - name: 닿는지(클러스터가 떠 있는지)
        run: |
          case "$URL" in https://* | http://*) ;; *) echo "::error::주소는 https:// 또는 http://로 시작해야 합니다: $URL"; exit 1 ;; esac
          URL=${URL%/}
          code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' "$URL/healthz" || true)
          echo "healthz=$code"
          if [ "$code" != 200 ]; then
            echo "::error::$URL/healthz 가 200이 아닙니다($code). 클러스터가 떠 있는지(펴기, T53) 먼저 봅니다"
            echo "### 실제 주소 E2E: \`$URL\` 닿지 않음(healthz=$code)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      # 첫 화면이 가리키는 모듈 스크립트가 받아지는지. CDN으로 옮긴 뒤(T179)에는 다른 출처라 CORS 머리말이 없으면 화면이 뜨지 않는다
      - name: 첫 화면의 스크립트(200, 다른 출처면 CORS)
        run: |
          URL=${URL%/}
          src=$(curl -sS -m 10 "$URL/" | sed -n 's/.*<script[^>]*type="module"[^>]*src="\([^"]*\)".*/\1/p' | head -1)
          [ -n "$src" ] || { echo "::error::첫 화면에서 모듈 스크립트를 찾지 못함"; exit 1; }
          case "$src" in http://* | https://*) full=$src ;; *) full="$URL$src" ;; esac
          head=$(curl -sS -m 20 -o /dev/null -D - -H "Origin: $URL" "$full")
          printf '%s\n' "$head" | grep -Eq '^HTTP/[0-9.]+ 200' || { echo "::error::스크립트가 200이 아님: $full"; exit 1; }
          case "$full" in "$URL"/*) ;; *) printf '%s\n' "$head" | grep -iq "^access-control-allow-origin: $URL" || { echo "::error::CORS 머리말이 없음: $full"; exit 1; } ;; esac
          echo "script=$full ok"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: E2E(여행 하나의 흐름)
        env:
          E2E_WAIT_SECONDS: 30
        run: node .github/scripts/e2e.mjs "${URL%/}" 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: 요약
        if: always() && hashFiles('.github/scripts/e2e.mjs') != ''
        run: |
          {
            echo "### 실제 주소 E2E: \`$URL\`"
            echo '```'
            tail -n 40 "$RUNNER_TEMP/e2e.log" 2>/dev/null || echo "(E2E가 돌기 전에 멈춤)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
