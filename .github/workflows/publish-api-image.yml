name: publish-api-image

# 평소에는 로컬에서 make push로 올린다. 이 워크플로는 깨끗한 환경에서 다시 만들 때만 쓴다.
# 수동으로만 돈다(Actions 탭 → publish-api-image → Run workflow). 고른 브랜치의 커밋으로 이미지를 만든다.
# 클러스터에 반영하려면 backend/infra/gitops/apps/api/overlays/dev 의 newTag를 올린 태그로 바꾸는 PR을 올린다.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/team-pitcrew/gachita-api
    steps:
      - uses: actions/checkout@v7
      - name: GHCR 로그인
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: ARM 빌드 준비 (서버가 Graviton이다)
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
      - name: 빌드해서 올리기
        run: |
          docker buildx build --platform linux/arm64 --push \
            -f backend/api/Dockerfile \
            -t "$IMAGE:$GITHUB_SHA" .
          echo "올린 이미지: \`$IMAGE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
