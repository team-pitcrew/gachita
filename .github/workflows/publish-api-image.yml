name: publish-api-image

# ARM64 이미지(서버가 Graviton이다)를 만들어 GHCR에 올린다. 태그는 커밋 SHA 앞 12자(make push·make deploy-tag와 같은 규칙).
# - develop 병합: ci.yml의 publish 잡이 부른다. 같은 커밋의 검사 일곱 개(package의 E2E 포함)가 통과하고
#   이미지에 들어가는 파일이 바뀐 때만이다.
# - 손으로: 깨끗한 환경에서 다시 만들 때 Actions 탭 → publish-api-image → Run workflow. 고른 브랜치의 커밋으로 만든다.
# 클러스터에 반영하려면 backend/infra/gitops/apps/api/overlays/dev 의 newTag를 올린 태그로 바꾸는 PR을 올린다(make deploy-tag).
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, gachita]
    timeout-minutes: 20
    # 병합이 잇따르면 차례로 올린다
    concurrency:
      group: publish-api-image
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/team-pitcrew/gachita-api
    steps:
      - uses: actions/checkout@v7
      - name: GHCR 로그인
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: ARM 빌드 준비
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
      - name: 빌드해서 올리기
        run: |
          tag="${GITHUB_SHA::12}"
          docker buildx build --platform linux/arm64 --push \
            -f backend/api/Dockerfile \
            -t "$IMAGE:$tag" .
          {
            echo "올린 이미지: \`$IMAGE:$tag\` (커밋 \`$GITHUB_SHA\`)"
            echo
            echo "배포하려면 \`make deploy-tag TAG=$tag\` 변경을 backend-infra PR로 올립니다."
          } >> "$GITHUB_STEP_SUMMARY"
