# 같이타 API와 그 Postgres. CloudNativePG가 올라온 뒤에 맞춘다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gachita-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: git@github.com:team-pitcrew/gachita.git
    targetRevision: develop
    path: infra/gitops/apps/api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gachita
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 5m } }
