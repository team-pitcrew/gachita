# 밖에서 들어오는 길. 인증서는 cert-manager가 받아 오고, 한 주소에서 오는 요청 수를 제한한다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
spec:
  rateLimit:
    average: 20 # 한 주소에서 초당 20회
    burst: 40
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gachita-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: gachita-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.example.invalid]
      secretName: gachita-api-tls
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gachita-api
                port: { name: http }
