# 다시 펼 때의 Postgres(T52, ADR-0017 3절). 데이터 버킷에 전체 백업이 있으면 구축 6단계가 뿌리 앱을 통해 db 앱의 경로를
# 여기로 바꾼다. 선언은 위 폴더 그대로이고 시작 방식만 initdb → recovery로 바꾼다.
#   - 같은 경로(postgres/db)의 마지막 전체 백업과 그 뒤 WAL을 끝까지 되감고, 새 타임라인으로 같은 경로에 이어 쓴다
#   - 그래서 운영자의 '빈 보관소' 검사를 여기서만 끈다. 같은 경로를 두 클러스터가 같이 쓰는 일은 없다(접힌 뒤에만 편다)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  - target: { kind: Cluster, name: db }
    patch: |-
      - op: replace
        path: /spec/bootstrap
        value:
          recovery:
            source: origin
            database: trips
            owner: trips
      - op: add
        path: /spec/externalClusters
        value:
          - name: origin
            plugin:
              name: barman-cloud.cloudnative-pg.io
              parameters:
                barmanObjectName: backup
                serverName: db
      - op: add
        path: /metadata/annotations/cnpg.io~1skipEmptyWalArchiveCheck
        value: enabled
