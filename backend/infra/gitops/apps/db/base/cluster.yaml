# Postgres 하나(CloudNativePG, ADR-0016). 데이터베이스 둘과 역할 둘로 여행과 프로필을 나눈다.
#   trips: initdb가 만드는 데이터베이스와 소유 역할(비밀 값 db-app은 CloudNativePG가 만듦)
#   profiles: managed.roles의 역할(비밀 값 db-profiles는 External Secrets의 생성기가 만듦, roles.yaml)과 Database profiles
# 서로의 데이터베이스에는 pg_hba가 막는다. 주소는 db-rw.gachita-db.svc.cluster.local(쿠버네티스 DNS).
# ponytail: 인스턴스가 하나라 서버가 죽으면 DB도 멈춘다. 되살리는 길은 S3 백업(ADR-0016의 SLO 표). 노드를 늘리면 instances를 올린다.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
  annotations:
    # Git에서 빠지거나 앱을 지워도 DB는 지우지 않는다(데이터 보호). 지울 때는 사람이 직접.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  instances: 1
  # 판 고정(로컬·CI의 postgres:17과 같은 주 판). 백업은 플러그인 사이드카가 하므로 가장 작은 minimal 이미지
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie
  priorityClassName: gachita-data
  bootstrap:
    initdb:
      database: trips
      owner: trips
  managed:
    roles:
      # 소유 역할의 비밀 번호를 언제나 비밀 값에 맞춘다. 복구로 펼 때(백업 속 역할에 옛 비밀 번호) 새 db-app과 어긋나지 않게
      - name: trips
        ensure: present
        login: true
        passwordSecret: { name: db-app }
      - name: profiles
        ensure: present
        login: true
        passwordSecret: { name: db-profiles }
  postgresql:
    pg_hba:
      # 역할은 자기 데이터베이스에만. CloudNativePG 기본 규칙보다 앞에 들어간다
      - host trips profiles all reject
      - host profiles trips all reject
  storage:
    size: 8Gi
  # 메모리 요청=한도: 노드가 모자라도 축출 순위에서 뒤로 간다(ADR-0012의 노드 사양 표)
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 512Mi }
  # 이 서비스 계정만 백업 접두사(postgres/db/)에 쓰는 AWS 역할을 받는다(ADR-0011)
  serviceAccountTemplate:
    metadata:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::721622471953:role/gachita-dev-pg
  # 백업과 WAL 보관은 Barman Cloud 플러그인(물결 2)이 ObjectStore backup으로. 경로는 s3://<버킷>/postgres/db
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: backup
