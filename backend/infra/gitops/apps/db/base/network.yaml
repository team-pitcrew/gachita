# DB 네임스페이스의 허용 목록. 나머지는 components/data-plane의 기본 차단에 걸린다.
# 들어오는 길: API 파드(gachita)의 접속, 운영자(cnpg-system)의 상태 확인. 그 밖에서는 닿지 않는다.
# db-pitr은 지정 시점 복구(T57, infra.sh restore)가 잠깐 세우는 옆 클러스터다. 운영자와 나가는 길만 db와 같고, API는 닿지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: db }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gachita }
          podSelector:
            matchLabels: { app: gachita-api }
      ports:
        - { protocol: TCP, port: postgresql }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator
spec:
  podSelector:
    matchExpressions:
      - { key: cnpg.io/cluster, operator: In, values: [db, db-pitr] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { protocol: TCP, port: status }
---
# 나가는 길(클러스터 밖): API 서버(인스턴스 관리자가 자기 Cluster를 지켜봄), STS(웹 신원 토큰 교환), S3(백업).
# 이름으로 막는 것은 Cilium만 할 수 있어 CiliumNetworkPolicy로 둔다.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: db-egress
spec:
  endpointSelector:
    matchExpressions:
      - { key: cnpg.io/cluster, operator: In, values: [db, db-pitr] }
  egress:
    - toEntities: [kube-apiserver]
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toFQDNs:
        - matchPattern: "*.s3.ap-northeast-2.amazonaws.com"
        - matchName: s3.ap-northeast-2.amazonaws.com
        - matchPattern: "*.s3.amazonaws.com"
        - matchName: sts.ap-northeast-2.amazonaws.com
        - matchName: sts.amazonaws.com
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
