# gachita 네임스페이스의 허용 목록. 나머지는 기본 차단(components/data-plane).
# 들어오는 길: ALB만(공개 서브넷 대역 10.10.0.0/23, Terraform network.tf). 나가는 길: Postgres, 구글 OAuth.
# 노드가 하나라 NodePort로 들어온 요청은 출발지(ALB 주소)가 그대로 파드에 닿는다(Cilium, 대상 파드가 같은 노드).
# ponytail: 워커를 붙이면 다른 노드를 거친 요청의 출발지가 노드 주소로 바뀐다. 그때 remote-node를 더한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-alb
spec:
  podSelector:
    matchLabels: { app: gachita-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.10.0.0/23 }
      ports:
        - { protocol: TCP, port: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-to-db
spec:
  podSelector:
    matchLabels: { app: gachita-api }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gachita-db }
          podSelector:
            matchLabels: { cnpg.io/cluster: db }
      ports:
        - { protocol: TCP, port: postgresql }
---
# 구글 OAuth의 토큰 교환과 사용자 정보(backend/api/providers/google.js). 이름으로만 연다.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: api-egress
spec:
  endpointSelector:
    matchLabels: { app: gachita-api }
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toFQDNs:
        - matchName: oauth2.googleapis.com
        - matchName: openidconnect.googleapis.com
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
