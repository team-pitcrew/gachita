apiVersion: apps/v1
kind: Deployment
metadata:
  name: gachita-api
spec:
  replicas: 2
  # T121: 새 파드가 준비된 뒤에 옛 파드를 하나씩 내린다. T93의 Recreate는 배포마다 둘을 모두 내려 ALB가 502를 냈다(11/14).
  # 48시간 삭제가 남은 T90 이전 이미지로는 되돌리지 않는다(gitops/README.md).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: gachita-api }
  template:
    metadata:
      labels: { app: gachita-api }
    spec:
      serviceAccountName: gachita-api
      automountServiceAccountToken: false
      priorityClassName: gachita-app # 메모리가 모자라면 컨트롤러·DB보다 먼저 밀려난다
      imagePullSecrets:
        - name: ghcr-pull # External Secrets가 SSM의 read:packages 토큰으로 만든다
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway # 지금은 노드가 하나. 늘리면 저절로 나뉜다
          labelSelector:
            matchLabels: { app: gachita-api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: short-tmp
          emptyDir: { sizeLimit: 1Gi }
      containers:
        - name: api
          image: ghcr.io/team-pitcrew/gachita-api # 태그는 overlays에서 정한다
          ports:
            - { name: http, containerPort: 8787 } # 이 숫자는 여기 한 곳. Service·정책은 이름 http로 가리킨다
          env:
            - { name: PORT, value: "8787" }
            # 여행과 프로필은 서로 다른 Postgres(네임스페이스)다(T23·T26). 주소는 External Secrets가 db-urls로 만든다
            - name: TRIPS_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-urls, key: TRIPS_DATABASE_URL }
            - name: PROFILES_DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-urls, key: PROFILES_DATABASE_URL }
            # 녹음 클립 버킷(T64·T76, Terraform persist/). 자격은 서비스 계정 역할: 웹훅이 AWS_ROLE_ARN·AWS_REGION·토큰 파일을 넣는다
            - { name: CLIPS_BUCKET, value: gachita-dev-clips-721622471953 }
            # 고른 장면 클립의 재전사(T75, 상현님 Nemotron ASR). 토큰(ASR_TOKEN, 아래 asr Secret)이 있을 때만 보낸다.
            # 주소의 호스트는 network.yaml의 나가는 길과 같아야 한다. 요청 간격(ASR_GAP_MS, 기본 파드마다 1.1초)은 파드 둘이
            # 상대 서버 한도(IP당 초당 2건) 아래에 들게 정한 값이라 replicas를 바꾸면 같이 맞춘다
            - { name: ASR_URL, value: "https://llm.kikum.xyz/asr/v1" }
            # 키 연결과 유료 생성 활성화를 분리합니다. 크레딧·실제 생성 검증 전에는 새 작업을 받지 않습니다(T86).
            - { name: SHORTS_ENABLED, value: "false" }
            - { name: SHORTS_DAILY_SECONDS, value: "120" }
            - { name: HF_OUTPUT_HOSTS, value: "cdn.higgsfield.ai,cdn.higgsfield.work,images.higgs.ai,d28lhcrx5qdowv.cloudfront.net" }
          # 구글 OAuth·ASR·힉스필드 자격은 선택 Secret입니다. 값이 없어도 기본 API는 뜹니다.
          envFrom:
            - secretRef: { name: google-oauth, optional: true }
            - secretRef: { name: asr, optional: true }
            - secretRef: { name: higgsfield, optional: true }
          volumeMounts:
            - { name: short-tmp, mountPath: /tmp }
          # 내려갈 때 서비스 대상에서 먼저 빠지도록 종료 신호 전에 기다린다(T121). 그 사이 들어온 요청은 끝까지 처리한다
          lifecycle:
            preStop:
              sleep: { seconds: 10 }
          # 준비: 두 DB에 닿아야 요청을 받는다. 살아 있음: 프로세스만 본다(DB가 잠깐 멈췄다고 API를 다시 띄우지 않음)
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi, ephemeral-storage: 512Mi }
            limits: { memory: 1Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gachita-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: gachita-api }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gachita-api
  annotations:
    # 클립 버킷을 읽고 쓰는 AWS 역할(Terraform iam.tf의 api, ADR-0011). 쿠버네티스 API 토큰은 여전히 넣지 않는다:
    # 웹훅은 STS용 토큰(audience sts.amazonaws.com)만 따로 붙인다(automountServiceAccountToken과 무관)
    eks.amazonaws.com/role-arn: arn:aws:iam::721622471953:role/gachita-dev-api
automountServiceAccountToken: false
