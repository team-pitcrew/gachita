# ALB의 대상은 노드의 이 NodePort다(인스턴스 대상, ADR-0016). 번호는 쿠버네티스가 고르고 컨트롤러가 대상 그룹에 맞춘다.
# 포트 규칙(platform/cluster-base)은 NodePort를 이 서비스 하나에만 허용한다. 클러스터 안에서는 이름
# gachita-api.gachita.svc.cluster.local:80 으로 닿는다.
apiVersion: v1
kind: Service
metadata:
  name: gachita-api
spec:
  type: NodePort
  selector: { app: gachita-api }
  ports:
    - { name: http, port: 80, targetPort: http }
