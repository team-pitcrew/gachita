# API가 받는 비밀 값 여섯. 저장소에는 값이 없고, External Secrets가 만든다(ADR-0012의 '비밀 값이 가는 길').

# 1) DB 주소 둘. 같은 Postgres(gachita-db)의 데이터베이스 둘과 역할 둘(ADR-0016). 주소는 쿠버네티스 DNS의 전체 이름
#    db-rw.gachita-db.svc.cluster.local(읽고 쓰는 쪽 서비스)로 적는다. db-reader는 그 네임스페이스의 Secret 둘만 읽는다
#    (apps/db/reader.yaml).
#    질의 하나는 2초에서 끊는다(T26, statement_timeout). 한 Postgres를 두 데이터베이스가 같이 쓰므로(ADR-0016 2절)
#    한쪽의 무거운 질의가 다른 쪽을 오래 붙잡지 못하게 한다. 2초는 SLO의 지연 임계값(조회 200 ms, 쓰기 1초)을 이미 넘긴
#    값이고, EC2에서 잰 ALB 대상 응답 시간 p99(19 ms, T62)의 100배다. 끊긴 질의는 57014 오류로 API의 500이 된다(서버 코드는 그대로).
#    이 역할로 도는 서버 시작 때의 표 만들기도 같이 걸린다. 오래 걸리는 마이그레이션이 생기면 그 파일 안에서 SET LOCAL로 푼다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: db
spec:
  provider:
    kubernetes:
      remoteNamespace: gachita-db
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: db-reader }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-urls
spec:
  refreshInterval: 1h
  secretStoreRef: { name: db, kind: SecretStore }
  target:
    name: db-urls
    creationPolicy: Owner
    template:
      data:
        TRIPS_DATABASE_URL: "postgresql://trips:{{ .trips | urlquery }}@db-rw.gachita-db.svc.cluster.local:5432/trips?options=-c%20statement_timeout%3D2s"
        PROFILES_DATABASE_URL: "postgresql://profiles:{{ .profiles | urlquery }}@db-rw.gachita-db.svc.cluster.local:5432/profiles?options=-c%20statement_timeout%3D2s"
  data:
    - secretKey: trips
      remoteRef: { key: db-app, property: password }
    - secretKey: profiles
      remoteRef: { key: db-profiles, property: password }
---
# 2) 이미지 받기. SSM의 read:packages 토큰(사람이 gh secret set GHCR_PULL_TOKEN)으로 이 네임스페이스만 받는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "x-access-token:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef: { key: /gachita/dev/app/ghcr-pull-token }
---
# 3) 구글 OAuth. 선택 값: SSM에 없으면 Secret을 만들지 않고 '건강'으로 끝난다(deletionPolicy: Delete).
#    배포는 optional로 받으므로 서버는 구글 없이 뜬다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: google-oauth
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: /gachita/dev/app/google/GOOGLE_CLIENT_ID }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: /gachita/dev/app/google/GOOGLE_CLIENT_SECRET }
---
# 4) 재전사(T75) 토큰. 선택 값: 구글 OAuth와 같이 SSM에 없으면 Secret이 없고 서버는 보내지 않는다.
#    값은 사람이 gh secret set ASR_TOKEN 하고 infra-secrets 워크플로가 SSM으로 옮긴다. 환경 변수는 파드가 뜰 때 읽으므로
#    넣거나 바꾼 뒤에는 Secret을 맞추고(force-sync 주석, 아니면 1시간 안) Secret asr이 생긴 것을 본 뒤 API를 다시 띄운다
#    (값이 없어도 Ready=True SecretDeleted라 Ready로는 가릴 수 없다). 끄기: gh secret delete로는 SSM 값이 남으니
#    aws ssm delete-parameter --name /gachita/dev/app/asr/ASR_TOKEN 뒤 같은 순서, 또는 ASR_URL을 빼는 PR
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: asr
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: asr
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: ASR_TOKEN
      remoteRef: { key: /gachita/dev/app/asr/ASR_TOKEN }

---
# 5) 쇼츠 생성 일꾼 토큰(T157, ADR-0025). 운영자 맥의 일꾼만 같은 값을 갖고 /api/short-worker/*에 들어온다.
# 사람이 gh secret set SHORTS_WORKER_TOKEN → infra-secrets가 SSM에 넣는다. 토큰이 있어도 SHORTS_ENABLED=false이면 작업을 내주지 않는다.
# 바꾼 뒤에는 Secret 동기화와 롤아웃, 맥의 환경 파일 교체가 함께 필요하다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shorts-worker
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: shorts-worker
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: SHORTS_WORKER_TOKEN
      remoteRef: { key: /gachita/dev/app/shorts-worker/SHORTS_WORKER_TOKEN }

---
# 6) 미디어 CDN 서명 값 셋(T179, ADR-0026). API가 쇼츠·표지·프로필 사진의 CloudFront 주소를 서명한다.
# 개인키는 사람이 넣은 저장소 비밀 값(MEDIA_PRIVATE_KEY → infra-secrets → SSM app/), 주소와 키 번호는 Terraform이 쓴 값(SSM tf/, persist/media.tf).
# 선택 값: 셋 가운데 하나라도 SSM에 없으면 Secret이 없고 서버는 지금처럼 본문을 직접 흘려보낸다.
# 키를 바꿀 때는 새 공개 키를 CloudFront 키 묶음에 먼저 더한 뒤 개인키와 키 번호를 바꾸고 API를 다시 띄운다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-cdn
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: media-cdn
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: MEDIA_CDN_BASE
      remoteRef: { key: /gachita/dev/tf/media/MEDIA_CDN_BASE }
    - secretKey: MEDIA_KEY_PAIR_ID
      remoteRef: { key: /gachita/dev/tf/media/MEDIA_KEY_PAIR_ID }
    - secretKey: MEDIA_PRIVATE_KEY
      remoteRef: { key: /gachita/dev/app/media/MEDIA_PRIVATE_KEY }
