# API가 받는 비밀 값 셋. 저장소에는 값이 없고, External Secrets가 만든다(ADR-0012의 '비밀 값이 가는 길').

# 1) DB 주소 둘. 같은 Postgres(gachita-db)의 데이터베이스 둘과 역할 둘(ADR-0016). 주소는 쿠버네티스 DNS의 전체 이름
#    db-rw.gachita-db.svc.cluster.local(읽고 쓰는 쪽 서비스)로 적는다. db-reader는 그 네임스페이스의 Secret 둘만 읽는다
#    (apps/db/reader.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: db
spec:
  provider:
    kubernetes:
      remoteNamespace: gachita-db
      server:
        caProvider: { type: ConfigMap, name: kube-root-ca.crt, key: ca.crt }
      auth:
        serviceAccount: { name: db-reader }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-urls
spec:
  refreshInterval: 1h
  secretStoreRef: { name: db, kind: SecretStore }
  target:
    name: db-urls
    creationPolicy: Owner
    template:
      data:
        TRIPS_DATABASE_URL: "postgresql://trips:{{ .trips | urlquery }}@db-rw.gachita-db.svc.cluster.local:5432/trips"
        PROFILES_DATABASE_URL: "postgresql://profiles:{{ .profiles | urlquery }}@db-rw.gachita-db.svc.cluster.local:5432/profiles"
  data:
    - secretKey: trips
      remoteRef: { key: db-app, property: password }
    - secretKey: profiles
      remoteRef: { key: db-profiles, property: password }
---
# 2) 이미지 받기. SSM의 read:packages 토큰(사람이 gh secret set GHCR_PULL_TOKEN)으로 이 네임스페이스만 받는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "x-access-token:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef: { key: /gachita/dev/app/ghcr-pull-token }
---
# 3) 구글 OAuth. 선택 값: SSM에 없으면 Secret을 만들지 않고 '건강'으로 끝난다(deletionPolicy: Delete).
#    배포는 optional로 받으므로 서버는 구글 없이 뜬다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: google-oauth
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: google-oauth
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef: { key: /gachita/dev/app/google/GOOGLE_CLIENT_ID }
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef: { key: /gachita/dev/app/google/GOOGLE_CLIENT_SECRET }
