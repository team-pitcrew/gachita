# dev 환경에서 다른 것: 네임스페이스와 이미지 태그. 주소(gachita.mangowhois.ai)와 경로는 apps/edge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gachita
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/team-pitcrew/gachita-api
    newTag: "db15aa6fef74" # 병합 때 ci.yml의 publish가 올린 develop(#148). make deploy-tag TAG=<올린 태그> 로 바꾼다(커밋 SHA 앞 12자, 따옴표 필수)
# 웹 화면 파일의 CDN 접두사(T179, ADR-0026 6절). 이미지 태그와 같은 판이어야 한다: make deploy-tag가 둘을 함께 바꾸고,
# deploy-tag 워크플로가 그 판의 파일을 먼저 올려 CDN에서 받아지는 것을 본 뒤에 PR을 연다.
# 11/16 13:34에 처음 켰을 때는 웹 모듈이 서로를 루트 절대 주소로 불러 화면이 비었다(#622로 끔). 웹이 상대 주소로 바뀐
# 627e78ad4bff(T180) 이후 판에서만 켠다. 그 전 판으로 되돌릴 때는 이 patches 묶음도 같이 뺀다.
patches:
  - target: { kind: Deployment, name: gachita-api }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: WEB_ASSET_BASE, value: "https://media.gachita.mangowhois.ai/public/web/db15aa6fef74" }
