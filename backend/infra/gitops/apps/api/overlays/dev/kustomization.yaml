# dev 환경에서 다른 것: 네임스페이스와 이미지 태그. 주소(gachita.mangowhois.ai)와 경로는 apps/edge.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gachita
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/team-pitcrew/gachita-api
    newTag: "ce335fcabf53" # 병합 때 ci.yml의 publish가 올린 develop(#148). make deploy-tag TAG=<올린 태그> 로 바꾼다(커밋 SHA 앞 12자, 따옴표 필수)
