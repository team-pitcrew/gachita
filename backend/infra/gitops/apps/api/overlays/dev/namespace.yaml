apiVersion: v1
kind: Namespace
metadata:
  name: gachita
  labels:
    gachita.io/data-plane: "true" # 포트 규칙(platform/cluster-base)이 걸린다
    gachita.io/expose: "true" # edge의 Gateway에 경로(HTTPRoute)를 붙일 수 있다
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
