# edge 네임스페이스의 허용 목록. 나머지는 기본 차단(components/data-plane).
#   cloudflared → Traefik(web) → API(gachita, http). Traefik에는 cloudflared만 닿는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-from-cloudflared
  namespace: edge
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: traefik }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: cloudflared }
      ports:
        - { protocol: TCP, port: web }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traefik-to-api
  namespace: edge
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: traefik }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: gachita }
          podSelector:
            matchLabels: { app: gachita-api }
      ports:
        - { protocol: TCP, port: http }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-to-traefik
  namespace: edge
spec:
  podSelector:
    matchLabels: { app: cloudflared }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: traefik }
      ports:
        - { protocol: TCP, port: web }
---
# 클러스터 밖: cloudflared는 Cloudflare 엣지(7844, QUIC은 UDP·HTTP2는 TCP)만, Traefik은 API 서버(경로를 지켜봄)만.
# 호스트 이름은 Cloudflare 문서 'Tunnel with firewall'의 필수 목록. 자동 업데이트는 끈다(--no-autoupdate).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared-egress
  namespace: edge
spec:
  endpointSelector:
    matchLabels: { app: cloudflared }
  egress:
    - toEndpoints:
        - matchLabels: { io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toFQDNs:
        - matchName: region1.v2.argotunnel.com
        - matchName: region2.v2.argotunnel.com
      toPorts:
        - ports: [{ port: "7844", protocol: TCP }, { port: "7844", protocol: UDP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-egress
  namespace: edge
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: traefik }
  egress:
    - toEntities: [kube-apiserver]
