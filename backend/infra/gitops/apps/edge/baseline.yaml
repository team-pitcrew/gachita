# components/data-plane/network-baseline.yaml 과 같은 내용(edge 네임스페이스를 박음). 이 앱은 여러 네임스페이스에 걸쳐 kustomize namespace를 못 쓴다.
# 이 네임스페이스의 모든 파드는 들어오고 나가는 길이 기본으로 막힌다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: edge
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 이름 풀이(CoreDNS)만 연다. 밖의 이름(FQDN)으로 나가는 허용은 CiliumNetworkPolicy가 맡는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: edge
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: dns}
        - {protocol: TCP, port: dns-tcp}
