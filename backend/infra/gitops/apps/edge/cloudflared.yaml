# Cloudflare Tunnel 커넥터(ADR-0010, ADR-0013). 서버가 Cloudflare로 밖으로만 연결하므로 서버에 열린 포트가 없다.
# 경로 규칙은 Cloudflare 쪽(Terraform edge.tf)에 있고, 여기는 토큰만 가진다.
# 두 개를 둔다: 커넥터 하나가 Cloudflare 두 지역에 연결 4개를 열고, Cloudflare가 살아 있는 연결로 나눈다(LB 역할).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: edge
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      automountServiceAccountToken: false
      priorityClassName: gachita-platform
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway # 노드를 늘리면 노드마다 하나씩
          labelSelector:
            matchLabels: { app: cloudflared }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflared-token, key: token }
          ports:
            - { name: metrics, containerPort: 2000 }
          # /ready는 Cloudflare와 연결이 하나라도 살아 있으면 200(Cloudflare 문서의 쿠버네티스 안내)
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: edge
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: cloudflared }
---
# 터널 토큰. Terraform이 만들어 SSM /gachita/dev/tf/ 에 둔 값.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: edge
spec:
  refreshInterval: 1h
  secretStoreRef: { name: ssm, kind: ClusterSecretStore }
  target:
    name: cloudflared-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: /gachita/dev/tf/cloudflare-tunnel-token }
