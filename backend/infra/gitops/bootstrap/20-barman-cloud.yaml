# 물결 2. CloudNativePG 백업 플러그인 v0.16.0(차트 0.9.0). 운영자와 같은 네임스페이스에 둔다(플러그인 문서).
# 내장 barmanObjectStore는 폐기 예정이라 처음부터 플러그인으로 간다. 웹훅 인증서에 cert-manager(물결 1)가 필요하다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman-cloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    targetRevision: 0.9.0
    helm:
      releaseName: plugin-barman-cloud
      valuesObject:
        priorityClassName: gachita-platform
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: CriticalAddonsOnly
            operator: Exists
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 192Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
