# 물결 3. AWS Load Balancer Controller v3.6.2(공식 차트 eks/aws-load-balancer-controller 3.6.2). Gateway(물결 5의 edge)를 보고
# ALB·리스너·대상 그룹·보안 그룹을 만들고 지운다(ADR-0016, ADR-0017). 대상은 노드의 NodePort(인스턴스 대상, Cilium 오버레이라 IP 대상 불가).
# 물결 3인 이유: AWS 자격은 파드 신원 웹훅(물결 2)이 파드를 만들 때 넣는다. 웹훅은 실패해도 통과시키므로(failurePolicy: Ignore)
# 웹훅보다 먼저 뜬 파드는 자격 없이 뜨고 저절로 고쳐지지 않는다. 웹훅 인증서를 주는 cert-manager(물결 1)도 이미 있다.
# 값을 Git에 펼 때마다 바뀌는 것을 두지 않는다: VPC는 이름 태그로 찾고(vpcTags), 인증서는 리스너의 호스트 이름으로 찾는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.6.2
    helm:
      releaseName: aws-load-balancer-controller
      valuesObject:
        clusterName: gachita-dev # Terraform의 local.cluster, 서브넷·노드 보안 그룹의 kubernetes.io/cluster/<이름> 태그와 같아야 함
        region: ap-northeast-2 # IMDS 홉 1이라 파드가 메타데이터를 못 읽는다. 지역과 VPC를 직접 준다
        vpcTags:
          Name: gachita-dev
        replicaCount: 1 # 노드 하나. 늘리면 리더 선출로 하나만 일함
        serviceAccount:
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::721622471953ole/gachita-dev-alb-controller
        defaultTags:
          Project: gachita # 같이 쓰는 계정에서 컨트롤러가 만든 것을 가리고(권한 경계의 조건), 접은 뒤 남은 것을 찾는다
        enableCertManager: true # 웹훅 인증서를 cert-manager로(차트가 매번 새로 만들면 Argo CD가 늘 바뀐 것으로 봄)
        enableServiceMutatorWebhook: false # LoadBalancer 서비스를 쓰지 않는다
        createIngressClassResource: false # Ingress가 아니라 Gateway API로 쓴다
        enableShield: false
        enableWaf: false
        enableWafv2: false
        priorityClassName: gachita-platform
        nodeSelector:
          node-role.kubernetes.io/control-plane: "true"
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: CriticalAddonsOnly
            operator: Exists
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true # CRD가 커서 클라이언트 적용의 주석 한도를 넘는다
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
