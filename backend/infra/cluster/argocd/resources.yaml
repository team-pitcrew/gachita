# Argo CD 다섯 구성 요소의 요청·한도(MiB)와 자리(컨트롤 플레인 노드, ADR-0013의 '컨트롤러'). 차트·매니페스트에 기본값이 없어 이 구성의 어림이다(ADR-0012).
# repo-server와 controller는 동기화 때 차트를 그리며 잠깐 커지므로 한도를 넉넉히 둔다. CPU 한도는 두지 않는다(스로틀링 방지).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      priorityClassName: gachita-platform
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: CriticalAddonsOnly, operator: Exists }
      containers:
        - name: argocd-application-controller
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      priorityClassName: gachita-platform
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: CriticalAddonsOnly, operator: Exists }
      containers:
        - name: argocd-repo-server
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      priorityClassName: gachita-platform
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: CriticalAddonsOnly, operator: Exists }
      containers:
        - name: argocd-server
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      priorityClassName: gachita-platform
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: CriticalAddonsOnly, operator: Exists }
      containers:
        - name: redis
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      priorityClassName: gachita-platform
      nodeSelector: { node-role.kubernetes.io/control-plane: "true" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
        - { key: CriticalAddonsOnly, operator: Exists }
      containers:
        - name: argocd-applicationset-controller
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
