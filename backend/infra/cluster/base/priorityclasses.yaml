# 메모리가 모자랄 때 누가 먼저 밀려나는지(ADR-0012의 가용성). 높을수록 오래 남는다.
# Argo CD가 이 클래스를 쓰므로 Argo CD보다 먼저(구축 5단계) 넣는다. Cilium·CoreDNS는 쿠버네티스 기본 클래스를 쓴다.
apiVersion: scheduling.k8s.io/v1
