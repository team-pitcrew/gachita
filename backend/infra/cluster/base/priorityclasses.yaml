metadata:
  name: gachita-data
value: 900000
description: "Postgres (trips, profiles)"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: gachita-app
value: 100000
description: "API. Evicted first under memory pressure"
