plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
 namespace 'io.github.teampitcrew.gachita'
 compileSdk 34
 defaultConfig { applicationId 'io.github.teampitcrew.gachita'; minSdk 29; targetSdk 34; versionCode 1; versionName '0.1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildFeatures { compose true }
 useLibrary 'android.car' // 주행 제한 값(CarUxRestrictionsManager). SDK의 optional/android.car.jar로 빌드하고 기기에 있는 것을 씀
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.09.03')
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.ui:ui'
 implementation 'androidx.activity:activity-compose:1.9.2'
 implementation 'ai.pleos.playground:Vehicle:2.3.2'
 implementation 'ai.pleos.playground:NaviHelper:3.0.5'
 implementation 'ai.pleos.playground:TextToSpeech:3.3.1'
 implementation 'ai.pleos.playground:SpeechToText:3.3.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303' // 단위 테스트에서 android.jar의 org.json은 빈 껍데기라 진짜를 넣는다
}
