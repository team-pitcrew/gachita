<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>가치타 · 함께 탄 이야기를 남겨요</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/gachita-180.png" />
  <meta property="og:image" content="https://gachita.mangowhois.ai/brand/gachita-social.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/demo/demo.css" />
</head>
<body class="web-capture">
  <input id="capture-file" type="file" hidden aria-label="원음 영상·음성 파일" accept=".mp4,.m4v,.mov,.webm,.wav,.mp3,.m4a,.aac,.ogg,video/mp4,video/quicktime,audio/wav,audio/x-wav,audio/mpeg,audio/mp4,audio/*,video/*" />
  <header class="demo-header">
    <a class="brand" href="/demo/"><img src="/icons/gachita-192.png" alt="" />가치타 <span>함께 탄 이야기</span></a>
    <div class="demo-tools"><span id="connection" role="status">서버 연결 중</span><a href="/" target="_blank" rel="noopener">내 휴대폰 화면 ↗</a></div>
  </header>
  <main class="workspace">
    <section class="journey-workspace" aria-label="여행 기록">
      <div id="trip-heading"></div>
      <nav id="journey-nav" class="workspace-nav" aria-label="여행 메뉴"></nav>
      <div id="workspace-body"></div>
    </section>
    <aside class="companion" aria-label="동승자의 휴대폰">
      <header><h2>동승자의 휴대폰</h2><p>같은 여행의 대화와 쇼츠를 이어 봅니다.</p></header>
      <iframe id="phone" src="/" title="실제 가치타 모바일 앱"></iframe>
    </aside>
  </main>
  <dialog id="viewer" class="demo-viewer" aria-label="대화와 쇼츠"><header><span id="viewer-title"></span><button id="viewer-close" type="button" aria-label="닫기">닫기</button></header><iframe title="여행의 대화와 쇼츠" id="viewer-frame"></iframe></dialog>
  <dialog id="settings" class="demo-settings" aria-labelledby="settings-title"></dialog>
  <p id="toast" role="status" hidden></p>
  <script type="module" src="/demo/demo.js"></script>
</body>
</html>
