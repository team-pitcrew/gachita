<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17161f" media="(prefers-color-scheme: dark)" />
    <title>가치타</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- 글꼴은 Pretendard. 받지 못하면 기기의 한글 글꼴로 보인다. 배포할 때는 파일을 직접 싣는다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main id="app"></main>

    <!-- 부탁 남기기. 화면을 다시 그려도 닫히지 않도록 #app 밖에 둔다. -->
    <dialog id="sheet" aria-labelledby="sheet-title">
      <form id="sheet-form">
        <h2 id="sheet-title">어떤 부탁인가요?</h2>
        <div class="chips" id="sheet-quick"></div>
        <label class="field">
          <span>부탁 내용</span>
          <input id="sheet-text" name="text" required maxlength="200" autocomplete="off" placeholder="예: 화장실 가고 싶어요" />
        </label>
        <fieldset>
          <legend>언제 챙길까요?</legend>
          <div class="chips two" id="sheet-when"></div>
        </fieldset>
        <div class="row">
          <button type="button" id="sheet-close">닫기</button>
          <button class="primary grow">남기기</button>
        </div>
      </form>
    </dialog>

    <p id="toast" role="status" hidden></p>
    <!-- 절대 주소: 초대 주소(/j/<코드>)에서도 같은 파일을 읽는다 -->
    <script type="module" src="/app.js"></script>
  </body>
</html>
